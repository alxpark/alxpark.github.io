<script>// Builds original demo tunes as real VGM files (register-level), one per system.
// Usable in the browser (global buildDemo) and in node (module.exports).
(function (root) {
  const SR = 44100;
  const BPM = 132;
  const STEP = Math.round(SR * 60 / BPM / 4); // samples per 16th
  const NAMES = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  const midiOf = (s) => {
    const m = /^([A-G])(#|b)?(-?\d)$/.exec(s);
    let n = NAMES[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
    return n + (parseInt(m[3], 10) + 1) * 12;
  };
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);

  // ---------------- the song (A minor, 16 bars) ----------------
  const CHORDS = [
    ['A2', [0, 3, 7]], ['A2', [0, 3, 7]], ['F2', [0, 4, 7]], ['F2', [0, 4, 7]],
    ['C3', [0, 4, 7]], ['C3', [0, 4, 7]], ['G2', [0, 4, 7]], ['G2', [0, 4, 7]],
    ['D3', [0, 3, 7]], ['D3', [0, 3, 7]], ['A2', [0, 3, 7]], ['A2', [0, 3, 7]],
    ['F2', [0, 4, 7]], ['G2', [0, 4, 7]], ['E2', [0, 4, 7]], ['E2', [0, 4, 7, 10]],
  ];
  const MELODY = [
    'A4:3 C5:3 E5:2 D5:2 C5:2 B4:2 C5:2',
    'A4:6 r:2 E4:2 A4:2 B4:2 C5:2',
    'D5:3 C5:3 A4:2 C5:4 F5:4',
    'E5:6 r:2 C5:2 D5:2 E5:4',
    'G5:3 E5:3 C5:2 D5:2 E5:2 G5:4',
    'F5:2 E5:2 D5:2 C5:2 E5:8',
    'D5:3 B4:3 G4:2 B4:2 D5:2 G5:4',
    'G5:6 F5:2 E5:4 D5:4',
    'F5:3 E5:3 D5:2 A4:4 D5:4',
    'F5:2 G5:2 A5:4 G5:2 F5:2 E5:4',
    'E5:3 C5:3 A4:2 C5:2 E5:2 A5:4',
    'G5:2 E5:2 C5:2 E5:2 A5:8',
    'F5:4 A5:4 G5:4 F5:4',
    'G5:4 B5:4 A5:4 G5:4',
    'E5:2 G#5:2 B5:4 A5:2 G#5:2 E5:4',
    'B5:6 r:2 E5:2 G#5:2 B5:4',
  ];
  const BARS = MELODY.length;
  const TOTAL = BARS * 16 * STEP;

  function melodyNotes() {
    const out = [];
    MELODY.forEach((bar, b) => {
      let s = 0;
      for (const tok of bar.split(' ')) {
        const [n, l] = tok.split(':');
        const len = parseInt(l, 10);
        if (n !== 'r') out.push({ step: b * 16 + s, len, midi: midiOf(n) });
        s += len;
      }
      if (s !== 16) throw new Error('bar ' + (b + 1) + ' has ' + s + ' steps');
    });
    return out;
  }
  function bassNotes() {
    const out = [];
    const pat = [[0, 0, 2], [3, 0, 2], [6, 12, 2], [8, 0, 2], [10, 12, 1], [11, 0, 2], [14, 12, 2]];
    CHORDS.forEach(([root], b) => {
      const r = midiOf(root) - (midiOf(root) > 47 ? 12 : 0);
      for (const [s, o, l] of pat) out.push({ step: b * 16 + s, len: l, midi: r + o });
    });
    return out;
  }
  function arpNotes(base) {
    const out = [];
    const order = [0, 1, 2, 3, 2, 1, 0, 1];
    CHORDS.forEach(([root, iv], b) => {
      const r = midiOf(root) % 12 + base;
      const tones = [...iv.slice(0, 3).map((x) => r + x), r + 12];
      for (let s = 0; s < 16; s++) out.push({ step: b * 16 + s, len: 1, midi: tones[order[s % 8]] });
    });
    return out;
  }
  function chordNotes(base) {
    // returns per bar: array of 3 midi notes voiced around `base`
    return CHORDS.map(([root, iv]) => {
      const r = midiOf(root) % 12;
      return iv.slice(0, 3).map((x) => {
        let m = r + x;
        while (m < base) m += 12;
        while (m >= base + 12) m -= 12;
        return m;
      }).sort((a, b) => a - b);
    });
  }
  function drumHits() {
    const out = [];
    for (let b = 0; b < BARS; b++) {
      const t = b * 16;
      const kicks = (b % 2) ? [0, 8, 10] : [0, 7, 10];
      kicks.forEach((s) => out.push({ step: t + s, kind: 'kick' }));
      if (b === BARS - 1 || b === 7) [4, 12, 13, 14, 15].forEach((s) => out.push({ step: t + s, kind: 'snare' }));
      else [4, 12].forEach((s) => out.push({ step: t + s, kind: 'snare' }));
      for (let s = 0; s < 16; s += 2) out.push({ step: t + s + 1, kind: 'hat', open: s % 8 === 6 });
      if (b % 4 === 3) out.push({ step: t + 15, kind: 'hat' });
    }
    return out;
  }

  // ---------------- VGM writer ----------------
  class Writer {
    constructor() { this.ev = []; this.seq = 0; this.blocks = []; }
    at(t, prio, ...bytes) { this.ev.push({ t: Math.max(0, Math.round(t)), p: prio, s: this.seq++, b: bytes }); }
    block(type, data) { this.blocks.push({ type, data }); }
    build(hdr, gd3) {
      const ev = this.ev.sort((a, b) => a.t - b.t || a.p - b.p || a.s - b.s);
      const body = [];
      const init = ev.filter((e) => e.p < -50);
      const music = ev.filter((e) => e.p >= -50);
      for (const e of init) body.push(...e.b);
      for (const bl of this.blocks) {
        body.push(0x67, 0x66, bl.type, ...u32(bl.data.length));
        for (const x of bl.data) body.push(x);
      }
      const loopPos = body.length;
      let now = 0;
      const wait = (n) => {

      };
      for (const e of music) {
        if (e.t >= TOTAL) continue;

        body.push(...e.b);

      wait(TOTAL - now);
      body.push(0x66);

      const HEAD = 0x100;
      const gd3b = gd3Bytes(gd3);

      file.set([0x56, 0x67, 0x6d, 0x20]);
      dv.setUint32(0x04, file.length - 4, true);
      dv.setUint32(0x08, 0x171, true);
      dv.setUint32(0x14, HEAD + body.length - 0x14, true);
      dv.setUint32(0x18, TOTAL, true);
      dv.setUint32(0x1c, HEAD + loopPos - 0x1c, true);
      dv.setUint32(0x20, TOTAL, true);
      dv.setUint32(0x34, HEAD - 0x34, true);
      for (const [off, val] of Object.entries(hdr)) {
        if (off === '0x28') dv.setUint16(0x28, val, true);
        else if (off === '0x2a') file[0x2a] = val;
        else dv.setUint32(parseInt(off, 16), val >>> 0, true);

      file.set(gd3b, HEAD + body.length);

  }
  const u32 = (v) => [v & 255, (v >> 8) & 255, (v >> 16) & 255, (v >>> 24) & 255];
  function gd3Bytes(g) {
    const fields = [g.title, '', g.game, '', g.system, '', g.author, '', g.date, 'ymfm VGM player demo', g.notes || ''];
    const chars = [];
    for (const f of fields) { for (const c of f) { const k = c.charCodeAt(0); chars.push(k & 255, k >> 8); } chars.push(0, 0); }

  }

  // patch op: [ar, d1r, d2r, rr, d1l, tl, ks, mul, dt]
  const P = {
    lead: { alg: 4, fb: 6, ops: [[31, 6, 2, 6, 3, 28, 0, 1, 3], [31, 3, 1, 7, 2, 4, 0, 1, 3], [31, 8, 3, 6, 4, 34, 0, 2, 7], [31, 3, 1, 7, 2, 8, 0, 1, 7]] },
    bass: { alg: 4, fb: 6, ops: [[31, 14, 0, 10, 12, 20, 0, 1, 0], [31, 6, 5, 10, 2, 2, 0, 1, 0], [31, 16, 0, 10, 15, 30, 0, 3, 0], [31, 8, 5, 10, 3, 12, 0, 1, 0]] },
    stab: { alg: 4, fb: 4, ops: [[31, 10, 0, 12, 8, 26, 0, 2, 0], [31, 9, 7, 12, 4, 14, 0, 1, 0], [31, 12, 0, 12, 8, 34, 0, 4, 0], [31, 9, 7, 12, 4, 16, 0, 1, 0]] },
    bell: { alg: 4, fb: 3, ops: [[31, 6, 3, 6, 6, 30, 0, 7, 0], [31, 5, 4, 5, 5, 10, 0, 2, 0], [31, 6, 3, 6, 6, 34, 0, 14, 0], [31, 5, 4, 5, 5, 14, 0, 4, 0]] },
    pad: { alg: 7, fb: 2, ops: [[16, 2, 0, 5, 2, 24, 0, 1, 3], [16, 2, 0, 5, 2, 30, 0, 2, 7], [16, 2, 0, 5, 2, 24, 0, 1, 7], [16, 2, 0, 5, 2, 26, 0, 1, 0]] },
    kick: { alg: 4, fb: 0, ops: [[31, 20, 0, 15, 15, 30, 0, 1, 0], [31, 12, 8, 12, 4, 0, 0, 1, 0], [31, 20, 0, 15, 15, 127, 0, 1, 0], [31, 31, 31, 15, 15, 127, 0, 1, 0]] },
  };
  const SLOT = [0, 2, 1, 3]; // operator n -> register slot

  // ---------------- Mega Drive: YM2612 + SN76489 ----------------
  function megadrive() {
    const w = new Writer();
    const CLK = 7670453, PSGCLK = 3579545, RATE = CLK / 144;
    const fm = (t, prio, reg, val, port) => w.at(t, prio, port ? 0x53 : 0x52, reg, val);
    const psg = (t, prio, v) => w.at(t, prio, 0x50, v);
    const patch = (c, p) => {
      const port = c >= 3 ? 1 : 0, cc = c % 3;
      p.ops.forEach((o, n) => {
        const s = SLOT[n] * 4 + cc;
        fm(0, -100, 0x30 + s, (o[8] << 4) | o[7], port);
        fm(0, -100, 0x40 + s, o[5], port);
        fm(0, -100, 0x50 + s, (o[6] << 6) | o[0], port);
        fm(0, -100, 0x60 + s, o[1], port);
        fm(0, -100, 0x70 + s, o[2], port);
        fm(0, -100, 0x80 + s, (o[4] << 4) | o[3], port);

      const port = c >= 3 ? 1 : 0, cc = c % 3, f = mtof(m);
      let blk = Math.ceil(Math.log2(f * 2097152 / RATE / 2047));

      const fn = Math.round(f * 2097152 / (RATE * Math.pow(2, blk)));

      fm(t, 1, 0xa0 + cc, fn & 255, port);
    };

    const note = (c, t, len, m) => {
      freq(c, t, m);
      w.at(t, 2, 0x52, 0x28, 0xf0 | code(c));
      w.at(t + len - 60, 0, 0x52, 0x28, code(c));
    };

    w.at(0, -100, 0x52, 0x22, 0x00);
    w.at(0, -100, 0x52, 0x27, 0x00);
    for (let i = 0; i < 4; i++) psg(0, -100, 0x9f | (i << 5));
    patch(0, P.lead); patch(1, P.bass); patch(2, P.stab); patch(3, P.stab); patch(4, P.stab);
    fm(0, -100, 0xb6, 0xc0, 1);
    fm(0, -100, 0x2b, 0x80, 0);

    melodyNotes().forEach((n) => note(0, n.step * STEP, n.len * STEP, n.midi));
    bassNotes().forEach((n) => note(1, n.step * STEP, n.len * STEP, n.midi));
    chordNotes(62).forEach((ch, b) => {
      [2, 6, 10, 14].forEach((s) => ch.forEach((m, i) => note(2 + i, (b * 16 + s) * STEP, STEP, m)));
    });

    // PSG: ch0 arpeggio, ch1 melody echo, ch2 sustained chord third, noise hats
    const tone = (c, t, m) => {
      const n = Math.max(1, Math.min(1023, Math.round(PSGCLK / (32 * mtof(m)))));
      psg(t, 1, 0x80 | (c << 5) | (n & 15));
      psg(t, 1, (n >> 4) & 0x3f);
    };
    const vol = (c, t, a) => psg(t, 3, 0x90 | (c << 5) | a);
    arpNotes(72).forEach((n) => { const t = n.step * STEP; tone(0, t, n.midi); vol(0, t, 6); vol(0, t + STEP * 0.5, 9); vol(0, t + STEP * 0.85, 12); });
    melodyNotes().forEach((n) => { const t = (n.step + 3) * STEP; tone(1, t, n.midi); vol(1, t, 9); vol(1, t + n.len * STEP * 0.6, 12); vol(1, t + n.len * STEP - 40, 15); });
    CHORDS.forEach(([root, iv], b) => {
      const t = b * 16 * STEP; tone(2, t, midiOf(root) % 12 + 60 + iv[1]);
      vol(2, t, 10); vol(2, t + 8 * STEP, 11); vol(2, t + 14 * STEP, 13);
    });

    // DAC drums via stream control
    const kick = [], snare = [];
    const DR = 11025;
    let ph = 0;
    for (let i = 0; i < DR * 0.22; i++) {
      const t = i / DR; ph += 2 * Math.PI * (48 + 130 * Math.exp(-t * 28)) / DR;
      kick.push(Math.round(128 + 118 * Math.exp(-t * 11) * Math.sin(ph)));
    }
    let seed = 1;
    const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x3fffffff - 1; };
    for (let i = 0; i < DR * 0.18; i++) {
      const t = i / DR;
      const x = rnd() * 0.75 * Math.exp(-t * 16) + Math.sin(2 * Math.PI * 185 * t) * 0.6 * Math.exp(-t * 28);
      snare.push(Math.round(128 + 118 * Math.max(-1, Math.min(1, x))));
    }
    kick.push(128, 128); snare.push(128, 128);
    w.block(0x00, kick); w.block(0x00, snare);
    w.at(0, -100, 0x90, 0x00, 0x02, 0x00, 0x2a);
    w.at(0, -100, 0x91, 0x00, 0x00, 0x01, 0x00);
    w.at(0, -100, 0x92, 0x00, ...u32(DR));
    const noise = (t, open) => {
      psg(t, 1, 0xe4);
      vol(3, t, open ? 3 : 4);
      vol(3, t + 500, open ? 5 : 8);
      vol(3, t + (open ? 1800 : 1100), open ? 9 : 12);
      vol(3, t + (open ? 3800 : 1700), 15);
    };
    drumHits().forEach((d) => {
      const t = d.step * STEP;
      if (d.kind === 'kick') w.at(t, 4, 0x95, 0x00, 0x00, 0x00, 0x00);
      else if (d.kind === 'snare') w.at(t, 4, 0x95, 0x00, 0x01, 0x00, 0x00);
      else noise(t, d.open);
    });

    return w.build({ '0x0c': PSGCLK, '0x28': 0x0009, '0x2a': 16, '0x2c': CLK },
      { title: 'Phosphor Run', game: 'ymfm demo', system: 'Sega Mega Drive / Genesis', author: 'Claude', date: '2026' });
  }

  // ---------------- X68000: YM2151 ----------------
  function x68000() {
    const w = new Writer();
    const CLK = 4000000;
    const r = (t, prio, reg, val) => w.at(t, prio, 0x54, reg, val);
    const patch = (c, p) => {
      p.ops.forEach((o, n) => {
        const s = SLOT[n] * 8 + c;
        r(0, -100, 0x40 + s, ((o[8] & 7) << 4) | o[7]);
        r(0, -100, 0x60 + s, o[5]);
        r(0, -100, 0x80 + s, (o[6] << 6) | o[0]);
        r(0, -100, 0xa0 + s, o[1]);
        r(0, -100, 0xc0 + s, o[2]);
        r(0, -100, 0xe0 + s, (o[4] << 4) | o[3]);
      });
      r(0, -100, 0x20 + c, 0xc0 | (p.fb << 3) | p.alg);
      r(0, -100, 0x38 + c, 0);
    };
    const CODES = [0, 1, 2, 4, 5, 6, 8, 9, 10, 12, 13, 14];
    const kc = (c, t, m) => {
      const adj = m - 12 * Math.log2(CLK / 3579545) - 61;
      let whole = Math.floor(adj), frac = adj - whole;
      let oct = 4 + Math.floor(whole / 12), idx = ((whole % 12) + 12) % 12;
      oct = Math.max(0, Math.min(7, oct));
      r(t, 1, 0x28 + c, (oct << 4) | CODES[idx]);
      r(t, 1, 0x30 + c, Math.round(frac * 63) << 2);
    };
    const note = (c, t, len, m) => { kc(c, t, m); r(t, 2, 0x08, 0x78 | c); r(t + len - 60, 0, 0x08, c); };

    patch(0, P.lead); patch(1, P.bass); patch(2, P.pad); patch(3, P.pad); patch(4, P.pad); patch(5, P.bell); patch(6, P.kick);
    // ch7: noise drum on C2
    patch(7, { alg: 7, fb: 0, ops: [[31, 31, 31, 15, 15, 127, 0, 1, 0], [31, 31, 31, 15, 15, 127, 0, 1, 0], [31, 31, 31, 15, 15, 127, 0, 1, 0], [31, 14, 10, 12, 6, 0, 0, 1, 0]] });
    r(0, -100, 0x18, 0); r(0, -100, 0x19, 0); r(0, -100, 0x1b, 0);

    melodyNotes().forEach((n) => note(0, n.step * STEP, n.len * STEP, n.midi));
    bassNotes().forEach((n) => note(1, n.step * STEP, n.len * STEP, n.midi));
    chordNotes(60).forEach((ch, b) => ch.forEach((m, i) => note(2 + i, b * 16 * STEP, 16 * STEP, m)));
    arpNotes(72).forEach((n) => note(5, n.step * STEP, STEP, n.midi + 12));
    drumHits().forEach((d) => {
      const t = d.step * STEP;
      if (d.kind === 'kick') {
        for (let k = 0; k < 6; k++) kc(6, t + k * 300, 47 - k * 3.5);
        r(t, 2, 0x08, 0x78 | 6); r(t + 3000, 0, 0x08, 6);
      } else {
        const snare = d.kind === 'snare';
        r(t, 1, 0x0f, 0x80 | (snare ? 0x14 : 0x1e));
        r(t, 1, 0xa0 + 24 + 7, snare ? 14 : (d.open ? 12 : 20));
        r(t, 1, 0x60 + 24 + 7, snare ? 2 : 14);
        r(t, 0, 0x08, 7);
        r(t, 2, 0x08, 0x40 | 7);
      }
    });
    return w.build({ '0x30': CLK },
      { title: 'Phosphor Run', game: 'ymfm demo', system: 'Sharp X68000', author: 'Claude', date: '2026' });
  }

  // ---------------- AdLib: YM3812 (OPL2) with rhythm mode ----------------
  function adlib() {
    const w = new Writer();
    const CLK = 3579545, RATE = CLK / 72;
    const r = (t, prio, reg, val) => w.at(t, prio, 0x5a, reg, val);
    const OPS = [0, 1, 2, 8, 9, 10, 16, 17, 18];
    // op: [mul, tl, ar, dr, sl, rr, ws, sustain]
    const op = (off, o) => {
      r(0, -100, 0x20 + off, (o[7] ? 0x20 : 0) | o[0]);

      r(0, -100, 0x60 + off, (o[2] << 4) | o[3]);

    op(0x11, [1, 6, 15, 8, 12, 9, 0, 0]); op(0x14, [1, 2, 15, 7, 8, 8, 0, 0]);
    op(0x12, [1, 4, 15, 6, 8, 8, 0, 0]); op(0x15, [1, 6, 15, 7, 10, 8, 0, 0]);
    const set = (c, m) => { const [lo, hi] = freq(c, m); r(0, -100, 0xa0 + c, lo); r(0, -100, 0xb0 + c, hi); };
    set(6, 33); set(7, 55); set(8, 50);
    r(0, -100, 0xbd, 0x20);

    melodyNotes().forEach((n) => note(0, n.step * STEP, n.len * STEP, n.midi));
    bassNotes().forEach((n) => note(1, n.step * STEP, n.len * STEP, n.midi));
    chordNotes(60).forEach((ch, b) => [0, 6, 10].forEach((s) => ch.forEach((m, i) => note(2 + i, (b * 16 + s) * STEP, (s === 0 ? 4 : 3) * STEP, m))));
    arpNotes(72).forEach((n) => note(5, n.step * STEP, STEP, n.midi));

    const steps = {};
    drumHits().forEach((d) => { steps[d.step] = (steps[d.step] || 0) | (d.kind === 'kick' ? 0x10 : d.kind === 'snare' ? 0x08 : (d.open ? 0x02 : 0x01)); });

      const t = s * STEP;
      r(t, 0, 0xbd, 0x20);
      r(t + 40, 2, 0xbd, 0x20 | bits);
    }
    return w.build({ '0x50': CLK },
      { title: 'Phosphor Run', game: 'ymfm demo', system: 'AdLib (PC)', author: 'Claude', date: '2026' });
  }

  const api = { megadrive, x68000, adlib };
  root.buildDemo = (kind) => api[kind]();
  if (typeof module !== 'undefined') module.exports = root.buildDemo;

    fill(L, R) {
      const got = x.render(L.length);
      const buf = new Float32Array(x.memory.buffer, x.out_ptr(), got * 2);
      for (let i = 0; i < got; i++) { L[i] = buf[2 * i]; R[i] = buf[2 * i + 1]; }
      for (let i = got; i < L.length; i++) { L[i] = 0; R[i] = 0; }
      return got;
    },
    handle(d, post) {
      if (d.t === 'load') { const n = core.load(d.bytes, d.loops); core.playing = n > 0 && d.autoplay; post({ t: 'loaded', id: d.id, n, len: x.length() }); }
      else if (d.t === 'play') core.playing = true;
      else if (d.t === 'pause') core.playing = false;
      else if (d.t === 'seek') { x.seek(d.pos); post({ t: 'vis', pos: x.position(), len: x.length(), v: core.vis() }); }
      else if (d.t === 'loops') x.set_loops(d.n);
    },
    process(L, R, post) {
      if (!core.playing) return false;
      const got = core.fill(L, R);
      if (got < L.length) { core.playing = false; post({ t: 'ended' }); }
      if (++core.quanta % 4 === 0 || L.length > 512) post({ t: 'vis', pos: x.position(), len: x.length(), v: core.vis() });
      return true;
    },
  };
  return core;
}

const workletSrc = `${makeCore.toString()}
class YmfmProcessor extends AudioWorkletProcessor {
  constructor(o) {
    super();
    this.core = makeCore(o.processorOptions.wasm, sampleRate);
    this.post = (m) => this.port.postMessage(m);
    this.port.onmessage = (e) => this.core.handle(e.data, this.post);
  }
  process(inputs, outputs) {
    const out = outputs[0];
    this.core.process(out[0], out[1] || out[0], this.post);
    return true;
  }
}
registerProcessor('ymfm', YmfmProcessor);`;

// ---------- constants ----------
const CHIP = {
  1: ['YM2413', 'OPLL'], 2: ['YM2612', 'OPN2'], 3: ['YM2151', 'OPM'], 4: ['YM2203', 'OPN'],
  5: ['YM2608', 'OPNA'], 6: ['YM2610', 'OPNB'], 7: ['YM2610B', 'OPNB'], 8: ['YM3812', 'OPL2'],
  9: ['YM3526', 'OPL'], 10: ['Y8950', 'MSX-AUDIO'], 11: ['YMF262', 'OPL3'], 12: ['YM2149', 'SSG'], 13: ['SN76489', 'DCSG'],
};
const FM_COLORS = ['#5fb3a6', '#d9a441', '#e0745a', '#7fa7d9', '#b48ad1', '#9cc77a', '#e58fb0', '#5cc6d6', '#c9b27a'];
const TONE_COLORS = ['#ffd27a', '#ffad9a', '#a8e0d0'];
const PERC_COLOR = '#ebe2cd';
const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const LO = 24, HI = 108; // C1 .. C8 (exclusive)

function chanLabel(type, kind, sub) {
  if (kind === 0) return 'FM' + (sub + 1);
  if (kind === 1) return type === 13 ? 'SQ' + (sub + 1) : 'SSG ' + 'ABC'[sub];
  if (kind === 2) return 'NOISE';
  if (kind === 3) return type === 2 ? 'DAC' : 'ADPCM';
  if (kind === 4) {
    if (type === 5) return ['BD', 'SD', 'TOP', 'HH', 'TOM', 'RIM'][sub];
    if (type === 6 || type === 7) return 'PCM-A' + (sub + 1);
    return ['HH', 'CYM', 'TOM', 'SD', 'BD'][sub];
  }
  return '?';
}
const fmtTime = (s) => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const noteName = (m) => { const r = Math.round(m); return NOTE_NAMES[((r % 12) + 12) % 12] + (Math.floor(r / 12) - 1); };
const $ = (id) => document.getElementById(id);

// ---------- VGM helpers ----------
function parseGd3(b) {
  const dv = new DataView(b.buffer, b.byteOffset, b.byteLength);
  const out = { title: '', game: '', system: '', author: '' };
  if (b.length < 0x40) return out;
  const rel = dv.getUint32(0x14, true);
  const off = rel ? rel + 0x14 : 0;
  if (!off || off + 12 > b.length || dv.getUint32(off, true) !== 0x20336447) return out;
  const len = dv.getUint32(off + 8, true);
  const s = [];
  let cur = '';
  for (let i = off + 12; i + 1 < Math.min(b.length, off + 12 + len); i += 2) {
    const c = dv.getUint16(i, true);
    if (c === 0) { s.push(cur); cur = ''; } else cur += String.fromCharCode(c);
  }
  const pick = (a, j) => (s[a] || s[j] || '').trim();
  out.title = pick(0, 1); out.game = pick(2, 3); out.system = pick(4, 5); out.author = pick(6, 7);
  return out;
}
function header(b) {
  const dv = new DataView(b.buffer, b.byteOffset, b.byteLength);
  return { total: dv.getUint32(0x18, true), loop: dv.getUint32(0x20, true), hasLoop: dv.getUint32(0x1c, true) !== 0 };
}
async function gunzip(b) {
  if ('DecompressionStream' in window) {
    const s = new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'));
    return new Uint8Array(await new Response(s).arrayBuffer());
  }
  if (window.pako) return window.pako.inflate(b);
  throw new Error('이 브라우저는 .vgz 압축 해제를 지원하지 않아요');
}
async function toVgm(bytes) {
  if (bytes[0] === 0x1f && bytes[1] === 0x8b) bytes = await gunzip(bytes);
  if (bytes[0] !== 0x56 || bytes[1] !== 0x67 || bytes[2] !== 0x6d || bytes[3] !== 0x20) return null;
  return bytes;
}

// ---------- state ----------
const wasmBytes = Uint8Array.from(atob(WASM_B64), (c) => c.charCodeAt(0));
const S = {
  tracks: [], cur: -1, playing: false, loops: 1,
  pos: 0, len: 0, vis: null, chans: [], used: null, levels: [], flash: [], lastHits: [],
  ctx: null, node: null, send: null, analyser: null, loadId: 0, seeking: false, preview: null,
};

// preview engine on the main thread: channel scan + waterfall preview while paused
const previewCore = makeCore(wasmBytes, 48000);

// ---------- audio ----------
async function initAudio() {
  if (S.ctx) return;
  const ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'playback' });
  S.ctx = ctx;
  S.analyser = ctx.createAnalyser();
  S.analyser.fftSize = 1024;
  const onMsg = (m) => {
    if (m.t === 'vis') { if (!S.seeking) S.pos = m.pos / 44100; S.len = m.len / 44100; S.vis = m.v; }
    else if (m.t === 'ended') onEnded();
  };
  try {
    if (!ctx.audioWorklet) throw new Error('no worklet');
    const url = URL.createObjectURL(new Blob([workletSrc], { type: 'text/javascript' }));
    await ctx.audioWorklet.addModule(url);
    const node = new AudioWorkletNode(ctx, 'ymfm', { numberOfInputs: 0, outputChannelCount: [2], processorOptions: { wasm: wasmBytes } });
    node.port.onmessage = (e) => onMsg(e.data);
    S.send = (m, tr) => node.port.postMessage(m, tr || []);
    S.node = node;
  } catch (e) {
    const core = makeCore(wasmBytes, ctx.sampleRate);
    const sp = ctx.createScriptProcessor(4096, 0, 2);
    sp.onaudioprocess = (ev) => {
      const L = ev.outputBuffer.getChannelData(0), R = ev.outputBuffer.getChannelData(1);
      if (!core.process(L, R, onMsg)) { L.fill(0); R.fill(0); }
    };
    S.send = (m) => core.handle(m, onMsg);
    S.node = sp;
  }
  S.node.connect(S.analyser);
  S.analyser.connect(ctx.destination);
}

// ---------- tracks ----------
function addTrack(t) { S.tracks.push(t); renderList(); }

function selectTrack(i, autoplay) {
  const t = S.tracks[i];
  if (!t) return;
  S.cur = i;
  const id = ++S.loadId;
  $('err').textContent = '';
  // scan with the preview engine
  const n = previewCore.load(t.bytes, 0);
  if (n <= 0) {
    $('err').textContent = n === -3 ? `"${t.name}"에는 지원하는 야마하 칩이 없어요 (NES, 게임보이 등은 재생할 수 없어요).` : `"${t.name}" 파일을 읽을 수 없어요.`;
    S.playing = false; updatePlayIcon(); renderList();
    return;
  }
  const x = previewCore.x;
  const chips = [];
  for (let k = 0; k < n; k++) chips.push([x.chip_type(k), x.chip_clock(k)]);
  x.seek(t.hdr.total || 44100 * 600);
  S.used = previewCore.vis();
  x.seek(0);
  buildChannels(chips);
  renderChips(chips);
  const g = t.gd3;
  $('title').textContent = g.title || t.name;
  $('sub').textContent = [g.game, g.system].filter(Boolean).join(' · ') || chips.map((c) => CHIP[c[0]][0]).join(' + ');
  S.pos = 0;
  S.len = (t.hdr.total + (t.hdr.hasLoop ? t.hdr.loop * S.loops : 0)) / 44100;
  S.vis = null;
  drawPreview();
  renderList();
  if (S.send) { S.send({ t: 'load', id, bytes: t.bytes, loops: S.loops, autoplay }); S.loaded = i; }
  S.playing = !!autoplay;
  updatePlayIcon();
}

function onEnded() {
  if (S.cur + 1 < S.tracks.length) selectTrack(S.cur + 1, true);
  else { S.playing = false; updatePlayIcon(); }
}

async function openFiles(files) {
  const before = S.tracks.length;
  const errs = [];
  for (const f of files) {
    try {
      const bytes = new Uint8Array(await f.arrayBuffer());
      if (/\.zip$/i.test(f.name) || (bytes[0] === 0x50 && bytes[1] === 0x4b)) {
        if (!window.JSZip) throw new Error('zip');
        const zip = await JSZip.loadAsync(bytes);
        const names = Object.keys(zip.files).filter((n) => /\.vg[mz]$/i.test(n) && !zip.files[n].dir).sort();
        for (const n of names) {
          const v = await toVgm(await zip.files[n].async('uint8array'));
          if (v) addTrack(mkTrack(n.split('/').pop(), v));
        }
        if (!names.length) errs.push(`${f.name}: 안에 VGM 파일이 없어요`);
      } else {
        const v = await toVgm(bytes);
        if (v) addTrack(mkTrack(f.name, v)); else errs.push(`${f.name}: VGM 파일이 아니에요`);
      }
    } catch (e) { errs.push(`${f.name}: 열 수 없어요`); }
  }
  if (S.tracks.length > before) { await initAudio(); S.ctx.resume(); selectTrack(before, true); }
  if (errs.length) $('err').textContent = errs.join(' · ');
}
function mkTrack(name, bytes) {
  const gd3 = parseGd3(bytes);
  return { name: name.replace(/\.vg[mz]$/i, ''), bytes, gd3, hdr: header(bytes) };
}

// ---------- UI: lists ----------
function renderList() {
  const ul = $('list');
  ul.textContent = '';
  S.tracks.forEach((t, i) => {
    const li = document.createElement('li');
    if (i === S.cur) li.className = 'on';
    const b = document.createElement('button');
    b.innerHTML = `<span class="n">${String(i + 1).padStart(2, '0')}</span><span class="nm"></span><span class="sys"></span>`;
    b.querySelector('.nm').textContent = t.gd3.title || t.name;
    b.querySelector('.sys').textContent = t.gd3.system || t.gd3.game || '';
    b.addEventListener('click', async () => { await initAudio(); S.ctx.resume(); selectTrack(i, true); });
    li.appendChild(b);
    ul.appendChild(li);
  });
  $('listCount').textContent = S.tracks.length + '곡';
}

function renderChips(chips) {
  const box = $('chips');
  box.textContent = '';
  chips.forEach(([type, clk]) => {
    const d = document.createElement('div');
    d.className = 'ic';
    d.innerHTML = `<i class="notch"></i><b>${CHIP[type][0]}</b><span>${CHIP[type][1]} · ${(clk / 1e6).toFixed(2)} MHz</span>`;
    box.appendChild(d);
  });
}

function buildChannels(chips) {
  const v = S.used;
  const n = v.length / 8;
  S.chans = [];
  let fmIdx = 0, toneIdx = 0;
  const box = $('strips');
  box.textContent = '';
  let group = null, lastChip = -1;
  let shown = 0;
  for (let i = 0; i < n; i++) {
    const ci = v[i * 8], type = v[i * 8 + 1], kind = v[i * 8 + 2], sub = v[i * 8 + 3], hits = v[i * 8 + 7];
    const color = kind === 0 ? FM_COLORS[fmIdx++ % FM_COLORS.length] : kind === 1 ? TONE_COLORS[toneIdx++ % 3] : PERC_COLOR;
    const used = hits > 0;
    const ch = { i, ci, type, kind, sub, color, used, el: null, meter: null, note: null, dot: null, lastNote: '' };
    S.chans.push(ch);
    if (!used) continue;
    if (ci !== lastChip) {
      group = document.createElement('div');
      group.className = 'group';
      group.innerHTML = `<div class="group-h"><b>${CHIP[type][0]}</b> ${CHIP[type][1]} · ${(chips[ci][1] / 1e6).toFixed(2)} MHz</div>`;
      box.appendChild(group);
      lastChip = ci;
    }
    const row = document.createElement('div');
    row.className = 'ch idle';
    row.style.setProperty('--c', color);
    row.innerHTML = `<span class="dot"></span><span class="lbl">${chanLabel(type, kind, sub)}</span><span class="meter"><i></i></span><span class="note"></span>`;
    group.appendChild(row);
    ch.el = row; ch.meter = row.querySelector('.meter i'); ch.note = row.querySelector('.note'); ch.dot = row.querySelector('.dot');
    shown++;
  }
  S.levels = new Float32Array(n);
  S.flash = new Float32Array(n);
  S.lastHits = new Float32Array(n);
  $('chCount').textContent = `${shown}채널 사용 중`;
}

// ---------- canvases ----------
const fall = $('fall'), keys = $('keys'), scope = $('scope');
const fctx = fall.getContext('2d'), kctx = keys.getContext('2d'), sctx = scope.getContext('2d');
let DPR = 1, FW = 0, FH = 0, KH = 0, keyGeom = null;
const SPEED = 110; // px per second

function sizeCanvases() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  const w = fall.clientWidth;
  for (const [c, h] of [[fall, fall.clientHeight], [keys, keys.clientHeight], [scope, scope.clientHeight]]) {
    c.width = Math.round(c.clientWidth * DPR); c.height = Math.round(h * DPR);
  }
  FW = fall.width; FH = fall.height; KH = keys.height;
  keyGeom = buildKeys(keys.width);
  fctx.fillStyle = '#171412'; fctx.fillRect(0, 0, FW, FH);
}

function buildKeys(width) {
  const whites = [];
  for (let m = LO; m < HI; m++) if (![1, 3, 6, 8, 10].includes(m % 12)) whites.push(m);
  const ww = width / whites.length;
  const k = {};
  whites.forEach((m, i) => { k[m] = { x: i * ww, w: ww, black: false }; });
  for (let m = LO; m < HI; m++) if (!k[m]) { const left = k[m - 1]; k[m] = { x: left.x + ww * 0.68, w: ww * 0.64, black: true }; }
  for (const m in k) k[m].cx = k[m].x + k[m].w / 2;
  return { k, ww };
}
function xOf(midi) {
  const lo = Math.floor(midi), f = midi - lo;
  const a = keyGeom.k[lo], b = keyGeom.k[lo + 1];
  if (!a) return null;
  return b ? a.cx + (b.cx - a.cx) * f : a.cx;
}

function drawRow(v, h) {
  // scroll up by h and paint a new row at the bottom
  const dh = Math.max(1, Math.round(h));
  fctx.globalCompositeOperation = 'copy';
  fctx.drawImage(fall, 0, dh, FW, FH - dh, 0, 0, FW, FH - dh);
  fctx.globalCompositeOperation = 'source-over';
  fctx.fillStyle = '#171412';
  fctx.fillRect(0, FH - dh, FW, dh);
  // octave guides
  fctx.fillStyle = 'rgba(235,226,205,0.05)';
  for (let m = LO; m < HI; m += 12) fctx.fillRect(Math.round(keyGeom.k[m].x), FH - dh, Math.max(1, DPR), dh);
  if (!v) return;
  const n = v.length / 8;
  for (let i = 0; i < n; i++) {
    const ch = S.chans[i];
    if (!ch || !ch.used) continue;
    const active = v[i * 8 + 4], midi = v[i * 8 + 5], vol = v[i * 8 + 6];
    if (ch.kind === 4 ? S.flash[i] < 0.35 : (!active || vol < 0.02)) continue;
    fctx.globalAlpha = Math.min(1, 0.3 + vol * 0.9);
    fctx.fillStyle = ch.color;
    if (midi >= LO && midi < HI - 1) {
      const x = xOf(midi);
      const w = keyGeom.ww * 0.7;
      fctx.fillRect(x - w / 2, FH - dh, w, dh);
    } else if (ch.kind >= 2) {
      // percussion lanes along the right edge
      const lane = (ch.i % 6);
      const w = keyGeom.ww * 0.5 * (0.4 + vol);
      fctx.fillRect(FW - (lane + 1) * keyGeom.ww * 0.9 - w / 2, FH - dh, w, dh);
    }
  }
  fctx.globalAlpha = 1;
}

function drawKeys(v) {
  const { k } = keyGeom;
  kctx.fillStyle = '#0d0c0b';
  kctx.fillRect(0, 0, keys.width, KH);
  const lit = {};
  if (v) {
    const n = v.length / 8;
    for (let i = 0; i < n; i++) {
      const ch = S.chans[i];
      if (!ch || !ch.used) continue;
      const midi = v[i * 8 + 5];
      if (v[i * 8 + 4] && v[i * 8 + 6] > 0.02 && midi >= LO && midi < HI) lit[Math.round(midi)] = ch.color;
    }
  }
  const gap = Math.max(1, DPR);
  for (const m in k) if (!k[m].black) {
    kctx.fillStyle = lit[m] || '#ddd4c0';
    kctx.fillRect(k[m].x + gap / 2, 0, k[m].w - gap, KH - gap);
    if (+m % 12 === 0 && k[m].w > 6 * DPR) {
      kctx.fillStyle = lit[m] ? '#171412' : '#8a8173';
      kctx.font = `${8 * DPR}px "IBM Plex Mono", monospace`;
      kctx.textAlign = 'center';
      kctx.fillText('C' + (+m / 12 - 1), k[m].cx, KH - 5 * DPR);
    }
  }
  for (const m in k) if (k[m].black) {
    kctx.fillStyle = lit[m] || '#221e1b';
    kctx.fillRect(k[m].x, 0, k[m].w, KH * 0.6);
  }
  kctx.fillStyle = 'rgba(0,0,0,.35)';
  kctx.fillRect(0, 0, keys.width, 2 * DPR);
}

const scopeBuf = new Float32Array(1024);
function drawScope() {
  const w = scope.width, h = scope.height;
  sctx.clearRect(0, 0, w, h);
  sctx.fillStyle = 'rgba(255,91,61,0.08)';
  sctx.fillRect(0, h / 2, w, Math.max(1, DPR) / 2);
  if (!S.analyser || !S.playing) return;
  S.analyser.getFloatTimeDomainData(scopeBuf);
  // trigger on rising zero crossing for a steadier trace
  let start = 0;
  for (let i = 1; i < 400; i++) if (scopeBuf[i - 1] < 0 && scopeBuf[i] >= 0) { start = i; break; }
  const span = 560;
  sctx.beginPath();
  for (let i = 0; i < span; i++) {
    const x = (i / (span - 1)) * w;
    const y = h / 2 - scopeBuf[start + i] * h * 0.9;
    i ? sctx.lineTo(x, y) : sctx.moveTo(x, y);
  }
  sctx.strokeStyle = '#ff5b3d';
  sctx.lineWidth = 1.5 * DPR;
  sctx.shadowColor = 'rgba(255,91,61,.7)';
  sctx.shadowBlur = 6 * DPR;
  sctx.stroke();
  sctx.shadowBlur = 0;
}

function updateStrips(v, dt) {
  if (!v) return;
  const n = Math.min(v.length / 8, S.chans.length);
  const decay = Math.pow(0.02, dt);
  for (let i = 0; i < n; i++) {
    const ch = S.chans[i];
    if (!ch.el) continue;
    const active = v[i * 8 + 4], midi = v[i * 8 + 5], vol = v[i * 8 + 6], hits = v[i * 8 + 7];
    if (hits !== S.lastHits[i]) { if (hits > S.lastHits[i]) S.flash[i] = 1; S.lastHits[i] = hits; }
    const target = active && ch.kind !== 4 ? vol : 0;
    S.levels[i] = Math.max(target * 0.9 + S.flash[i] * (ch.kind === 4 ? 1 : ch.kind >= 2 ? 0.6 : 0.2), S.levels[i] * decay);
    S.flash[i] *= decay;
    const lv = Math.min(1, S.levels[i]);
    ch.meter.style.width = (lv * 100).toFixed(1) + '%';
    ch.dot.style.opacity = (0.25 + Math.min(1, S.flash[i] + (active ? 0.5 : 0)) * 0.75).toFixed(2);
    const label = active && vol > 0.02 && midi >= 0 ? noteName(midi) : '';
    if (label !== ch.lastNote) { ch.note.textContent = label; ch.lastNote = label; }
    const idle = lv < 0.02;
    if (idle !== ch.el.classList.contains('idle')) ch.el.classList.toggle('idle', idle);
  }
}

function drawPreview() {
  // render the first seconds silently so the waterfall shows the song before playback
  if (!keyGeom) return;
  const t = S.tracks[S.cur];
  previewCore.load(t.bytes, 0);
  fctx.fillStyle = '#171412'; fctx.fillRect(0, 0, FW, FH);
  const secs = FH / DPR / SPEED;
  const chunk = 1024, rate = 48000;
  const L = new Float32Array(chunk), R = new Float32Array(chunk);
  const rows = Math.ceil(secs * rate / chunk);
  let last = null;
  for (let r = 0; r < rows; r++) {
    previewCore.fill(L, R);
    last = previewCore.vis();
    drawRow(last, (chunk / rate) * SPEED * DPR);
  }
  drawKeys(last);
  updateStrips(last, 0);
  $('hint').hidden = S.playing;
}

// ---------- transport ----------
function updatePlayIcon() {
  $('playIcon').innerHTML = S.playing ? '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>' : '<path d="M7 4v16l13-8z"/>';
  $('play').setAttribute('aria-label', S.playing ? '일시정지' : '재생');
  if (S.playing) $('hint').hidden = true;
}
$('play').addEventListener('click', async () => {
  await initAudio();
  await S.ctx.resume();
  if (S.playing) { S.playing = false; S.send({ t: 'pause' }); }
  else {
    if (S.loaded !== S.cur) { selectTrack(S.cur, true); return; }
    S.playing = true; S.send({ t: 'play' });
  }
  updatePlayIcon();
});
$('prev').addEventListener('click', async () => {
  await initAudio(); S.ctx.resume();
  if (S.pos > 3 || S.cur === 0) { S.send({ t: 'seek', pos: 0 }); S.pos = 0; }
  else selectTrack(S.cur - 1, true);
});
$('next').addEventListener('click', async () => {
  await initAudio(); S.ctx.resume();
  selectTrack((S.cur + 1) % S.tracks.length, true);
});
$('loop').addEventListener('click', () => {
  S.loops = S.loops === 1 ? -1 : 1;
  $('loop').textContent = S.loops === 1 ? 'LOOP ×2' : 'LOOP ∞';
  $('loop').setAttribute('aria-pressed', String(S.loops === -1));
  if (S.send) S.send({ t: 'loops', n: S.loops });
  const t = S.tracks[S.cur];
  if (t) S.len = S.loops < 0 && t.hdr.hasLoop ? 0 : (t.hdr.total + (t.hdr.hasLoop ? t.hdr.loop : 0)) / 44100;
});
const seek = $('seek');
seek.addEventListener('input', () => {
  S.seeking = true;
  const p = seek.value / 1000;
  $('tPos').textContent = fmtTime(p * S.len);
  seek.style.setProperty('--p', (p * 100) + '%');
});
seek.addEventListener('change', () => {
  const target = (seek.value / 1000) * S.len;
  S.pos = target;
  if (S.send) S.send({ t: 'seek', pos: target * 44100 });
  S.seeking = false;
});
$('file').addEventListener('change', (e) => { openFiles([...e.target.files]); e.target.value = ''; });
['dragenter', 'dragover'].forEach((ev) => document.addEventListener(ev, (e) => { e.preventDefault(); document.body.classList.add('dragging'); }));
['dragleave', 'drop'].forEach((ev) => document.addEventListener(ev, (e) => { e.preventDefault(); if (ev === 'drop' || e.target === document.documentElement) document.body.classList.remove('dragging'); }));
document.addEventListener('drop', (e) => { if (e.dataTransfer.files.length) openFiles([...e.dataTransfer.files]); });

// ---------- frame loop ----------
let lastT = performance.now();
function frame(t) {
  const dt = Math.min(0.1, (t - lastT) / 1000);
  lastT = t;
  if (S.playing && S.vis) {
    drawRow(S.vis, dt * SPEED * DPR);
    drawKeys(S.vis);
    updateStrips(S.vis, dt);
  } else if (!S.playing) {
    updateStrips(S.vis, dt);
  }
  drawScope();
  const len = S.len;
  if (!S.seeking) {
    const p = len ? Math.min(1, S.pos / len) : 0;
    seek.value = Math.round(p * 1000);
    seek.style.setProperty('--p', (p * 100).toFixed(2) + '%');
    $('tPos').textContent = fmtTime(S.pos);
  }
  $('tLen').textContent = len ? fmtTime(len) : '∞';
  $('clock').firstChild.textContent = fmtTime(S.pos).padStart(5, '0');
  $('clockLen').textContent = '/ ' + (len ? fmtTime(len).padStart(5, '0') : '∞');
  requestAnimationFrame(frame);
}

// ---------- boot ----------
const DEMOS = [['megadrive', 'Phosphor Run'], ['x68000', 'Phosphor Run'], ['adlib', 'Phosphor Run']];
for (const [k] of DEMOS) S.tracks.push(mkTrack('demo-' + k, buildDemo(k)));
sizeCanvases();
renderList();
selectTrack(0, false);
window.addEventListener('resize', () => { const c = S.cur; sizeCanvases(); if (!S.playing && c >= 0) drawPreview(); });
requestAnimationFrame(frame);
</script>

</body>
