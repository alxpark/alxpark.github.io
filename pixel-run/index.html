<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Saturday 5K: a pixel-art park race. Tap to run, jump the logs, dogs and puddles, and race pacers, your ghost or a friend.">
<meta name="theme-color" content="#1b1f2e">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0}</style>
<title>Saturday 5K</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap">
<style>
  /* Single-look pixel arcade: the game canvas fills the screen, one quiet overlay for text entry. */
  :root {
    --ink: #1b1f2e;
    --panel: #23283a;
    --cream: #fff3c4;
    --grass: #2fa36b;
    --sky: #7ec3e8;
    --muted: #8a93a8;
    --pixel: "Silkscreen", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", ui-monospace, "Courier New", monospace;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background: var(--ink);
    color: var(--cream);
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  #glcanvas {
    display: block;
    width: 100%;
    height: 100%;
    outline: none;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: var(--ink);
  }
  #loading {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    align-content: center;
    gap: 14px;
    background: var(--ink);
    font-family: var(--pixel);
    text-align: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  #loading h1 { margin: 0; font-size: 28px; font-weight: 400; letter-spacing: 0.04em; color: var(--cream); }
  #loading p { margin: 0; color: var(--muted); font-size: 12px; letter-spacing: 0.08em; }
  .track { width: 160px; height: 6px; background: var(--panel); outline: 2px solid var(--cream); position: relative; overflow: hidden; }
  .track::after {
    content: ""; position: absolute; inset: 0; width: 30%; background: var(--grass);
    animation: jog 0.9s steps(8) infinite;
  }
  @keyframes jog { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
  @media (prefers-reduced-motion: reduce) { .track::after { animation: none; width: 60%; } }

  #ask {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: rgba(27, 31, 46, 0.72);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    font-family: var(--pixel);
  }
  #ask form {
    width: min(320px, 100%);
    display: grid;
    gap: 12px;
    padding: 18px;
    background: var(--panel);
    outline: 2px solid var(--cream);
    box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.5);
  }
  #ask label { font-size: 12px; letter-spacing: 0.08em; color: var(--cream); }
  #ask-input {
    font: 20px var(--pixel);
    text-transform: uppercase;
    padding: 8px 10px;
    background: var(--ink);
    color: var(--cream);
    border: 2px solid var(--muted);
    border-radius: 0;
    min-width: 0;
    user-select: text;
    -webkit-user-select: text;
  }
  #ask-input:focus { outline: none; border-color: var(--sky); }
  .row { display: flex; gap: 10px; }
  .row button {
    flex: 1;
    font: 14px var(--pixel);
    padding: 10px;
    border: 2px solid var(--ink);
    border-radius: 0;
    color: #fff;
    background: var(--muted);
    box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.5);
    cursor: pointer;
  }
  .row button.go { background: var(--grass); }
  .row button:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }
  .row button:active { transform: translate(1px, 1px); box-shadow: none; }

  #share {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    overflow-y: auto;
    background: rgba(27, 31, 46, 0.8);
    padding-block: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    font-family: var(--pixel);
  }
  #share .card {
    width: min(300px, 100%);
    display: grid;
    gap: 10px;
    justify-items: center;
    padding: 16px;
    background: var(--panel);
    outline: 2px solid var(--cream);
    box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.5);
    text-align: center;
  }
  #share h2 { margin: 0; font-size: 20px; font-weight: 400; color: #f2c230; letter-spacing: 0.04em; }
  #share p { margin: 0; }
  #share .room { font-size: 13px; letter-spacing: 0.08em; }
  #share .room b { font-weight: 400; color: #f2c230; }
  #share-qr {
    width: min(232px, 70vw, 42vh);
    height: auto;
    aspect-ratio: 1;
    max-width: 100%;
    image-rendering: pixelated;
    background: #fff;
    outline: 4px solid #fff;
  }
  #share .hint { font-size: 11px; line-height: 1.5; color: var(--cream); }
  #share .note { font-size: 10px; line-height: 1.5; color: var(--muted); }
  #share-link {
    width: 100%;
    min-width: 0;
    font: 10px ui-monospace, "Courier New", monospace;
    padding: 6px;
    background: var(--ink);
    color: var(--cream);
    border: 2px solid var(--muted);
    border-radius: 0;
    user-select: text;
    -webkit-user-select: text;
  }
  #share .row { width: 100%; }
</style>
</head>

function register_plugins(plugins) {

    for (var i = 0; i < plugins.length; i++) {
        if (plugins[i].register_plugin != undefined && plugins[i].register_plugin != null) {
            plugins[i].register_plugin(importObject);
        }
    }
}

function init_plugins(plugins) {
    if (plugins == undefined)
        return;

    for (var i = 0; i < plugins.length; i++) {
        if (plugins[i].on_init != undefined && plugins[i].on_init != null) {
            plugins[i].on_init();
        }
        if (plugins[i].name == undefined || plugins[i].name == null ||
            plugins[i].version == undefined || plugins[i].version == null) {
            console.warn("Some of the registred plugins do not have name or version");
            console.warn("Probably old version of the plugin used");
        } else {
            var version_func = plugins[i].name + "_crate_version";

            if (wasm_exports[version_func] == undefined) {
                console.log("Plugin " + plugins[i].name + " is present in JS bundle, but is not used in the rust code.");
            } else {
                var crate_version = wasm_exports[version_func]();

                if (plugins[i].version != crate_version) {
                    console.error("Plugin " + plugins[i].name + " version mismatch" +
                        "js version: " + plugins[i].version + ", crate version: " + crate_version)
                }
            }
        }
    }
}

    var imports = WebAssembly.Module.imports(obj);

    for (const i in imports) {
        if (importObject["env"][imports[i].name] == undefined) {
            console.warn("No " + imports[i].name + " function in gl.js");
            importObject["env"][imports[i].name] = function () {
                console.warn("Missed function: " + imports[i].name);
            };
        }
    }

    var req = fetch(wasm_path);

    register_plugins(plugins);

    if (typeof WebAssembly.compileStreaming === 'function') {
        WebAssembly.compileStreaming(req)
            .then(obj => {
                add_missing_functions_stabs(obj);
                return WebAssembly.instantiate(obj, importObject);

            .then(
                obj => {
                    wasm_memory = obj.exports.memory;
                    wasm_exports = obj.exports;

      cancel: "Cancel", ok: "OK", warm: "WARMING UP...", fail: "COULD NOT START THE GAME: ",
      shareTitle: "JOIN MY RACE", shareRoom: "ROOM", copy: "Copy link", copied: "Copied", selected: "Selected - copy it", done: "Done",
      hint: "Scan with the phone camera. Friends pick a name and land in this room.",
      note: "On claude.ai, friends also need access to this game: add them in the Share menu first.",
    },
    ko: {
      name: "주자 이름", room: "방 코드 (친구에게 알려 주세요)",
      join: (who, room) => (who ? who + "님의 레이스" : "레이스") + "에 참가해요 (" + room + " 방). 이름을 입력하세요:",
      cancel: "취소", ok: "확인", warm: "몸 푸는 중...", fail: "게임을 시작할 수 없어요: ",
      shareTitle: "같이 달려요", shareRoom: "방", copy: "링크 복사", copied: "복사됨", selected: "선택됨 - 복사하세요", done: "완료",
      hint: "휴대폰 카메라로 스캔하세요. 친구가 이름을 입력하면 이 방으로 들어와요.",
      note: "claude.ai에서는 친구도 이 게임에 접근할 수 있어야 해요. 먼저 공유 메뉴에서 친구를 추가하세요.",
    },
  };
  const t = () => T[lang] || T.en;
  window.s5kText = t;
  function applyStaticText() {
    document.documentElement.lang = lang;
    const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
    const lp = document.querySelector("#loading p");
    if (lp && lp.textContent === T.en.warm) lp.textContent = t().warm;
    set("ask-cancel", t().cancel); set("ask-ok", t().ok);
    set("share-title", t().shareTitle); set("share-copy", t().copy); set("share-close", t().done);
    const hint = document.querySelector("#share .hint"); if (hint) hint.textContent = t().hint;
    set("share-note", t().note);
    const rl = document.querySelector("#share .room"); if (rl && rl.firstChild) rl.firstChild.textContent = t().shareRoom + " ";
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", applyStaticText); else applyStaticText();

  // ------------------------------------------------------------ prompt overlay
  let answer = null;

  // A shared link ends in #room-<code> or #room-<code>-by-<host>; only plain
  // anchors survive the artifact viewer, so the code and name are letters/digits.
  const launch = (() => {
    const m = /^#room-([a-z0-9]{1,10})(?:-by-([a-z0-9.]{1,12}))?$/i.exec(location.hash || "");
    if (!m) return null;
    return { room: m[1].toUpperCase(), host: (m[2] || "").replace(/\./g, " ").toUpperCase() };
  })();

  function ask(kind, cur) {
    const ov = document.getElementById("ask");
    const inp = document.getElementById("ask-input");
    let label = t().room;
    if (kind === 0) label = t().name;
    if (kind === 2) label = t().join(launch && launch.host, launch ? launch.room : "");
    document.getElementById("ask-label").textContent = label;
    inp.value = cur; inp.maxLength = kind === 1 ? 10 : 8;
    ov.hidden = false;
    setTimeout(() => { inp.focus(); inp.select(); }, 30);
    const done = (v) => { ov.hidden = true; answer = v; document.getElementById("glcanvas").focus(); };
    document.getElementById("ask-ok").onclick = () => done(inp.value);
    document.getElementById("ask-cancel").onclick = () => done("");
    inp.onkeydown = (e) => {
      e.stopPropagation();
      if (e.isComposing || e.keyCode === 229) return; // Korean IME still composing a syllable
      if (e.key === "Enter") done(inp.value);
      if (e.key === "Escape") done("");
    };
  }

  // ------------------------------------------------------------ networking
  // A transport keeps `peers` as [{peer, me, presence}] and accepts presence patches.
  const net = { mode: 0, status: 0, peers: [], send: null, leave: null, presence: {} };
  const clean = (p) => {
    const s = p.presence || {};
    const num = (v) => (typeof v === "number" && isFinite(v) ? v : 0);
    return {
      p: String(p.peer), me: !!p.me, n: String(s.n || "").slice(0, 12), c: num(s.c) | 0, k: num(s.k) | 0,
      r: num(s.r) | 0, d: num(s.d), y: num(s.y), s: num(s.s) | 0, f: num(s.f), go: num(s.go) | 0,
    };
  };

  let roomApi = null;
  const wsUrl = (() => {
    const q = new URLSearchParams(location.search).get("server");
    return q || window.S5K_SERVER || "";
  })();

  async function initRoom() {
    try {
      if (window.claude && typeof window.claude.use === "function") {
        roomApi = await window.claude.use("room");
      }
    } catch (e) { roomApi = null; }
    if (roomApi) net.mode = 1;
    else if (wsUrl) net.mode = 2;
  }

  async function joinRoom(code) {
    net.status = 1; net.peers = [];
    if (net.mode === 1) {
      let r = null, filter = null;
      try { r = await roomApi.join("s5k-" + code); }
      catch (e) { r = roomApi; filter = code; } // named rooms unavailable: share the lobby, filter by code
      const refresh = () => {
        net.peers = r.peers().filter((p) => p.kind === "viewer")
          .filter((p) => !filter || p.isMe || (p.presence && p.presence.rm === filter))
          .map((p) => ({ peer: p.peer, me: p.sameTab, presence: p.presence }));
      };
      const offPeers = r.onPeers(refresh, () => { net.status = 3; });
      const offConn = r.onConnection((ok) => { net.status = ok ? 2 : 1; }, () => { net.status = 3; });
      net.send = (patch) => r.presence(filter ? Object.assign({ rm: filter }, patch) : patch).catch(() => {});
      net.leave = () => { offPeers(); offConn(); if (r !== roomApi) r.leave(); else r.presence({ rm: null, n: null }).catch(() => {}); };
      refresh();
      if (r.connected()) net.status = 2;
      if (Object.keys(net.presence).length) net.send(net.presence);
    } else if (net.mode === 2) {
      let ws;
      try { ws = new WebSocket(wsUrl); } catch (e) { net.status = 3; return; }
      ws.onopen = () => { net.status = 2; ws.send(JSON.stringify({ t: "join", room: code, presence: net.presence })); };
      ws.onmessage = (m) => {
        try {
          const msg = JSON.parse(m.data);
          if (msg.t === "peers") net.peers = msg.peers.map((p) => ({ peer: p.peer, me: p.peer === msg.you, presence: p.presence }));
        } catch (e) { /* ignore bad frames */ }
      };
      ws.onclose = () => { net.status = 3; };
      net.send = (patch) => { if (ws.readyState === 1) ws.send(JSON.stringify({ t: "presence", patch })); };
      net.leave = () => { ws.onclose = null; ws.close(); };
    }
  }

  // ------------------------------------------------------------ shared leaderboard
  const board = { ver: 0, rows: [], db: null, uid: null };
  async function initBoard() {
    try {
      if (!window.claude || typeof window.claude.use !== "function") return;
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!db || !user) return;
      board.db = db;
      board.uid = await user.id();
      board.ver = -1;
      await refreshBoard();
    } catch (e) { board.ver = 0; board.db = null; }
  }
  async function refreshBoard() {
    if (!board.db) return;
    try {
      const snap = await board.db.collection("ghosts").orderBy("t", "asc").limit(20).get();
      const rows = [];
      snap.docs.forEach((doc) => {
        const d = doc.data() || {};
        if (typeof d.t !== "number" || typeof d.g !== "string") return;
        rows.push({ n: String(d.n || "RUNNER").slice(0, 12), t: d.t, c: d.c | 0, k: d.k | 0, me: doc.id === board.uid, g: d.g.slice(0, 8000) });
      });
      board.rows = rows;
      board.ver = (board.ver > 0 ? board.ver : 0) + 1;
    } catch (e) {
      if (board.ver < 0) board.ver = 0;
    }
  }
  async function submitBoard(json) {
    if (!board.db || !board.uid) return;
    try {
      const d = JSON.parse(json);
      await board.db.doc("ghosts/" + board.uid).set({ n: d.n, t: d.t, c: d.c, k: d.k, g: d.g, at: Date.now() });
      await refreshBoard();
    } catch (e) { console.warn("leaderboard write refused", e && e.code); }
  }

  // ------------------------------------------------------------ share via QR
  function shareBase() {
    const framed = (() => { try { return window.top !== window; } catch (e) { return true; } })();
    if (framed && window.S5K_SHARE_URL) return window.S5K_SHARE_URL; // inside the claude.ai viewer
    return location.href.split("#")[0]; // self-hosted: keeps ?server=...
  }
  function showShare(room, host) {
    const code = room.toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 10) || "park";
    const by = host.toLowerCase().replace(/[^a-z0-9 ]/g, "").trim().replace(/ +/g, ".").slice(0, 12);
    const url = shareBase() + "#room-" + code + (by ? "-by-" + by : "");
    document.getElementById("share-room").textContent = code.toUpperCase();
    const link = document.getElementById("share-link");
    link.value = url;
    document.getElementById("share-note").hidden = !(window.S5K_SHARE_URL && url.startsWith(window.S5K_SHARE_URL));
    // draw the QR code as crisp pixels
    const cv = document.getElementById("share-qr");
    try {
      const qr = qrcode(0, "M");
      qr.addData(url);
      qr.make();
      const n = qr.getModuleCount(), quiet = 2, px = Math.floor(cv.width / (n + quiet * 2));
      const size = px * (n + quiet * 2);
      cv.width = cv.height = size;
      const g = cv.getContext("2d");
      g.fillStyle = "#fff"; g.fillRect(0, 0, size, size);
      g.fillStyle = "#1b1f2e";
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) g.fillRect((c + quiet) * px, (r + quiet) * px, px, px);
    } catch (e) { console.warn("QR failed", e); }
    const ov = document.getElementById("share");
    ov.hidden = false;
    const copy = document.getElementById("share-copy");
    applyStaticText();
    copy.textContent = t().copy;
    copy.onclick = () => {
      const ok = () => { copy.textContent = t().copied; };
      const fallback = () => { link.focus(); link.select(); copy.textContent = t().selected; };
      try { navigator.clipboard.writeText(url).then(ok, fallback); } catch (e) { fallback(); }
    };
    document.getElementById("share-close").onclick = () => { ov.hidden = true; document.getElementById("glcanvas").focus(); };
  }

  // ------------------------------------------------------------ wasm imports
  miniquad_add_plugin({
    name: "s5k",
    version: 1,
    register_plugin(importObject) {
      const env = importObject.env;
      env.s5k_ready = () => { const l = document.getElementById("loading"); if (l) l.remove(); };
      env.s5k_sfx = (id) => { try { SFX[id] && SFX[id](); } catch (e) { /* audio unavailable */ } };
      env.s5k_vibrate = (ms) => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) { /* no haptics */ } };
      env.s5k_store = (kp, kl, vp, vl) => store.set(readStr(kp, kl), readStr(vp, vl));
      env.s5k_load = (kp, kl, buf, cap) => { const v = store.get(readStr(kp, kl)); return v == null ? 0 : writeStr(v, buf, cap) || -0; };
      env.s5k_ask = (kind, p, l) => { answer = null; ask(kind, readStr(p, l)); };
      env.s5k_take_answer = (buf, cap) => { if (answer == null) return -1; const r = writeStr(answer, buf, cap); if (r >= 0) answer = null; return r; };
      env.s5k_net_mode = () => net.mode;
      env.s5k_net_join = (p, l) => { joinRoom(readStr(p, l)); };
      env.s5k_net_leave = () => { lastPres = ""; try { net.leave && net.leave(); } catch (e) { /* already gone */ } net.leave = null; net.send = null; net.status = 0; net.peers = []; };
      env.s5k_net_status = () => net.status;
      let lastPres = "";
      env.s5k_net_presence = (p, l) => {
        const s = readStr(p, l);
        if (s === lastPres && net.status === 2) return; // unchanged: don't spend the send budget
        lastPres = s;
        try { net.presence = JSON.parse(s); } catch (e) { return; }
        net.send && net.send(net.presence);
      };
      env.s5k_net_peers = (buf, cap) => writeStr(JSON.stringify(net.peers.map(clean)), buf, cap);
      env.s5k_board_status = () => board.ver;
      env.s5k_board = (buf, cap) => writeStr(JSON.stringify(board.rows), buf, cap);
      env.s5k_board_submit = (p, l) => { submitBoard(readStr(p, l)); };
      env.s5k_now_ms = () => performance.now();
      env.s5k_launch_room = (buf, cap) => (launch ? writeStr(launch.room, buf, cap) : -1);
      env.s5k_share = (rp, rl, np, nl) => showShare(readStr(rp, rl), readStr(np, nl));
      env.s5k_lang = () => (lang === "ko" ? 1 : 0);
      env.s5k_set_lang = (k) => { lang = k ? "ko" : "en"; store.set("s5k_lang", lang); applyStaticText(); };
      env.s5k_share_open = () => (document.getElementById("share").hidden ? 0 : 1);
    },
  });

  // load() variant that tolerates hosts serving .wasm without the wasm MIME type
  window.s5kLoad = async function (url) {
    register_plugins(plugins);
    const bytes = await (await fetch(url)).arrayBuffer();
    const mod = await WebAssembly.compile(bytes);
    add_missing_functions_stabs(mod);
    const inst = await WebAssembly.instantiate(mod, importObject);
    wasm_memory = inst.exports.memory;
    wasm_exports = inst.exports;
    init_plugins(plugins);
    inst.exports.main();
  };

  initRoom();
  initBoard();
})();

</script>
<script>
  s5kLoad("data:application/wasm;base64," + S5K_WASM).catch(function (e) {
    var p = document.querySelector("#loading p");
    if (p) p.textContent = (window.s5kText ? window.s5kText().fail : "COULD NOT START THE GAME: ") + (e && e.message ? e.message : e);
  });
</script>

</body>
</html>
