<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Ember Well: a pixel-art descent RPG. Steer a lantern spirit down a dark well and collect embers to keep your light alive.">
<meta name="theme-color" content="#07080f">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0}</style>
</head>
<body>
<title>Ember Well</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one portrait well, centred, pixel-scaled to the largest size that fits. Single committed dark look. */
:root {
  --void: #07080f;
  --stone: #1a1f3a;
  --ember: #ffb347;
  --dim: #6b7aa8;
  --font-pixel: "Silkscreen", "Courier New", monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--void);
  color: var(--dim);
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
.stage {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
canvas {
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  display: block;
  box-shadow: 0 0 0 2px var(--stone), 0 0 48px rgba(255, 107, 53, 0.12);
  outline: none;
}
canvas:focus-visible { box-shadow: 0 0 0 2px var(--ember); }
.keys {
  font: 400 11px/1.4 var(--font-pixel);
  letter-spacing: 0.06em;
  text-align: center;
  max-width: 100%;
}
.keys b { color: var(--ember); font-weight: 400; }
.sound {
  font: 400 11px/1 var(--font-pixel);
  letter-spacing: 0.06em;
  color: var(--dim);
  background: none;
  border: 1px solid var(--stone);
  padding: 7px 12px;
  cursor: pointer;
}
.sound[aria-pressed="true"] { color: var(--ember); border-color: var(--ember); }
.sound:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
.row { display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; }
.err { color: var(--ember); font: 12px/1.5 var(--font-pixel); text-align: center; max-width: 36ch; }
@media (pointer: coarse) { .keys { display: none; } }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap">

<div class="stage" id="stage">
  <canvas id="game" width="144" height="256" tabindex="0" aria-label="Ember Well game"></canvas>
  <div class="row">
    <button class="sound" id="sound" type="button" aria-pressed="true">Sound on</button>
    <p class="keys"><b>&larr; &rarr;</b> steer &middot; <b>Enter</b> dive &middot; <b>T</b> daily &middot; <b>F</b> forge &middot; <b>1 2 3</b> buy &middot; <b>M</b> sound</p>
  </div>
</div>

const SAVE_KEY = "ember-well-save-v1";
const SOUND_KEY = "ember-well-sound";

// Procedural chiptune sound: every effect is synthesized, no audio files.
const Sound = (() => {
  let ac = null, master, droneGain, droneFilter, noiseBuf;
  let muted = false;
  try { muted = localStorage.getItem(SOUND_KEY) === "off"; } catch (e) {}
  const PENTA = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];

  function ensure() {
    if (ac) { if (ac.state === "suspended") ac.resume().catch(() => {}); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    master = ac.createGain();
    master.gain.value = muted ? 0 : 0.5;
    master.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    // Cave drone: detuned low voices through a lowpass that closes as light fades.
    droneFilter = ac.createBiquadFilter();
    droneFilter.type = "lowpass"; droneFilter.frequency.value = 300; droneFilter.Q.value = 3;
    droneGain = ac.createGain(); droneGain.gain.value = 0;
    [[55, "sawtooth", 0.22, -6], [82.4, "sawtooth", 0.16, 5], [110, "triangle", 0.14, 0]].forEach(([f, type, v, det]) => {
      const o = ac.createOscillator(); o.type = type; o.frequency.value = f; o.detune.value = det;
      const g = ac.createGain(); g.gain.value = v;
      o.connect(g).connect(droneFilter); o.start();
    });
    droneFilter.connect(droneGain).connect(master);
  }

  function tone(type, f0, f1, dur, vol, delay = 0) {
    const t = ac.currentTime + delay;
    const o = ac.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(dur, vol, cutoff, delay = 0) {
    const t = ac.currentTime + delay;
    const src = ac.createBufferSource(); src.buffer = noiseBuf;
    const f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = cutoff;
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f).connect(g).connect(master); src.start(t); src.stop(t + dur + 0.05);
  }
  const semi = (base, n) => base * Math.pow(2, n / 12);

  function play(id, arg) {
    if (!ac || ac.state !== "running") return;
    switch (id) {
      case 1: { // ember: pitch climbs a pentatonic scale while the combo lasts
        const f = semi(880, PENTA[Math.min(arg, PENTA.length - 1)]);
        tone("square", f, 0, 0.07, 0.07); tone("triangle", f * 2, 0, 0.12, 0.05, 0.015); break;
      }
      case 2: [0, 4, 7, 12, 16].forEach((n, i) => tone("triangle", semi(523, n), 0, 0.2, 0.12, i * 0.05)); break; // orb
      case 3: noise(0.18, 0.35, 900); tone("sawtooth", 220, 60, 0.22, 0.2); break;                              // hurt
      case 4: noise(0.45, 0.4, 1400); [12, 7, 3, 0, -5].forEach((n, i) => tone("square", semi(220, n), 0, 0.16, 0.08, 0.08 + i * 0.09)); break; // shatter
      case 5: [7, 3, 0, -5, -12].forEach((n, i) => tone("triangle", semi(330, n), 0, 0.3, 0.12, i * 0.14)); break; // light faded
      case 6: tone("square", 660, 880, 0.04, 0.04); break;                                                       // button
      case 7: tone("square", 784, 0, 0.08, 0.07); tone("square", 1175, 0, 0.16, 0.07, 0.08);
              if (arg) tone("triangle", 1568, 0, 0.35, 0.08, 0.16); break;                                       // buy / unlock
      case 8: tone("triangle", 440, 110, 0.35, 0.14); noise(0.3, 0.08, 500); break;                              // dive
      case 9: [0, 4, 7, 12].forEach((n, i) => tone("square", semi(659, n), 0, 0.12, 0.06, 0.6 + i * 0.08)); break; // new best
      case 10: { // entering a new biome: a slow, low arpeggio
        const root = arg === 2 ? 98 : 131;
        [0, 7, 12, 15].forEach((n, i) => tone("triangle", semi(root, n), 0, 0.9, 0.1, i * 0.18));
        tone("sine", root / 2, 0, 1.6, 0.18); break;
      }
      case 11: noise(0.55, 0.16, 3200); tone("sawtooth", 180, 120, 0.4, 0.03); break; // steam vent
    }
  }
  let beatAt = 0;
  function setLight(p) {
    if (!ac) return;
    const t = ac.currentTime;
    if (p < 0) { droneGain.gain.setTargetAtTime(0.035, t, 0.5); droneFilter.frequency.setTargetAtTime(260, t, 0.5); return; }
    droneGain.gain.setTargetAtTime(0.08 + 0.1 * (1 - p / 100), t, 0.3);
    droneFilter.frequency.setTargetAtTime(140 + 760 * (p / 100), t, 0.3);
    // heartbeat when the light is nearly gone
    if (p < 25 && t > beatAt && ac.state === "running") {
      tone("sine", 70, 40, 0.12, 0.35); tone("sine", 70, 40, 0.12, 0.25, 0.16);
      beatAt = t + 0.45 + p / 40;
    }
  }
  function toggle() {
    muted = !muted;
    try { localStorage.setItem(SOUND_KEY, muted ? "off" : "on"); } catch (e) {}
    if (ac) master.gain.setTargetAtTime(muted ? 0 : 0.5, ac.currentTime, 0.02);
    return muted;
  }
  return { ensure, play, setLight, toggle, get muted() { return muted; } };
})();

function start(hotData) {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const keysEl = document.querySelector(".keys");
  const bytes = Uint8Array.from(atob(WASM_B64), c => c.charCodeAt(0));

  WebAssembly.instantiate(bytes, {}).then(({ instance }) => {
    const ex = instance.exports;
    const GW = ex.width(), GH = ex.height();
    const save = () => new Int32Array(ex.memory.buffer, ex.save_ptr(), 16);

    // Restore progress: hot-reload data first, then this browser's storage.
    let stored = hotData && hotData.save;
    if (!stored) { try { stored = JSON.parse(localStorage.getItem(SAVE_KEY) || "null"); } catch (e) { stored = null; } }
    if (Array.isArray(stored) && stored.length === 16) save().set(stored);
    // Daily well: today's local date seeds the layout, so everyone gets the same well per day.
    const todayCode = () => { const d = new Date(); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); };
    ex.set_date(todayCode());
    setInterval(() => ex.set_date(todayCode()), 30000);
    ex.init((Math.random() * 0xffffffff) >>> 0);

    window.claude?.hot?.snapshot?.(() => ({ save: Array.from(save()) }));

    // Fit: largest integer scale that fits, falling back to fractional on tiny screens.
    function fit() {
      const reserve = 48;
      const availW = canvas.parentElement.clientWidth;
      const availH = canvas.parentElement.clientHeight - reserve - 8;
      let s = Math.min(availW / GW, availH / GH);
      if (s >= 2) s = Math.floor(s);
      canvas.style.width = Math.floor(GW * s) + "px";
      canvas.style.height = Math.floor(GH * s) + "px";
    }
    addEventListener("resize", fit); fit();

    // Touch / mouse: any pointer held on the left half steers left, right half steers right.
    const soundBtn = document.getElementById("sound");
    const syncSoundBtn = muted => {
      soundBtn.textContent = muted ? "Sound off" : "Sound on";
      soundBtn.setAttribute("aria-pressed", muted ? "false" : "true");
    };
    syncSoundBtn(Sound.muted);
    soundBtn.addEventListener("click", () => { Sound.ensure(); syncSoundBtn(Sound.toggle()); canvas.focus(); });

    const pointers = new Map();
    const toGame = e => {
      const r = canvas.getBoundingClientRect();
      return [Math.floor((e.clientX - r.left) / r.width * GW), Math.floor((e.clientY - r.top) / r.height * GH)];
    };
    canvas.addEventListener("pointerdown", e => {
      e.preventDefault();
      Sound.ensure();
      canvas.focus();
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
      const [x, y] = toGame(e);
      pointers.set(e.pointerId, x);
      ex.tap(x, y);
    });
    canvas.addEventListener("pointermove", e => { if (pointers.has(e.pointerId)) pointers.set(e.pointerId, toGame(e)[0]); });
    const lift = e => pointers.delete(e.pointerId);
    canvas.addEventListener("pointerup", lift);
    canvas.addEventListener("pointercancel", lift);
    canvas.addEventListener("contextmenu", e => e.preventDefault());

    // Keyboard
    const held = { left: false, right: false };
    const KEYMAP = { Enter: 3, " ": 3, Escape: 4, Backspace: 4, f: 5, F: 5, t: 6, T: 6, "1": 11, "2": 12, "3": 13 };
    addEventListener("keydown", e => {
      if (e.target === soundBtn) return;
      Sound.ensure();
      if ((e.key === "m" || e.key === "M") && !e.repeat) { syncSoundBtn(Sound.toggle()); e.preventDefault(); return; }
      if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") { if (!e.repeat) ex.key(1); held.left = true; }
      else if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") { if (!e.repeat) ex.key(2); held.right = true; }
      else if (KEYMAP[e.key] && !e.repeat) ex.key(KEYMAP[e.key]);
      else return;
      e.preventDefault();
    });
    addEventListener("keyup", e => {
      if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") held.left = false;
      if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") held.right = false;
    });
    addEventListener("blur", () => { held.left = held.right = false; pointers.clear(); });

    const image = new ImageData(GW, GH);
    const sfx = () => new Int32Array(ex.memory.buffer, ex.sfx_ptr(), 32);
    let last = performance.now();
    function loop(now) {
      let mask = (held.left ? 1 : 0) | (held.right ? 2 : 0);
      for (const x of pointers.values()) mask |= x < GW / 2 ? 1 : 2;
      ex.input(mask);
      ex.frame((now - last) / 1000);
      last = now;
      image.data.set(new Uint8Array(ex.memory.buffer, ex.fb(), GW * GH * 4));
      ctx.putImageData(image, 0, 0);
      const n = ex.sfx_count();
      if (n) { const q = sfx(); for (let i = 0; i < n; i++) Sound.play(q[i * 2], q[i * 2 + 1]); ex.sfx_clear(); }
      Sound.setLight(ex.light_pct());
      if (ex.save_dirty()) { try { localStorage.setItem(SAVE_KEY, JSON.stringify(Array.from(save()))); } catch (e) {} }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
    canvas.focus();
  }).catch(err => {
    const p = document.createElement("p");
    p.className = "err";
    p.textContent = "The game couldn't start because this browser blocked WebAssembly. Try a current Chrome, Safari or Firefox.";
    document.getElementById("stage").appendChild(p);
    console.error(err);
  });
}

window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
