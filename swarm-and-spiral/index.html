<title>Swarm &amp; Spiral</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed canvas as the stage; one glass control slab docked bottom-left, a wordmark top-left. Single committed night look. */
:root {
  --ink: #05070f;
  --glass: rgba(14, 18, 34, 0.72);
  --line: rgba(160, 176, 230, 0.16);
  --fg: #e8ebf7;
  --muted: #8d95b3;
  --accent: #f2b45a;
  --accent-ink: #1a1206;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--ink); color: var(--fg); font-family: var(--display); overflow: hidden; }
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; background: var(--ink); }

.mark {
  position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
  pointer-events: none; display: grid; gap: 2px;
}
.mark h1 { margin: 0; font-size: clamp(22px, 3.2vw, 34px); font-weight: 700; letter-spacing: -0.02em; line-height: 1; text-wrap: balance; }
.mark h1 em { font-style: normal; color: var(--accent); }
.mark p { margin: 0; font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: 0.04em; }

.stats {
  position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  font-family: var(--mono); font-size: 11px; color: var(--muted); text-align: right; pointer-events: none;
  font-variant-numeric: tabular-nums; line-height: 1.6;
}
.stats b { color: var(--fg); font-weight: 500; }

.panel {
  position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: min(320px, calc(100vw - 32px)); background: var(--glass); border: 1px solid var(--line); border-radius: 14px;
  backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%);
  padding: 12px; display: grid; gap: 12px; font-size: 13px;
}
.row { display: flex; gap: 8px; align-items: center; }
.label { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; flex: 1; background: rgba(255,255,255,0.04); border: 1px solid var(--line); border-radius: 9px; padding: 2px; gap: 2px; }
.seg button {
  font: 500 13px/1 var(--display); color: var(--muted); background: transparent; border: 0; border-radius: 7px;
  padding: 8px 4px; cursor: pointer; transition: background .15s, color .15s;
}
.seg button:hover { color: var(--fg); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.icon {
  font: 500 12px/1 var(--mono); color: var(--fg); background: rgba(255,255,255,0.06); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 10px; cursor: pointer; white-space: nowrap;
}
.icon:hover { background: rgba(255,255,255,0.12); }

.sliders { display: grid; gap: 9px; }
.slider { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center; }
.slider label { font-size: 12.5px; color: var(--fg); }
.slider output { font-family: var(--mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.slider input { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); margin: 0; height: 18px; }

.note { margin: 0; font-size: 12px; line-height: 1.45; color: var(--muted); }
.note kbd { font-family: var(--mono); font-size: 10.5px; color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }

.panel.collapsed .sliders, .panel.collapsed .note, .panel.collapsed .toolrow { display: none; }

@media (max-width: 520px) {
  .mark p { display: none; }
  .panel { padding: 10px; gap: 10px; }
}
@media (prefers-reduced-motion: reduce) { .seg button { transition: none; } }
</style>

  <div class="row toolrow">

</div>
