<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sandstorm Rally — WASM card game</title>
<style>
:root{
  --sand:#f3e6cf; --sand2:#e8d4b0; --ink:#2b2118; --muted:#7a6650;
  --me:#1f7a72; --me-l:#d5efe9; --ai:#b4492a; --ai-l:#f7ddd2;
  --gold:#d99a20; --card:#fffaf1; --line:#d9c4a0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--sand);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif}
body{min-height:100vh;display:flex;justify-content:center}
#app{width:100%;max-width:480px;padding:12px 12px 210px;position:relative}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:19px;margin:0;letter-spacing:-.3px}
h1 small{display:block;font-size:11px;color:var(--muted);font-weight:500;letter-spacing:0}
.btn{white-space:nowrap;border:0;border-radius:10px;padding:9px 12px;font:600 14px inherit;font-family:inherit;background:var(--ink);color:var(--sand);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn:disabled{opacity:.3;cursor:default}
.status{margin:10px 0 8px;display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:13px}
.turn{font-weight:700}
.turn.me{color:var(--me)} .turn.ai{color:var(--ai)}
.pips{display:flex;gap:4px}
.pip{width:12px;height:12px;border-radius:50%;border:2px solid var(--gold)}
.pip.on{background:var(--gold)}
.meta{color:var(--muted);font-size:12px;text-align:right;line-height:1.35}
.aihand{display:flex;gap:3px;justify-content:flex-end}
.aihand i{width:10px;height:14px;border-radius:2px;background:var(--ai);display:inline-block}
.road{position:relative;border-radius:14px;padding:8px 8px 0;background:repeating-linear-gradient(180deg,#e9d6b3 0 22px,#e3cda5 22px 44px);border:1px solid var(--line);overflow:hidden}
.flag{text-align:center;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:2px;padding:2px 0 6px}
.car{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:8px 10px;margin-bottom:7px;border:2px solid transparent;position:relative;transition:transform .2s, box-shadow .2s;cursor:pointer}
.car.o0{border-left:7px solid var(--me)} .car.o1{border-left:7px solid var(--ai)}
.car.o0 .ic{background:var(--me-l);color:var(--me)} .car.o1 .ic{background:var(--ai-l);color:var(--ai)}
.car.sel{border-color:var(--gold);box-shadow:0 0 0 3px rgba(217,154,32,.3);transform:scale(1.02)}
.car.tgt{border-color:var(--ai);animation:pulse 1s infinite}
.car.flash{animation:flash .6s}
.car.used .ic{opacity:.45}
.car .ic{width:44px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}
.car .ic svg{width:38px;height:28px}
.car .tx{flex:1;min-width:0}
.car .nm{font-weight:700;font-size:14px;display:flex;gap:6px;align-items:center}
.car .ds{font-size:11.5px;color:var(--muted);line-height:1.3}
.car .pos{font-size:11px;color:var(--muted);width:22px;text-align:center;font-variant-numeric:tabular-nums}
.tag{font-size:10px;font-weight:700;border-radius:6px;padding:1px 5px;background:var(--sand2);color:var(--ink)}
.tag.who0{background:var(--me);color:#fff} .tag.who1{background:var(--ai);color:#fff}
.storm{height:58px;margin:0 -8px;position:relative;display:flex;align-items:center;justify-content:center;font-weight:800;letter-spacing:3px;color:#fff8e8;font-size:13px;
  background:linear-gradient(180deg,rgba(150,105,55,.0),rgba(150,105,55,.85) 45%,#7a5530);overflow:hidden}
.storm:before{content:"";position:absolute;inset:-40px;background:repeating-linear-gradient(115deg,transparent 0 14px,rgba(255,240,210,.18) 14px 18px);animation:wind 1.2s linear infinite}
.storm.hit{animation:shake .5s}
.storm span{position:relative}
@keyframes wind{to{transform:translateX(36px)}}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(180,73,42,.3)}}
@keyframes flash{0%{background:#fff3c4}100%{background:var(--card)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.log{margin-top:10px;font-size:12.5px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-height:56px}
.log div{padding:1px 0}
.log div:first-child{color:var(--ink);font-weight:600}
.dock{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none}
.dock .in{pointer-events:auto;width:100%;max-width:480px;background:var(--ink);color:var(--sand);border-radius:18px 18px 0 0;padding:10px 12px calc(12px + env(safe-area-inset-bottom))}
.hint{font-size:12.5px;min-height:18px;margin-bottom:8px;color:#f0dcb8}
.hand{display:flex;gap:7px;margin-bottom:9px;min-height:62px}
.hc{flex:1;max-width:33%;background:var(--card);color:var(--ink);border-radius:10px;padding:6px 7px;cursor:pointer;border:2px solid transparent}
.hc.sel{border-color:var(--gold)}
.hc .nm{font-weight:700;font-size:13px;display:flex;align-items:center;gap:5px}
.hc .nm svg{width:24px;height:18px;color:var(--me)}
.hc .ds{font-size:10.5px;color:var(--muted);line-height:1.25;margin-top:2px}
.empty{font-size:12px;color:#bba98b;align-self:center}
.row{display:flex;gap:6px}
.row .btn{flex:1;background:#4a3a2b;color:var(--sand);padding:10px 4px;font-size:13px}
.row .btn.pri{background:var(--gold);color:var(--ink)}
.coach{margin:0 0 10px;background:#fff6dd;border:1.5px solid var(--gold);border-radius:12px;padding:9px 11px;font-size:13px;line-height:1.45}
.coach .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:800;margin-bottom:4px}
.coach .hd small{font-weight:600;color:var(--muted);font-size:11.5px}
.coach ol{margin:4px 0 6px;padding-left:20px}
.coach li{margin:3px 0}
.coach li b{font-weight:700}
.coach li .why{display:block;color:#6b5636;font-size:12.5px}
.coach li.now{background:rgba(217,154,32,.16);border-radius:6px;padding:2px 4px;margin-left:-4px}
.coach .sum{border-top:1px dashed var(--line);padding-top:6px;margin-top:4px}
.coach .warn{color:var(--ai);font-weight:600;margin-top:3px}
.coach .tip{color:var(--muted);font-size:12px;margin-top:5px}
.coach .go{margin-top:7px;width:100%;background:var(--gold);color:var(--ink)}
.car.coachhint,.hc.coachhint,.btn.coachhint{outline:2.5px dashed var(--gold);outline-offset:2px}
.btn.ghost.on{background:var(--gold);border-color:var(--gold)}
.hdr-btns{display:flex;gap:6px;flex:none}
.btn.sm{padding:9px 9px;font-size:13px}
@media (max-width:360px){header{flex-wrap:wrap}.hdr-btns{width:100%}.hdr-btns .btn{flex:1}}
.modal{position:fixed;inset:0;background:rgba(43,33,24,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal.show{display:flex}
.sheet{background:var(--card);border-radius:16px;max-width:440px;width:100%;max-height:86vh;overflow:auto;padding:16px 16px 14px}
.sheet h2{margin:0 0 8px;font-size:18px}
.sheet p,.sheet li{font-size:13.5px;line-height:1.5}
.sheet ul{padding-left:18px;margin:6px 0}
.types{display:grid;grid-template-columns:1fr;gap:6px;margin:8px 0}
.types div{display:flex;gap:8px;align-items:center;font-size:12.5px}
.types svg{width:30px;height:22px;flex:none;color:var(--me)}
.end h2{font-size:24px;text-align:center}
.end p{text-align:center}
.mode{display:flex;gap:6px;margin:10px 0}
.mode .btn{flex:1}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1><span id="tTitle"></span><small id="tSub"></small></h1>
    <div class="hdr-btns">
      <button class="btn ghost sm" id="langBtn" aria-label="Language"></button>
      <button class="btn ghost on sm" id="coachBtn"></button>
      <button class="btn ghost sm" id="rulesBtn"></button>
    </div>
  </header>
  <div class="status">
    <div><div class="turn" id="turn"></div><div class="pips" id="pips"></div></div>
    <div class="meta"><div id="deck"></div><div class="aihand" id="aihand"></div></div>
  </div>
  <div class="coach" id="coach" hidden></div>
  <div class="road" id="road"></div>
  <div class="log" id="log"></div>
</div>

<div class="dock"><div class="in">
  <div class="hint" id="hint"></div>
  <div class="hand" id="hand"></div>
  <div class="row" id="ctl"></div>
</div></div>

<div class="modal" id="rules"><div class="sheet">
  <div id="rulesBody"></div>
  <div class="types" id="typesList"></div>
  <p style="color:var(--muted);font-size:12px" id="rulesNote"></p>
  <button class="btn" style="width:100%" onclick="closeM('rules')" id="rulesClose"></button>
</div></div>

<div class="modal" id="endM"><div class="sheet end">
  <h2 id="endTitle"></h2><p id="endText"></p>
  <div class="mode"><button class="btn" onclick="start(0)" id="againAI"></button><button class="btn ghost" onclick="start(1)" id="againHot"></button></div>
</div></div>

let lang = "en";
try { const v = localStorage.getItem("sandstorm-rally-lang"); if(v==="ko"||v==="en") lang = v; } catch(e){}
const L = () => I18N[lang];
const TN = t => L().types[t][0], TD = t => L().types[t][1];

// Original simple car glyphs: a body + type mark
function glyph(t){
  const body = `<path d="M3 20h34v-6l-5-6H14l-5 6H3z" fill="currentColor" opacity=".9"/><circle cx="11" cy="22" r="4" fill="#2b2118"/><circle cx="29" cy="22" r="4" fill="#2b2118"/>`;
  const marks = {
    ram:`<path d="M37 12l3 4-3 4z" fill="#2b2118"/><path d="M37 11l3 1M37 21l3-1" stroke="#2b2118" stroke-width="1.5"/>`,
    hook:`<path d="M30 8 Q36 2 39 6 Q40 10 36 10" fill="none" stroke="#2b2118" stroke-width="2"/>`,
    nitro:`<path d="M1 12h6M0 16h5M1 20h4" stroke="#d99a20" stroke-width="2"/>`,
    oil:`<ellipse cx="4" cy="26" rx="4" ry="1.6" fill="#2b2118"/>`,
    tow:`<path d="M3 16H0" stroke="#2b2118" stroke-width="2"/><path d="M20 8V3h6" fill="none" stroke="#2b2118" stroke-width="2"/>`,
    mortar:`<path d="M18 8l6-6" stroke="#2b2118" stroke-width="3"/>`,
    armor:`<rect x="12" y="11" width="16" height="6" rx="1" fill="#2b2118" opacity=".55"/>`,
    scout:`<circle cx="22" cy="5" r="3" fill="none" stroke="#2b2118" stroke-width="1.6"/><path d="M22 8v2" stroke="#2b2118" stroke-width="1.6"/>`,
    smoke:`<circle cx="3" cy="9" r="2.5" fill="#9a8a76"/><circle cx="7" cy="5" r="3" fill="#b3a490"/>`,
  };
  return `<svg viewBox="0 0 40 28" aria-hidden="true">${body}${marks[GLYPHS[t]]}</svg>`;
}

let E, S = null, mode = 0, sel = null, handSel = null, targeting = null, busy = false, logs = [];
const $ = id => document.getElementById(id);
const who = p => L().who(p, mode===1);

function readState(){
  const s = new Int32Array(E.memory.buffer, E.state(), 14 + 24*5);
  const st = {len:s[0], cur:s[1], actions:s[2], winner:s[3], dn:s[4], turn:s[5], hn:[s[6],s[7]],
    hand:[[s[8],s[9],s[10]].slice(0,s[6]), [s[11],s[12],s[13]].slice(0,s[7])], cars:[]};
  for(let i=0;i<st.len;i++){ const o=14+i*5; st.cars.push({type:s[o], owner:s[o+1], armor:s[o+2], used:s[o+3], id:s[o+4]}); }
  return st;
}
const human = () => mode === 1 || S.cur === 0;

// Log entries are stored as functions so they re-render in the current language.
function log(fn){ logs.unshift(fn); logs = logs.slice(0,4); }

function describe(st, k, a, b){
  const p = st.cur, h = mode===1;
  const W = () => L().who(p,h);
  if(k===A.DRAW) return () => L().lDraw(W());
  if(k===A.PLAY){ const t = st.hand[p][a]; return () => L().lPlay(W(), TN(t)); }
  if(k===A.MOVE){ const t = st.cars[a].type; return () => L().lMove(W(), TN(t), b===0); }
  if(k===A.ABIL){ const t = st.cars[a].type, tt = b>=0 && st.cars[b] ? st.cars[b].type : -1;
    return () => L().lAbil(W(), TN(t), tt>=0 ? TN(tt) : ""); }
  return () => L().lEnd(W());
}

function doAct(k,a=0,b=0){
  const before = S;
  if(!E.act(k,a,b)) return false;
  if(k===A.END){
    const after = readState();
    const rear = before.cars[before.len-1], h = mode===1;
    if(!before.len) log(() => L().stormNone);
    else if(after.len===before.len) log(() => L().stormArmor);
    else log(() => L().stormEat(L().who(rear.owner,h), TN(rear.type)));
  } else log(describe(before,k,a,b));
  sel = null; handSel = null; targeting = null;
  S = readState();
  render(k===A.END ? -1 : (k===A.PLAY ? 0 : a));
  if(k===A.END) $("road").querySelector(".storm").classList.add("hit");
  if(S.winner >= 0) setTimeout(showEnd, 500);
  return true;
}

function applyStatic(){
  const T = L();
  document.documentElement.lang = lang;
  document.title = T.pageTitle;
  $("tTitle").textContent = T.title; $("tSub").textContent = T.sub;
  $("langBtn").textContent = T.langBtn;
  $("coachBtn").textContent = T.coach; $("rulesBtn").textContent = T.rules;
  $("rulesBody").innerHTML = T.rulesHtml; $("rulesNote").textContent = T.rulesNote; $("rulesClose").textContent = T.close;
  $("typesList").innerHTML = T.types.map((t,i)=>`<div>${glyph(i)}<span><b>${t[0]}</b> — ${t[1]}</span></div>`).join("");
  $("againAI").textContent = T.againAI; $("againHot").textContent = T.againHot;
}

function render(flashIdx=-1){
  const T = L();
  const me = mode===1 ? S.cur : 0;
  const t = $("turn");
  t.textContent = S.winner>=0 ? T.gameOver : T.turnLine(S.turn, who(S.cur));
  t.className = "turn " + (S.cur===0 ? "me" : "ai");
  $("pips").innerHTML = [0,1,2].map(i=>`<span class="pip ${i<S.actions?"on":""}"></span>`).join("");
  const opp = mode===1 ? 1-S.cur : 1;
  $("deck").textContent = T.deckLine(S.dn, who(opp));
  $("aihand").innerHTML = "<i></i>".repeat(S.hn[opp]) || "<span>0</span>";

  let h = `<div class="flag">${T.front}</div>`;
  S.cars.forEach((c,i)=>{
    let cls = `car o${c.owner}`;
    if(sel===i) cls += " sel";
    if(targeting!==null && E.can(A.ABIL, targeting, i)) cls += " tgt";
    if(c.used) cls += " used";
    if(i===flashIdx) cls += " flash";
    const badges = (c.type===6 && c.armor ? `<span class="tag">${T.tagArmor}</span>` : "") + (c.used ? `<span class="tag">${T.tagUsed}</span>` : "");
    h += `<div class="${cls}" data-i="${i}">
      <div class="pos">${i+1}</div>
      <div class="ic">${glyph(c.type)}</div>
      <div class="tx"><div class="nm">${TN(c.type)}<span class="tag who${c.owner}">${T.whoTag(c.owner, mode===1)}</span>${badges}</div><div class="ds">${TD(c.type)}</div></div>
    </div>`;
  });
  h += `<div class="storm"><span>${T.storm}</span></div>`;
  $("road").innerHTML = h;
  $("road").querySelectorAll(".car").forEach(el=>el.onclick=()=>tapCar(+el.dataset.i));
  $("log").innerHTML = logs.map(l=>`<div>${l()}</div>`).join("") || `<div>${T.logStart}</div>`;

  // Hand
  const hand = S.hand[me];
  const hb = $("hand");
  hb.innerHTML = hand.length ? hand.map((t,i)=>`<div class="hc ${handSel===i?"sel":""}" data-h="${i}"><div class="nm">${glyph(t)}${TN(t)}</div><div class="ds">${TD(t)}</div></div>`).join("")
    : `<div class="empty">${T.emptyHand}</div>`;
  hb.querySelectorAll(".hc").forEach(el=>el.onclick=()=>{ if(!human()||busy) return; handSel = handSel===+el.dataset.h?null:+el.dataset.h; sel=null; targeting=null; render(); });
  hb.querySelectorAll(".hc svg").forEach(s=>s.style.color = me===0 ? "var(--me)" : "var(--ai)");

  // Controls
  const ctl = $("ctl"); let hint = "";
  const can = human() && !busy && S.winner<0;
  if(targeting!==null){
    hint = T.pickTarget(TN(S.cars[targeting].type));
    ctl.innerHTML = `<button class="btn" id="cancel">${T.cancel}</button>`;
    $("cancel").onclick=()=>{targeting=null;render();};
  } else if(handSel!==null){
    hint = T.playQ(TN(hand[handSel]));
    ctl.innerHTML = `<button class="btn" id="cancel">${T.cancel}</button><button class="btn pri" id="play" ${E.can(A.PLAY,handSel,0)&&can?"":"disabled"}>${T.playBtn}</button>`;
    $("cancel").onclick=()=>{handSel=null;render();};
    $("play").onclick=()=>doAct(A.PLAY,handSel,0);
  } else if(sel!==null){
    const c = S.cars[sel], fl = TFLAGS[c.type];
    const abil = fl.passive ? false : fl.tgt ? S.cars.some((_,j)=>E.can(A.ABIL,sel,j)) : E.can(A.ABIL,sel,-1);
    hint = T.selected(TN(c.type));
    ctl.innerHTML = `<button class="btn" id="up" ${E.can(A.MOVE,sel,0)&&can?"":"disabled"}>${T.up}</button>
      <button class="btn" id="dn" ${E.can(A.MOVE,sel,1)&&can?"":"disabled"}>${T.down}</button>
      <button class="btn pri" id="ab" ${abil&&can?"":"disabled"}>${T.ability}</button>`;
    $("up").onclick=()=>doAct(A.MOVE,sel,0);
    $("dn").onclick=()=>doAct(A.MOVE,sel,1);
    $("ab").onclick=()=>{ if(fl.tgt){ targeting=sel; sel=null; render(); } else doAct(A.ABIL,sel,-1); };
  } else {
    hint = !can ? (S.winner>=0 ? "" : T.thinking(who(S.cur))) : S.actions>0 ? T.actsLeft(S.actions) : T.noActs;
    ctl.innerHTML = `<button class="btn" id="draw" ${E.can(A.DRAW,0,0)&&can?"":"disabled"}>${T.drawBtn}</button>
      <button class="btn pri" id="end" ${can?"":"disabled"}>${T.endBtn}</button>`;
    $("draw").onclick=()=>doAct(A.DRAW);
    $("end").onclick=()=>endTurn();
  }
  $("hint").textContent = hint;
  renderCoach();
}

function tapCar(i){
  if(!human()||busy||S.winner>=0) return;
  if(targeting!==null){
    if(E.can(A.ABIL,targeting,i)) doAct(A.ABIL,targeting,i);
    return;
  }
  handSel = null;
  sel = (S.cars[i].owner===S.cur && sel!==i) ? i : null;
  render();
}

function endTurn(){
  doAct(A.END);
  if(S.winner<0 && mode===0 && S.cur===1) aiTurn();
}

async function aiTurn(){
  busy = true; render();
  await wait(700);
  while(S.winner<0 && S.cur===1){
    const o = new Int32Array(E.memory.buffer, E.ai_next(), 3);
    const k=o[0], a=o[1], b=o[2];
    if(k===A.ABIL){ targeting=null; sel=a; render(); await wait(350); }
    doAct(k,a,b);
    await wait(k===A.END ? 300 : 750);
  }
  busy = false; render();
}
const wait = ms => new Promise(r=>setTimeout(r,ms));

function showEnd(){
  const T = L(), w = S.winner;
  $("endTitle").textContent = mode===1 ? T.winHot(who(w)) : (w===0 ? T.win : T.lose);
  $("endText").textContent = mode===1 ? T.endHot(S.turn-1) : (w===0 ? T.endWin(S.turn-1) : T.endLose);
  $("endM").classList.add("show");
}

// ---------------- Coach ----------------
let coachOn = true, coachOpen = true, coachCache = {key:"", data:null};
const nm = c => TN(c.type);
const owned = (c, me) => L().owned(nm(c), c.owner===me);
const rearOf = st => st.cars[st.len-1];
const cnt = (st,p) => st.cars.filter(c=>c.owner===p).length;
const idxOf = (st,id) => st.cars.findIndex(c=>c.id===id);

function stepLabel(st,k,a,b,me){
  const T = L();
  if(k===A.DRAW) return T.sDraw;
  if(k===A.PLAY) return T.sPlay(TN(st.hand[me][a]));
  if(k===A.MOVE) return T.sMove(nm(st.cars[a]), a+1, b===0);
  if(k===A.ABIL){
    const c = st.cars[a];
    const ti = c.type===0 ? a-1 : c.type===3 ? a+1 : b;
    const t = ti>=0 ? st.cars[ti] : null;
    return T.sAbil(nm(c), a+1, t ? owned(t,me) : "", ti+1);
  }
  return T.sEnd;
}

// Why is this step good? Compare the board right before and right after it.
function stepWhy(bf, af, k, a, b, me, later){
  const T = L(), why = [];
  const gone = bf.cars.filter(c => idxOf(af,c.id) < 0);
  const goneOpp = gone.filter(c=>c.owner!==me), goneMine = gone.filter(c=>c.owner===me);
  const actor = (k===A.MOVE||k===A.ABIL) ? bf.cars[a] : null;
  const setsUp = actor && later.some(s => s.k===A.ABIL && s.actorId===actor.id);

  if(goneOpp.length){
    why.push(T.wKill(goneOpp.map(nm), cnt(bf,1-me), cnt(af,1-me)));
    if(goneMine.length) why.push(T.wTrade(nm(goneMine[0])));
  }
  if(k===A.PLAY) why.push(T.wPlay);
  if(k===A.DRAW) why.push(T.wDraw);
  if(k===A.ABIL && actor.type===7) why.push(T.wScout);
  if(k===A.ABIL && actor.type===2) why.push(T.wNitro(nm(actor)));
  if(k===A.ABIL && actor.type===1) why.push(T.wHook(nm(bf.cars[b])));
  if(k===A.ABIL && actor.type===4) why.push(T.wTow(nm(bf.cars[b])));
  if(k===A.ABIL && actor.type===3) why.push(T.wOil(owned(bf.cars[a+1],me)));
  if(k===A.ABIL && actor.type===8) why.push(T.wSmoke);
  if(k===A.MOVE){
    const other = bf.cars[b===0 ? a-1 : a+1];
    if(b===0 && other.owner!==me) why.push(T.wFwdEnemy(nm(other)));
    else if(b===0) why.push(T.wFwd(nm(actor)));
    else if(other.owner!==me) why.push(T.wBackEnemy(nm(other)));
    else why.push(T.wSwapOwn);
  }
  if(setsUp){
    const nxt = later.find(s=>s.k===A.ABIL && s.actorId===actor.id);
    why.push(T.wSetup(nm(actor), nxt.label));
  }
  // Effect on who the storm will take at the end of this turn
  const r0 = rearOf(bf), r1 = rearOf(af);
  if(r0 && r1 && r0.id!==r1.id && k!==A.PLAY && k!==A.DRAW){
    if(r0.owner===me && r1.owner!==me) why.push(T.wRearFlip(nm(r0), nm(r1)));
    else if(r1.owner===me && r1.type===6 && r1.armor) why.push(T.wRearArmor);
    else if(r1.owner===me && r0.owner===me) why.push(T.wRearSwap(nm(r0), nm(r1)));
  }
  if(!why.length) why.push(T.wPrep);
  return why.join(" ");
}

// Simulate the coach's plan once; text is produced per language at render time.
function buildCoach(){
  const me = S.cur;
  const o = new Int32Array(E.memory.buffer, E.coach(), 12);
  const n = o[0], plan = [];
  for(let i=0;i<n;i++) plan.push({k:o[3+i*3], a:o[4+i*3], b:o[5+i*3]});
  E.save();
  const start = readState();
  E.sim(A.END,0,0); const base = readState(); E.restore();
  E.save();
  const steps = []; let st = start;
  for(const p of plan){
    const actor = (p.k===A.MOVE||p.k===A.ABIL) ? st.cars[p.a] : null;
    const s = {...p, before:st, actorId: actor ? actor.id : -1};
    E.sim(p.k,p.a,p.b); st = readState(); s.after = st; steps.push(s);
  }
  const preStorm = st;
  E.sim(A.END,0,0); const fin = readState(); E.restore();
  return {me, plan, steps, start, base, preStorm, fin};
}

function coachText(d){
  const T = L(), me = d.me;
  const steps = d.steps.map(s => ({...s, label: stepLabel(s.before,s.k,s.a,s.b,me)}));
  steps.forEach((s,i) => s.why = stepWhy(s.before, s.after, s.k, s.a, s.b, me, steps.slice(i+1)));
  const sum = [];
  const rb = rearOf(d.start), rp = rearOf(d.preStorm);
  const hit = c => (c.type===6 && c.armor) ? T.hitArmor(owned(c,me)) : T.hitEat(owned(c,me));
  if(d.fin.winner===me) sum.push(T.sumWin);
  if(rb) sum.push(T.sumNow(hit(rb), cnt(d.base,me), cnt(d.base,1-me)));
  if(d.plan.length && rp) sum.push(T.sumPlan(hit(rp), cnt(d.fin,me), cnt(d.fin,1-me), d.fin.hn[me]>d.start.hn[me] ? d.fin.hn[me] : 0));
  if(!d.plan.length) sum.push(T.sumNone);
  let warn = "";
  if(d.fin.winner<0 && d.fin.len){ const r = rearOf(d.fin); if(r.owner===me) warn = T.warn(nm(r)); }
  return {steps, sum, warn};
}

function renderCoach(){
  const box = $("coach"), T = L();
  if(!coachOn || !S || S.winner>=0 || busy || !human() || targeting!==null){ box.hidden = true; return; }
  const key = JSON.stringify([S.turn,S.cur,S.actions,S.cars.map(c=>[c.id,c.used,c.armor]),S.hand]);
  if(coachCache.key!==key) coachCache = {key, data: buildCoach()};
  const d = coachCache.data, x = coachText(d);
  box.hidden = false;
  const steps = x.steps.map((s,i)=>`<li class="${i===0?"now":""}"><b>${s.label}</b><span class="why">${s.why}</span></li>`).join("");
  box.innerHTML = `<div class="hd" id="coachHd" style="cursor:pointer">${T.coachHd} <small>${T.coachMeta(S.actions, coachOpen)}</small></div>
    ${coachOpen ? `${d.plan.length ? `<ol>${steps}<li><b>${T.sEnd}</b></li></ol>` : ""}
    <div class="sum">${x.sum.join("<br>")}${x.warn?`<div class="warn">${x.warn}</div>`:""}</div>
    <div class="tip">💡 ${T.tips[(S.turn+S.actions)%T.tips.length]}</div>` : ""}
    <button class="btn go" id="coachGo">${d.plan.length ? T.coachGo(x.steps[0].label) : T.sEnd}</button>`;
  $("coachHd").onclick = () => { coachOpen = !coachOpen; renderCoach(); };
  $("coachGo").onclick = () => { if(d.plan.length){ const p=d.plan[0]; doAct(p.k,p.a,p.b); } else endTurn(); };
  if(d.plan.length){
    const p = d.plan[0];
    if(p.k===A.MOVE||p.k===A.ABIL) $("road").querySelector(`.car[data-i="${p.a}"]`)?.classList.add("coachhint");
    if(p.k===A.PLAY) $("hand").querySelector(`.hc[data-h="${p.a}"]`)?.classList.add("coachhint");
    if(p.k===A.DRAW) $("draw")?.classList.add("coachhint");
  } else $("end")?.classList.add("coachhint");
}

function closeM(id){ $(id).classList.remove("show"); }
function start(m){
  mode = m; logs = []; sel = handSel = targeting = null; busy = false;
  closeM("endM");
  const first = Math.random()<0.5 ? 0 : 1;
  E.new_game((Math.random()*0xffffffff)>>>0 || 1, first);
  S = readState();
  log(() => L().firstGo(who(first)));
  render();
  if(mode===0 && S.cur===1) aiTurn();
}
function setLang(l){
  lang = l;
  try { localStorage.setItem("sandstorm-rally-lang", l); } catch(e){}
  applyStatic();
  if(S) render();
  if($("endM").classList.contains("show")) showEnd();
}

$("langBtn").onclick=()=>setLang(lang==="en" ? "ko" : "en");
$("coachBtn").onclick=()=>{ coachOn=!coachOn; $("coachBtn").classList.toggle("on",coachOn); render(); };
$("rulesBtn").onclick=()=>$("rules").classList.add("show");
$("rules").onclick = e => { if(e.target.id==="rules") closeM("rules"); };
applyStatic();

const bytes = Uint8Array.from(atob(WASM_B64), c=>c.charCodeAt(0));
WebAssembly.instantiate(bytes).then(({instance})=>{ E = instance.exports; start(0); });
</script>
