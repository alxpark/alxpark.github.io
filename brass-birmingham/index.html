<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brass: Birmingham Web Edition (unofficial, WebAssembly)</title>
<style>
:root{--bg:#f4efe4;--panel:#fffaf0;--ink:#2b2418;--mute:#7a6c55;--line:#d8cbb0;--acc:#a8541e;--hl:#ffcc00}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;font-size:14px}
header{padding:10px 14px;background:#3a2f22;color:#f4e6c8;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:700}
header .st{font-size:13px;opacity:.9}
#wrap{display:flex;flex-direction:column;gap:10px;padding:10px;max-width:1400px;margin:0 auto}
@media(min-width:1000px){#wrap{flex-direction:row;align-items:flex-start}#mapbox{flex:1.35;position:sticky;top:10px}#side{flex:1;max-width:520px}}
#mapbox{position:relative;background:#e9dfc8;border:1px solid var(--line);border-radius:10px;overflow:hidden}
#mapwrap{position:relative;width:100%;aspect-ratio:1000/1130;max-height:88vh;touch-action:pan-y;user-select:none;-webkit-user-select:none}
#mapwrap canvas{position:absolute;inset:0;width:100%;height:100%}
#mapctl{position:absolute;right:6px;bottom:6px;display:flex;flex-direction:column;gap:5px;z-index:3;opacity:.88}
#mapctl button{width:34px;height:34px;border-radius:9px;border:1px solid #7d6a48;background:rgba(255,250,240,.93);color:#3a2f22;font-size:16px;line-height:1;padding:0;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.2)}
#zlv{position:absolute;right:46px;bottom:10px;z-index:3;font-size:11.5px;background:rgba(255,250,240,.85);border-radius:6px;padding:2px 6px;color:#5b4a33;pointer-events:none}
#sheet{position:absolute;left:8px;right:48px;bottom:8px;max-height:52%;overflow:auto;background:rgba(255,250,240,.97);border:1px solid #c9b48a;border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.25);padding:10px 12px;z-index:4;display:none;font-size:13.5px;line-height:1.5}
#sheet.on{display:block;animation:fadeIn .25s ease-out}
#sheet .sh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
#sheet .sh b{font-size:15px}
#sheet .x{border:none;background:#e9dfc8;border-radius:8px;width:32px;height:32px;font-size:16px;cursor:pointer}
#sheet .opt{display:block;width:100%;text-align:left;margin-top:6px;padding:10px 11px;border-radius:9px;border:1px solid #d8cbb0;background:#fff;font-size:14px;color:var(--ink);cursor:pointer}
#sheet .opt.go{background:#5b4a33;color:#fff;border:none}
#sheet .sl{padding:5px 0;border-bottom:1px dashed #e4d7bc}
#sheet .sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid rgba(0,0,0,.25)}
#maphint{display:none;position:absolute;left:8px;top:8px;right:8px;z-index:3;background:rgba(58,47,34,.9);color:#f4e6c8;border-radius:10px;padding:7px 10px;font-size:12.5px;line-height:1.45}
#mapbox.fs{position:fixed;inset:0;z-index:30;border-radius:0;border:none;max-width:none}
#mapbox.fs #mapwrap{aspect-ratio:auto;height:100vh;height:100dvh;max-height:none}
#mapbox.fs #maphint{display:block;padding-right:52px}
#mapbox.fs #mapctl{z-index:6;opacity:1}
#mapbox.fs #zfs{position:fixed;box-shadow:0 2px 8px rgba(0,0,0,.35);right:14px;top:14px;width:38px;height:38px;background:#fff8e8}
body.fsopen{overflow:hidden}
@media(max-width:700px){#wrap{padding:6px}#mapbox{margin:0 -2px}}
canvas{display:block;width:100%;height:auto;touch-action:manipulation}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.card h3{margin:0 0 8px;font-size:13px;color:var(--mute);font-weight:600}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.me{display:flex;gap:14px;font-size:15px;flex-wrap:wrap}
.me b{font-size:18px}
.hand button{border:1.5px solid #b9a77f;background:#fff;border-radius:8px;padding:7px 9px;font-size:13px;cursor:pointer;color:var(--ink)}
.hand button.loc{background:#eef3fb;border-color:#8fa8cc}
.hand button.ind{background:#fbf1e3;border-color:#d0a26b}
.hand button.wild{background:#f1ebfa;border-color:#a78bd0}
.hand button.sel{outline:3px solid #e0a800;outline-offset:2px;animation:glowCard 2.6s ease-in-out infinite;position:relative;z-index:1;font-weight:700}
@keyframes glowCard{0%,100%{box-shadow:0 0 3px 1px rgba(255,190,0,.35);transform:scale(1)}50%{box-shadow:0 0 18px 6px rgba(255,190,0,.85);transform:scale(1.06)}}
.acts button.on{animation:glowBtn 2.6s ease-in-out infinite}
@keyframes glowBtn{0%,100%{box-shadow:0 0 2px 1px rgba(168,84,30,.3)}50%{box-shadow:0 0 16px 5px rgba(255,150,40,.8)}}
#cardinfo{margin-top:10px;border-radius:10px;padding:10px 12px;background:#fffbea;border:2px solid #e0b000;animation:glowBox 2.6s ease-in-out infinite;font-size:13px;line-height:1.55}
#cardinfo:empty{display:none}
#cardinfo .cn{font-size:15px;font-weight:700}
#cardinfo .cnt{display:inline-block;background:#fff;border:1px solid #e0c060;border-radius:6px;padding:1px 7px;margin:3px 4px 0 0;font-size:12px}
@keyframes glowBox{0%,100%{box-shadow:0 0 2px 0 rgba(224,176,0,.3)}50%{box-shadow:0 0 16px 4px rgba(224,176,0,.6)}}
#fxbar{font-size:12.5px;margin-top:6px;min-height:0}
#fxbar div{animation:fadeIn .6s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1}}
.acts button,.opts button,.big{border:none;background:#5b4a33;color:#fff;border-radius:8px;padding:8px 11px;font-size:13px;cursor:pointer}
.acts button[disabled]{background:#cfc4ae;color:#8a7d66;cursor:default}
.acts button.on{background:var(--acc)}
.opts{max-height:260px;overflow:auto;margin-top:8px;display:flex;flex-direction:column;gap:5px}
.opts button{background:#fff;color:var(--ink);border:1px solid var(--line);text-align:left}
.opts button:hover{border-color:var(--acc)}
.opts button.done{background:#3c6e47;color:#fff;border:none}
.hint{color:var(--mute);font-size:12.5px;margin-top:6px;line-height:1.45}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{padding:4px 5px;border-bottom:1px solid #eadfca;text-align:left}
th{color:var(--mute);font-weight:600}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
#log{max-height:220px;overflow:auto;font-size:12.5px;line-height:1.55}
#log div{border-bottom:1px dashed #eadfca;padding:2px 0}
.stock{font-size:12.5px;line-height:1.6}
#setup{position:fixed;inset:0;background:rgba(40,30,18,.75);display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}
#setup .box{background:var(--panel);border-radius:14px;padding:20px;max-width:440px;width:100%}
#setup h2{margin:0 0 6px}
#setup p{color:var(--mute);line-height:1.5;font-size:13px}
#setup .row button{flex:1;padding:12px;font-size:15px}
.tag{display:inline-block;background:#efe5cf;border-radius:5px;padding:1px 6px;font-size:12px;margin-right:4px}
details summary{cursor:pointer;color:var(--mute);font-size:13px}
.rules{font-size:12.5px;line-height:1.6;color:#4a3f2e}
.rec{border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin-top:8px;background:#fff}
.rec.top{border:2px solid #d4a017;background:#fffbea}
.rec .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.rec .hd b{font-size:14px}
.rec .sc{font-size:12px;color:#3c6e47;white-space:nowrap;font-weight:600}
.rec .sc.neg{color:#a33}
.rec ul{margin:6px 0 6px 16px;padding:0;font-size:12.8px;line-height:1.55}
.rec .fx{font-size:12px;color:var(--mute)}
.rec .row button{font-size:12px;padding:6px 9px}
.rec .row button.ghost{background:#fff;color:#5b4a33;border:1px solid #5b4a33}
.coachsum{font-size:13px;line-height:1.5;margin-top:4px}
header .hr{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#langbtn{border:1px solid rgba(244,230,200,.55);background:transparent;color:#f4e6c8;border-radius:7px;padding:4px 9px;font-size:12.5px;cursor:pointer}
#setup .lang{display:flex;gap:6px;justify-content:flex-end;margin-bottom:6px}
#setup .lang button{border:1px solid #b9a77f;background:#fff;border-radius:7px;padding:4px 10px;font-size:12.5px;cursor:pointer}
#setup .lang button.on{background:#5b4a33;color:#fff;border-color:#5b4a33}
</style>
</head>
<body>
<header><h1><span data-i="h1"></span> <span data-i="h1sub" style="font-weight:400;font-size:12px;opacity:.7"></span></h1><div class="hr"><div class="st" id="status"></div><button id="langbtn" type="button"></button></div></header>
<div id="wrap">
  <div id="mapbox"><div id="mapwrap"><canvas id="cv"></canvas>
    <div id="mapctl"><button id="zin">＋</button><button id="zout">－</button><button id="zfit">⤢</button><button id="zfs">⛶</button></div>
    <div id="zlv"></div><div id="maphint"></div><div id="sheet"></div></div></div>
  <div id="side">
    <div class="card">
      <div class="me" id="me"></div>
      <div class="hint" id="turnhint"></div>
      <div id="fxbar"></div>
    </div>
    <div class="card" id="coachcard">
      <div class="row" style="justify-content:space-between"><h3 style="margin:0" data-i="coachTitle"></h3>
      <label style="font-size:12.5px;color:var(--mute)"><input type="checkbox" id="coachon" checked> <span data-i="coachOnLbl"></span></label></div>
      <div id="coach"></div>
    </div>
    <div class="card">
      <h3 data-i="handTitle"></h3>
      <div class="row hand" id="hand"></div>
      <div id="cardinfo"></div>
      <div class="row acts" id="acts" style="margin-top:10px"></div>
      <div class="opts" id="opts"></div>
      <div class="hint" id="ahint"></div>
    </div>
    <div class="card"><h3 data-i="playersTitle"></h3><div id="players"></div><div class="hint" id="market"></div></div>
    <div class="card"><h3 data-i="stockTitle"></h3><div class="stock" id="stock"></div></div>
    <div class="card"><h3 data-i="logTitle"></h3><div id="log"></div></div>
    <div class="card"><details><summary data-i="rulesSum"></summary><div class="rules" data-ih="rulesHtml"></div></details></div>
  </div>
</div>
<div id="setup"><div class="box">
  <div class="lang"><button type="button" data-lang="en">English</button><button type="button" data-lang="ko">한국어</button></div>
  <h2 data-i="setupTitle"></h2>
  <p data-i="setupText"></p>
  <div class="row"><button class="big" data-n="2" data-i="ai1"></button><button class="big" data-n="3" data-i="ai2"></button><button class="big" data-n="4" data-i="ai3"></button></div>
</div></div>
<script>
/* UI strings. English is the default; Korean is the alternative. */
const I18N = {
en: {
  htmlLang: "en",
  title: "Brass: Birmingham Web Edition (unofficial, WebAssembly)",
  h1: "Brass: Birmingham Web Edition", h1sub: "(unofficial · WebAssembly)",
  langBtn: "한국어",
  TN: ["Cotton Mill", "Manufacturer", "Pottery", "Coal Mine", "Iron Works", "Brewery"],
  TCH: ["C", "M", "P", "Co", "Fe", "Br"],
  PNAME: ["You", "AI 1", "AI 2", "AI 3"],
  MTN: ["", "blank", "Cotton", "Manufactured goods", "Pottery", "Any"],
  MTCH: ["", "×", "C", "M", "P", "★"],
  BONUS: {22: "+4 VP", 23: "free develop", 24: "+2 income", 25: "£5", 26: "+3 VP"},
  farm: ["Farm Brewery (N)", "Farm Brewery (S)"],
  cards: {20: "Iron Works", 21: "Coal Mine", 22: "Cotton / Manufacturer", 23: "Pottery", 24: "Brewery", 30: "Wild Location", 31: "Wild Industry"},
  canal: "Canal", rail: "Rail", canalEra: "Canal era", railEra: "Rail era",
  inactive: " (inactive)", beerBonus: "Beer bonus ",
  legendCanal: "Dashed blue = canal can be built", legendRail: "Dashed grey = rail can be built",
  coachTitle: "🧠 Coach", coachOnLbl: "Coach on",
  handTitle: "Hand — pick a card, then choose an action",
  playersTitle: "Players (turn order)", stockTitle: "My next industry tiles", logTitle: "Log",
  rulesSum: "Rules summary (core rules edition)",
  rulesHtml: `<p><b>Flow</b> — Canal era, then Rail era. Each round everyone takes 2 actions (1 in the very first round), discarding a card for each. Whoever spent least last round goes first. At the end of a round you collect money equal to your income level.</p>
<p><b>Build</b> — Location card: any slot in that town (even outside your network). Industry card: that industry inside your network. Wild cards come from Scouting. In the Canal era you may have only one tile per town, and Level 1 tiles cannot be built in the Rail era.</p>
<p><b>Coal</b> — free from the nearest connected mine; otherwise buy from the market if you are connected to a merchant. <b>Iron</b> — free from any iron works; otherwise from the market. <b>Beer</b> — when selling: your own brewery (anywhere), a connected opponent's brewery, or the merchant's beer (bonus!).</p>
<p><b>Sell</b> — selling cotton, goods or pottery to a connected merchant that wants it flips the tile and raises your income. Coal mines, iron works and breweries flip when their last cube is used.</p>
<p><b>Scoring</b> — at the end of each era: links (sum of link icons on flipped tiles at both ends; merchants count 2) + VP of flipped tiles. After the Canal era, links and Level 1 tiles are removed.</p>
<p><b>Simplifications</b> — coal/iron/beer sources are chosen automatically. When scouting, the other 2 discarded cards are taken from the back of your hand. If you cannot pay negative income, you lose VP equal to the shortfall. The map and numbers approximate the original; all graphics are hand-drawn.</p>`,
  setupTitle: "New game", setupText: "You (red) vs the computer. The game engine and AI are written in C and compiled to WebAssembly. How many AI opponents?",
  ai1: "1 AI", ai2: "2 AIs", ai3: "3 AIs", newGame: "New game",
  loadFail: "Failed to load", loadFailText: "WebAssembly cannot run in this environment: ",
  cantDo: "That action is not possible",
  zin: "Zoom in", zout: "Zoom out", zfit: "Whole map", zfs: "Fullscreen", zfsClose: "Close fullscreen", close: "Close",
  fx: {build: "Built", flip: "Flipped ✓", coal: " coal", iron: " iron", beer: " beer", removed: "Removed", beerUsed: "Beer used"},
  slotN: n => `slot ${n}`,
  sheetRun: "Tap a button to do it.",
  buys: "Buys", buysAll: "cotton, goods and pottery", inactiveM: "Inactive", hasBeer: " · 🍺 merchant beer available", beerGone: " · beer used",
  bonusIf: b => `Selling with merchant beer gives: ${b}`,
  emptySlot: "empty", flipped: "✓ flipped", notFlipped: "(not flipped yet)",
  resName: t => t === 3 ? "coal" : t === 4 ? "iron" : t === 5 ? "beer" : "",
  tileLine: (vp, inc, lnk, beer) => `${vp} VP · income +${inc} · link icons ${lnk}${beer != null ? ` · needs ${beer} beer to sell` : ""}`,
  linksLine: (b, n) => `Links: ${b || "none yet"} (${n} possible)`,
  hintStatus: (era, r, R, m, l, vp) => `${era} ${r}/${R} · £${m} · income ${l} · ${vp} VP`,
  gameOver: "Game over", turnOf: p => `${p}'s turn…`,
  subPhaseHint: "Tap a glowing spot, or close and choose Finish in the panel.",
  cardHint: (c, m) => `Card <b>${c}</b>${m ? ` · <b>${m}</b>: tap a glowing spot` : " · glowing slots = where this card can build"}`,
  modeName: {build: "Build", dev: "Develop", sell: "Sell"},
  /* coach */
  coachOff: "The coach is off.", coachOver: "The game is over.",
  coachWait: p => `It's ${p}'s turn. Recommendations appear on your turn.`,
  r_vp: v => `Immediate VP <b>${v}</b>`,
  r_flip: (v, canal) => `Locks in flipped-tile points <b>${v}</b> — they score at the end of the era${canal ? " (Lv2+ tiles score again at the end of the Rail era)" : ""}`,
  r_new: (v, tl) => `Expected value of the new tile <b>${v}</b> — ${tl >= 0 && tl <= 2 ? "once you sell it" : tl === 5 ? "once someone drinks its beer" : "once someone uses up its cubes"}, it flips for points and income`,
  r_link: (v, canal) => `Link value <b>${v}</b> — at the end of the ${canal ? "Canal" : "Rail"} era it scores the link icons of flipped tiles at both ends, and it extends your network`,
  r_incUp: v => `Income up <b>${v}</b> — more money every remaining round`,
  r_incDown: v => `Income down <b>${v}</b> — a loss for the rest of the game`,
  r_cost: (c, v) => `Costs £${c} (money value ${v})`,
  r_cash: v => `Gets you cash (${v})`,
  r_cashRisk: v => `⚠ Cash drops below £10, which may block your next actions (${v})`,
  r_cashFix: v => `Fixes a cash shortage (${v})`,
  r_dev: v => `Unlocks higher-level tiles (${v})`,
  r_devRail: "Level 1 tiles can't be built in the Rail era, so developing unblocks this industry",
  r_sellable: "Already connected to a merchant that buys it — you can <b>sell right away</b>",
  r_notSellable: canal => `Not yet connected to a merchant that buys this — you'll need a ${canal ? "canal" : "rail"} link to sell it`,
  r_lv1: "Level 1 tiles disappear after the Canal era, so they score only once",
  r_loan: "Late in the game the income loss matters less, so loans get better",
  r_scout: "Two wild cards let you build anywhere, even outside your network",
  r_pass: "Everything else loses value right now, so just discard a card",
  r_coalStuck: "Not connected to a merchant, so the coal stays on the tile instead of selling — it flips when someone uses it",
  r_done: "Extra actions gain nothing, so finishing here is best",
  r_alts: (ind, list) => `<span style="color:#7a6c55">Equally good ${ind ? "other industries" : "other spots"}: ${list}</span>`,
  recName: (t, rail) => ({0: "Pass", 1: "Build", 2: rail ? "Rail link" : "Canal link", 3: "Develop", 4: "Sell", 5: "Loan", 6: "Scout", 7: "Finish action", 8: "Second rail", 9: "Develop again", 10: "Sell more", 11: "Bonus develop"})[t],
  s_money: m => `Only £${m} left, so options are limited.`,
  s_negInc: l => `Your income is ${l} — flipping tiles to raise it is urgent.`,
  s_unsold: n => `You have ${n} unsold goods tile${n > 1 ? "s" : ""}.`,
  s_canalEnd: "End of the Canal era — tiles and canals you flip now will score soon.",
  vsPass: "vs pass", vsDone: "vs finish",
  useCard: c => `Card to use: ${c}`, expect: "Expected result: ",
  runIt: "Do it", showIt: "Show card & spot",
  /* card info */
  ci_town: n => `You can build any industry shown in a slot in <b>${n}</b>, regardless of your network.`,
  ci_wl: "Pick any <b>town</b> and build in its slots (not farm breweries). Only available by scouting.",
  ci_wi: net => `Build <b>any industry</b> ${net ? "inside your network" : "anywhere on the map"}. Only available by scouting.`,
  ci_ind: (net, tn) => `Build <b>${tn}</b> ${net ? "<b>inside your network</b> (towns your tiles or links touch)" : "<b>anywhere</b>, since you have nothing on the map yet"}.`,
  ci_indName: {20: "an Iron Works", 21: "a Coal Mine", 22: "a Cotton Mill or Manufacturer", 23: "a Pottery", 24: "a Brewery"},
  ci_discard: " Using it for any other action (link, develop, sell, loan, pass) just discards it.",
  ci_next: (tn, lv, cost, coal, iron, vp, inc) => `Next ${tn}: Lv${lv} · £${cost}${coal ? ` coal ${coal}` : ""}${iron ? ` iron ${iron}` : ""} → ${vp} VP, income +${inc}`,
  ci_sel: c => `🃏 Selected card: ${c}`,
  ci_counts: (b, net, n, s, d) => `<span class="cnt">Build ${b} spots</span><span class="cnt">${net} ${n} spots</span><span class="cnt">Sell ${s}</span><span class="cnt">Develop ${d} types</span>`,
  ci_glow: "Glowing slots on the map are where this card can build.",
  recent: "✨ Recently: ",
  /* labels */
  l_build: (L, tn, lv, vp, inc, c) => `${L} · ${tn} Lv${lv} (${vp} VP, income +${inc})${c}`,
  l_dev: (tn, lv, c) => `Remove ${tn} Lv${lv}${c}`,
  l_sell: (L, tn, lv, b) => `Sell ${tn} Lv${lv} in ${L} (beer ${b})`,
  l_skipBonus: "Skip bonus develop", l_finish: "Finish action",
  /* panel */
  status: (era, r, R, d, p) => `${era} · round ${r}/${R} · deck ${d} · turn: ${p}`,
  me: (m, l, vp, sp) => `<span>Money <b>£${m}</b></span><span>Income <b>${l}</b></span><span>VP <b>${vp}</b></span><span>Spent this round £${sp}</span>`,
  final: "Final result", place: (k, p, vp) => `#${k} ${p} ${vp} VP`,
  yourTurn: n => `<b>Your turn</b> — ${n} action${n > 1 ? "s" : ""} left`, thinking: p => `${p} is thinking…`,
  acts: {build: "Build", dev: "Develop", sell: "Sell", loan: "Loan", scout: "Scout", pass: "Pass"},
  ah_loan: "Take £30, income level −3. ", ah_scout: "Discard this card + 2 more to take a Wild Location and a Wild Industry card. ", ah_pass: "Discard this card and do nothing. ",
  ah_again: "Tap again to confirm.",
  ah_mode: {build: "Tap a slot with a yellow outline on the map, or pick from the list.", net: "Tap a yellow dot on the map, or pick from the list.", dev: "Spend 1 iron to remove the lowest tile of an industry (you may do one more).", sell: "Sell your cotton, goods or pottery connected to a merchant."},
  ah_pick: "Pick a card, then an action. Impossible actions are greyed out.",
  ah_phase: {1: "You may build a second rail (£10 + 1 coal + 1 beer).", 2: "You may develop once more (1 iron).", 3: "Keep selling or finish.", 4: "Gloucester bonus: choose an industry to develop without iron."},
  th: ["#", "Player", "VP", "Money", "Income", "Spent", "Hand"],

  rulesHtml: `<p><b>흐름</b> — 운하 시대 → 철도 시대. 매 라운드 각자 행동 2번(게임 첫 라운드는 1번). 행동마다 카드 1장을 버립니다. 지난 라운드에 돈을 덜 쓴 사람이 먼저 합니다. 라운드가 끝나면 수입 레벨만큼 돈을 받습니다.</p>
<p><b>건설</b> — 장소 카드: 그 도시 어디든(내 네트워크 밖이어도 OK). 산업 카드: 내 네트워크 안에서 해당 산업. 와일드 카드는 정찰로 얻습니다. 운하 시대엔 도시당 내 타일 1개만, Lv1 타일은 철도 시대에 못 짓습니다.</p>
<p><b>석탄</b> — 연결된 가장 가까운 탄광에서 무료로, 없으면 상인과 연결돼 있을 때 시장에서 삽니다. <b>철</b> — 어느 제철소든 무료, 없으면 시장. <b>맥주</b> — 판매 시 내 양조장(어디든), 연결된 남의 양조장, 판매하는 상인의 맥주(보너스!).</p>
<p><b>판매</b> — 면직물·제조업·도자기를 연결된 상인(종류가 맞아야 함)에게 팔면 타일이 뒤집히고 수입이 오릅니다. 탄광·제철소·양조장은 자원이 다 쓰이면 뒤집힙니다.</p>
<p><b>점수</b> — 시대가 끝날 때 연결로(양 끝의 뒤집힌 타일 연결 아이콘 합, 상인은 2) + 뒤집힌 타일 점수. 운하 시대 후 연결로와 Lv1 타일은 사라집니다.</p>
<p><b>단순화한 부분</b> — 석탄/철/맥주 출처는 자동으로 고릅니다. 정찰 시 나머지 2장은 손패 뒤쪽 카드가 버려집니다. 돈이 모자라 수입을 못 내면 부족한 만큼 점수를 잃습니다. 맵과 수치는 원작을 참고한 근사치이며 그래픽은 직접 그린 것입니다.</p>`,

/* ---------- language ---------- */
let LANG="en";
try{const v=localStorage.getItem("brass-lang");if(v==="en"||v==="ko")LANG=v}catch(_){}
let TX=I18N[LANG];
const tr=(k,...a)=>{const v=TX[k];return typeof v==="function"?v(...a):v};
const TN_=t=>TX.TN[t];
function applyStatic(){
  document.documentElement.lang=TX.htmlLang;document.title=TX.title;
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=TX[e.dataset.i]);
  document.querySelectorAll("[data-ih]").forEach(e=>e.innerHTML=TX[e.dataset.ih]);
  document.getElementById("langbtn").textContent=TX.langBtn;
  document.querySelectorAll("#setup .lang button").forEach(b=>b.classList.toggle("on",b.dataset.lang===LANG));
  [["zin","zin"],["zout","zout"],["zfit","zfit"]].forEach(([id,k])=>{const b=document.getElementById(id);b.setAttribute("aria-label",TX[k]);b.title=TX[k]});
  const fs=document.getElementById("zfs"),on=document.getElementById("mapbox").classList.contains("fs");
  fs.setAttribute("aria-label",on?TX.zfsClose:TX.zfs);fs.title=fs.getAttribute("aria-label");
}
function setLang(l){
  LANG=l;TX=I18N[l];try{localStorage.setItem("brass-lang",l)}catch(_){}
  applyStatic();
  if(S){COACH=null;render()}
}
document.getElementById("langbtn").onclick=()=>setLang(LANG==="en"?"ko":"en");

applyStatic();

    else if(s[0]>=0&&s[3]&&!p[3])out.push({kind:'slot',k,o:s[0],txt:"flip",start:now});
    else if(s[0]>=0&&s[4]<p[4])out.push({kind:'slot',k,o:s[0],txt:"use",n:p[4]-s[4],t:s[1],start:now,small:1});

  if(!had||!G)return;
  if(G.type==='pinch'){if(PT.size===0)G=null;return}
  if(G.type==='tap'&&e.type==='pointerup'&&performance.now()-G.t<600){
    const p={x:G.sx,y:G.sy},touch=G.touch,now=performance.now();
    if(lastTap&&now-lastTap.t<320&&Math.hypot(p.x-lastTap.x,p.y-lastTap.y)<30){
      clearTimeout(tapTimer);lastTap=null;
      if(VW.s>FIT*2.4)document.getElementById('zfit').onclick();else{const L=toL(p.x,p.y),ns=VW.s*2;animateTo({s:ns,ox:L.x-p.x/ns,oy:L.y-p.y/ns})}
    }else{lastTap={...p,t:now};clearTimeout(tapTimer);
      if(touch)tapTimer=setTimeout(()=>onTap(p,true),260);else onTap(p,false)}
  }
  G=null;
};
cv.addEventListener('pointerup',endPt);cv.addEventListener('pointercancel',endPt);
function onTap(p,touch){
  const L=toL(p.x,p.y);let best=null,bd=1e9;
  for(const h of HIT){const d=Math.hypot(h.x-L.x,h.y-L.y);if(d<h.r&&d<bd){bd=d;best=h}}
  if(best){
    if(best.acts.length===1&&!touch){doAct(best.acts[0]);return}
    showChoices(best);return}
  for(let i=0;i<MAP.locs.length;i++){const B=boxOf(i),m=Math.max(6,10/VW.s);
    if(L.x>B.x-m&&L.x<B.x+B.w+m&&L.y>B.y-m-16&&L.y<B.y+B.h+m){showLocInfo(i);return}}
  closeSheet();
}
function closeSheet(){sheet.classList.remove('on');sheet.innerHTML="";INFO_LOC=null;SHEET_ACTS=null;draw()}
function showChoices(hit){
  INFO_LOC=null;SHEET_ACTS=hit.acts;
  const where=hit.kind==='link'?(()=>{const l=MAP.links[hit.i];return `${locName(l[0])} ↔ ${locName(l[1])}`})():locName(MAP.slots[hit.i][0]);
  sheet.innerHTML=`<div class="sh"><b>${where}</b><button class="x" aria-label="${TX.close}">✕</button></div>`+
    hit.acts.map(a=>`<button class="opt go" data-a="${a}">${label(a)}</button>`).join("")+
    `<div class="hint">${TX.sheetRun}</div>`;
  sheet.querySelector('.x').onclick=closeSheet;
  sheet.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{closeSheet();doAct(+b.dataset.a)});
  sheet.classList.add('on');
}
function showLocInfo(i){
  INFO_LOC=i;SHEET_ACTS=null;let body="";
  if(i>=22){
    const ms=MAP.mloc.map((m,k)=>m===i?k:-1).filter(k=>k>=0);
    body=ms.map(k=>{const m=S.merch[k];return `<div class="sl">${m[0]?`${TX.buys}: <b>${m[0]===5?TX.buysAll:TX.MTN[m[0]]}</b>`:TX.inactiveM}${m[0]>=2?(m[1]?TX.hasBeer:TX.beerGone):""}</div>`}).join("")+
      (TX.BONUS[i]?`<div class="hint">${tr('bonusIf',TX.BONUS[i])}</div>`:"");
  }else{
    body=locSlots(i).map((k,j)=>{const s=S.slots[k],m=MAP.slots[k][1];
      if(s[0]<0)return `<div class="sl">${tr('slotN',j+1)} · ${TX.emptySlot} — ${[0,1,2,3,4,5].filter(t=>m&(1<<t)).map(t=>`<span class="sw" style="background:${TCOL[t]}"></span>${TN_(t)}`).join(" / ")}</div>`;
      const T=MAP.tiles[s[1]][s[2]-1],res=TX.resName(s[1]);
      return `<div class="sl">${tr('slotN',j+1)} · ${pn(s[0])} <span class="sw" style="background:${TCOL[s[1]]}"></span><b>${TN_(s[1])} Lv${s[2]}</b> ${s[3]?TX.flipped:TX.notFlipped}${res?` · ${res} ${s[4]}`:""}<br><span style="color:#7a6c55;font-size:12.5px">${TX.tileLine(T[4],T[5],T[6],s[1]<=2?T[7]:null)}</span></div>`}).join("");
  }
  const lk=MAP.links.map((l,k)=>(l[0]===i||l[1]===i)?k:-1).filter(k=>k>=0);
  const built=lk.filter(k=>S.links[k]>=0).map(k=>{const l=MAP.links[k],o=l[0]===i?l[1]:l[0];return `${pn(S.links[k])}→${locName(o)}`});
  body+=`<div class="hint">${TX.linksLine(built.join(", "),lk.length)}</div>`;
  sheet.innerHTML=`<div class="sh"><b>${locName(i)}</b><button class="x" aria-label="${TX.close}">✕</button></div>${body}`;
  sheet.querySelector('.x').onclick=closeSheet;sheet.classList.add('on');draw();
}
function renderMapHint(){
  const el=document.getElementById('maphint');if(!mapbox.classList.contains('fs')||!S){return}
  const me=S.players[0];let t=TX.hintStatus(eraName(),S.round,S.rounds,me.money,me.lvl,me.vp)+"<br>";
  if(S.over)t+=TX.gameOver;else if(S.cur!==0)t+=TX.turnOf(pname(S.cur));
  else if(S.phase!==0)t+=TX.subPhaseHint;
  else{const c=me.hand[sel];const mn=mode==='net'?(S.era?TX.rail:TX.canal):TX.modeName[mode]||"";t+=TX.cardHint(cardName(c),mode?mn:"")}
  el.innerHTML=t;
}
/* ---------- coach ---------- */
let COACH=null;
const coachOn=()=>document.getElementById('coachon').checked;
document.getElementById('coachon').onchange=()=>{COACH=null;render()};
function sgn(v){return (v>0?"+":"")+v.toFixed(1)}
function targetName(t,x){
  if(t===1||t===4||t===10)return locName(MAP.slots[x][0]);
  if(t===2||t===8){const l=MAP.links[x];return `${locName(l[0])}↔${locName(l[1])}`}
  if(t===3||t===9||t===11)return TN_(x);
  return "";
}
function reasons(r){
  const d=D(r.a),P=r.parts,out=[];
  const tl=d.t===1?d.y:(d.t===4||d.t===10)?S.slots[d.x][1]:-1;
  if(Math.abs(P[0])>=0.3)out.push(TX.r_vp(sgn(P[0])));
  if(P[1]>=0.3)out.push(TX.r_flip(sgn(P[1]),S.era===0));
  if(P[2]>=0.3)out.push(TX.r_new(sgn(P[2]),tl));
  if(P[3]>=0.3)out.push(TX.r_link(sgn(P[3]),S.era===0));
  if(P[4]>=0.3)out.push(TX.r_incUp(sgn(P[4])));
  if(P[4]<=-0.3)out.push(TX.r_incDown(sgn(P[4])));
  if(r.cost>0)out.push(TX.r_cost(r.cost,sgn(P[5])));
  else if(P[5]>=0.3)out.push(TX.r_cash(sgn(P[5])));
  if(P[6]<=-0.3)out.push(TX.r_cashRisk(sgn(P[6])));
  if(P[6]>=0.3)out.push(TX.r_cashFix(sgn(P[6])));
  if(P[7]>=0.15&&(d.t===3||d.t===9||d.t===11))out.push(TX.r_dev(sgn(P[7])));
  if(P[7]>=1&&S.era===1)out.push(TX.r_devRail);
  if(r.sellable===1)out.push(TX.r_sellable);
  if(r.sellable===0)out.push(TX.r_notSellable(S.era===0));
  if(d.t===1&&tl>=0&&nextLv(0,tl)===1&&S.era===0)out.push(TX.r_lv1);
  if(d.t===5)out.push(TX.r_loan);
  if(d.t===6)out.push(TX.r_scout);
  if(d.t===0)out.push(TX.r_pass);
  if(d.t===1&&tl===3&&!r.fx.some(f=>f.startsWith('CS|'))&&P[1]<0.3)out.push(TX.r_coalStuck);
  if(d.t===7)out.push(TX.r_done);
  if(r.alts.length)out.push(TX.r_alts([3,9,11].includes(d.t),r.alts.map(x=>targetName(d.t,x)).join(", ")));
  return out;
}
function recTitle(r){
  const d=D(r.a),nm=TX.recName(d.t,S.era===1);
  return nm+([0,5,6,7].includes(d.t)?"":" — "+label(r.a));
}
function renderCoach(){
  const el=document.getElementById('coach');
  if(!coachOn()){el.innerHTML=`<div class="hint">${TX.coachOff}</div>`;return}
  if(S.over){el.innerHTML=`<div class="hint">${TX.coachOver}</div>`;return}
  if(S.cur!==0){el.innerHTML=`<div class="hint">${TX.coachWait(pn(S.cur))}</div>`;COACH=null;return}
  if(!COACH)COACH=JSON.parse(dec.decode(new Uint8Array(X.memory.buffer,X.out_ptr(),X.coach(4))));
  const me=S.players[0];
  let sum=[];
  if(me.money<8)sum.push(TX.s_money(me.money));
  if(me.lvl<0)sum.push(TX.s_negInc(me.lvl));
  const unsold=S.slots.filter(s=>s[0]===0&&!s[3]&&s[1]<=2).length;
  if(unsold&&S.phase===0)sum.push(TX.s_unsold(unsold));
  if(S.era===0&&S.round>=S.rounds-1)sum.push(TX.s_canalEnd);
  let html=sum.length?`<div class="coachsum">${sum.join(" ")}</div>`:"";
  COACH.filter((r,k)=>k===0||![0,6,7].includes(D(r.a).t)).slice(0,3).forEach((r,k)=>{
    const d=D(r.a),card=(S.phase===0)?me.hand[d.c]:null;
    html+=`<div class="rec ${k===0?'top':''}"><div class="hd"><b>${k===0?"⭐ ":""}${k+1}. ${recTitle(r)}</b><span class="sc ${r.d<0?'neg':''}">${S.phase===0?TX.vsPass:TX.vsDone} ${sgn(r.d)}</span></div>
    ${card!=null?`<div class="fx">${TX.useCard(cardName(card))}</div>`:""}
    <ul>${reasons(r).map(x=>`<li>${x}</li>`).join("")}</ul>
    ${r.fx.length>1?`<div class="fx">${TX.expect}${r.fx.slice(1).map(fmtLog).join(" / ")}</div>`:""}
    <div class="row" style="margin-top:6px"><button class="big" data-run="${r.a}">${TX.runIt}</button>${S.phase===0&&![0,5,6].includes(d.t)?`<button class="big ghost" data-show="${r.a}">${TX.showIt}</button>`:""}</div></div>`;
  });
  el.innerHTML=html;
  el.querySelectorAll('[data-run]').forEach(b=>b.onclick=()=>doAct(+b.dataset.run));
  el.querySelectorAll('[data-show]').forEach(b=>b.onclick=()=>{const d=D(+b.dataset.show);sel=d.c;mode={1:'build',2:'net',3:'dev',4:'sell'}[d.t];render();document.getElementById('mapbox').scrollIntoView({behavior:'smooth',block:'start'});setTimeout(focusTargets,350)});
}
function renderCardInfo(){
  const el=document.getElementById('cardinfo'),me=S.players[0];
  if(S.over||S.cur!==0||S.phase!==0||!me.hand.length){el.innerHTML="";return}
  const c=me.hand[sel],mine=LEGAL.filter(a=>D(a).c===sel),n=t=>new Set(mine.filter(a=>D(a).t===t).map(a=>D(a).x)).size;
  const net=S.slots.some(s=>s[0]===0)||S.links.some(l=>l===0);
  let what;
  if(c<20)what=TX.ci_town(locName(c));
  else if(c===30)what=TX.ci_wl;
  else if(c===31)what=TX.ci_wi(net);
  else what=TX.ci_ind(net,TX.ci_indName[c]);
  const nxt=(c===20?[4]:c===21?[3]:c===22?[0,1]:c===23?[2]:c===24?[5]:[]).map(t=>{const lv=nextLv(0,t);if(!lv)return "";const T=MAP.tiles[t][lv-1];
    return `<div style="font-size:12px;color:#6b5a3a">${TX.ci_next(TN_(t),lv,T[1],T[2],T[3],T[4],T[5])}</div>`}).join("");
  el.innerHTML=`<div class="cn">${TX.ci_sel(cardName(c))}</div><div>${what}${TX.ci_discard}</div>${nxt}
  <div>${TX.ci_counts(n(1),S.era?TX.rail:TX.canal,n(2),n(4),n(3))}</div>
  ${!mode&&n(1)?`<div class="hint" style="margin-top:4px">${TX.ci_glow}</div>`:""}`;
}
function renderFxBar(){
  const el=document.getElementById('fxbar');
  const recent=S.log.slice(-4).filter(l=>!ERA_CODES.includes(l));
  const html=recent.length?`<div style="color:#6b5a3a">${TX.recent}${recent.slice(-2).map(fmtLog).join(" · ")}</div>`:"";
  if(el.dataset.h!==html){el.dataset.h=html;el.innerHTML=html}
}
/* ---------- side panel ---------- */
function label(a){
  const d=D(a),cost=X.preview(a),c=cost>0?` · £${cost}`:"";
  switch(d.t){
    case 1:{const li=MAP.slots[d.x][0],ss=locSlots(li),L=locName(li)+(ss.length>1?` ${tr('slotN',ss.indexOf(d.x)+1)}`:''),lv=nextLv(0,d.y),T=MAP.tiles[d.y][lv-1];
      return TX.l_build(L,TN_(d.y),lv,T[4],T[5],c)}
    case 2:case 8:{const l=MAP.links[d.x];return `${locName(l[0])} ↔ ${locName(l[1])}${c}`}
    case 3:case 9:case 11:return TX.l_dev(TN_(d.x),nextLv(0,d.x),c);
    case 4:case 10:{const s=S.slots[d.x];return TX.l_sell(locName(MAP.slots[d.x][0]),TN_(s[1]),s[2],MAP.tiles[s[1]][s[2]-1][7])}
    case 7:return S.phase===4?TX.l_skipBonus:TX.l_finish;
  }
  return "?";
}
function nextLv(p,t){const st=S.players[p].stock[t];for(let i=0;i<st.length;i++)if(st[i])return i+1;return 0}
function showOpts(list){
  const o=document.getElementById('opts');o.innerHTML="";
  list.slice().sort((a,b)=>label(a).localeCompare(label(b),LANG)).forEach(a=>{
    const b=document.createElement('button');b.textContent=label(a);if(D(a).t===7)b.className='done';b.onclick=()=>doAct(a);o.appendChild(b)});
}
function render(){
  const me=S.players[0];
  document.getElementById('status').textContent=S.over?TX.gameOver:TX.status(eraName(),S.round,S.rounds,S.deck,pname(S.cur));
  document.getElementById('me').innerHTML=TX.me(me.money,(me.lvl>=0?"+":"")+me.lvl,me.vp,me.spent);
  const th=document.getElementById('turnhint');
  if(S.over){const rank=S.players.map((p,i)=>({i,vp:p.vp,m:p.money})).sort((a,b)=>b.vp-a.vp||b.m-a.m);
    th.innerHTML=`<b>${TX.final}</b> — `+rank.map((r,k)=>TX.place(k+1,pn(r.i),r.vp)).join(" · ")+` <button class="big" onclick="document.getElementById('setup').style.display='flex'">${TX.newGame}</button>`;}
  else th.innerHTML=S.cur===0?TX.yourTurn(S.acts):TX.thinking(pn(S.cur));
  // hand
  const h=document.getElementById('hand');h.innerHTML="";
  me.hand.forEach((c,i)=>{const b=document.createElement('button');b.className=cardCls(c)+(i===sel&&S.phase===0?" sel":"");b.textContent=cardName(c);
    b.onclick=()=>{sel=i;if(mode==='scout'||mode==='loan'||mode==='pass')mode=null;render()};h.appendChild(b)});
  renderCardInfo();renderFxBar();
  // actions
  const A=document.getElementById('acts'),AH=document.getElementById('ahint');A.innerHTML="";document.getElementById('opts').innerHTML="";AH.textContent="";
  if(S.cur===0&&!S.over){
    if(S.phase===0){
      const mine=LEGAL.filter(a=>D(a).c===sel);
      const has=t=>mine.filter(a=>D(a).t===t);
      const defs=[["build",TX.acts.build,1],["net",S.era?TX.rail:TX.canal,2],["dev",TX.acts.dev,3],["sell",TX.acts.sell,4],["loan",TX.acts.loan,5],["scout",TX.acts.scout,6],["pass",TX.acts.pass,0]];
      defs.forEach(([k,n,t])=>{const b=document.createElement('button');b.textContent=n;const L=has(t);b.disabled=!L.length;if(mode===k)b.className='on';
        b.onclick=()=>{if(t===5||t===6||t===0){if(mode===k){doAct(L[0]);return}mode=k;render();return}mode=k;render();focusTargets()};A.appendChild(b)});
      if(mode){const t=defs.find(d=>d[0]===mode)[2],L=has(t);
        if(t===5||t===6||t===0){AH.textContent=({5:TX.ah_loan,6:TX.ah_scout,0:TX.ah_pass})[t]+TX.ah_again;}
        else{showOpts(L);AH.textContent=TX.ah_mode[mode]}
      }else AH.textContent=TX.ah_pick;
    }else{
      AH.textContent=TX.ah_phase[S.phase];
      showOpts(LEGAL);
    }
  }
  // players
  let t=`<table><tr>${TX.th.map(x=>`<th>${x}</th>`).join("")}</tr>`;
  S.order.forEach((p,k)=>{const P=S.players[p];t+=`<tr style="${p===S.cur?'background:#fff1c9':''}"><td>${k+1}</td><td>${pn(p)}</td><td>${P.vp}</td><td>£${P.money}</td><td>${P.lvl}</td><td>£${P.spent}</td><td>${P.hand.length}</td></tr>`});
  document.getElementById('players').innerHTML=t+"</table>";
  const cp=S.coal?8-((S.coal+1)>>1):8,ip=S.iron?6-((S.iron+1)>>1):6;
  document.getElementById('market').innerHTML=TX.market(S.coal,cp,S.iron,ip);
  // stock
  document.getElementById('stock').innerHTML=TX.TN.map((n,t)=>{const lv=nextLv(0,t);if(!lv)return `<div><span class="tag" style="background:${TCOL[t]}">${n}</span> ${TX.allUsed}</div>`;
    const T=MAP.tiles[t][lv-1],left=me.stock[t].reduce((a,b)=>a+b,0);
    const res=(T[2]?TX.st_coal(T[2]):"")+(T[3]?TX.st_iron(T[3]):"");
    const extra=t<=2?TX.st_sellBeer(T[7]):t===5?TX.st_makesBeer(S.era?2:1):TX.st_makes(T[7],t===3);
    return `<div><span class="tag" style="background:${TCOL[t]}">${n}</span>${TX.stockLine(lv,T[1],res,T[4],T[5],T[6],extra,T[8],T[9],left)}</div>`}).join("");
  document.getElementById('log').innerHTML=S.log.slice().reverse().map(l=>`<div>${fmtLog(l)}</div>`).join("");
  renderCoach();
  renderMapHint();
  if(SHEET_ACTS)closeSheet();else if(INFO_LOC!=null)showLocInfo(INFO_LOC);
  draw();
}
boot().catch(e=>{document.querySelector('#setup .box').innerHTML=`<h2>${TX.loadFail}</h2><p>${TX.loadFailText}${e.message}</p>`});
</script>
