<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24162b">
<meta name="color-scheme" content="dark">
<meta name="description" content="보석 상인 엔진 빌딩 카드 게임. AI 대전과 초보자용 코치 모드.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="젬 바자르">
<style>:root{padding-top:env(safe-area-inset-top,0px)}img{max-width:100%}</style>
<title>젬 바자르</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Gowun+Dodum&family=Gowun+Batang:wght@700&display=swap">
<style>
/* 레이아웃: 벨벳 보석함 위의 시장. 폰에선 한 줄로(상단 상인 → 후원자 → 시장 → 은행 → 내 자리), 넓은 화면에선 시장 | 내 자리 두 열. 하단에 고정된 행동 바. */
:root{
  --velvet:#24162b; --velvet-2:#2f1e38; --velvet-3:#3d2948;
  --brass:#d2aa55; --brass-soft:#8c7140;
  --parch:#f1e6d0; --parch-2:#e3d3b4; --ink:#2a1d22; --ink-soft:#6b5a55;
  --text:#efe6f2; --text-dim:#b7a5bd;
  --g0:#efe9dc; --g1:#3c66cc; --g2:#2e9c6b; --g3:#c93b4c; --g4:#2c2a33; --g5:#e2b43f;
  --g0e:#a99f8b; --g1e:#1f3d86; --g2e:#17603f; --g3e:#7e1c2a; --g4e:#0e0d12; --g5e:#93701c;
  --danger:#e0727e;
  --f-display:"Marcellus","Gowun Batang",Georgia,serif;
  --f-title:"Gowun Batang","Marcellus",serif;
  --f-body:"Gowun Dodum",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:dark;
}
html,body{background:var(--velvet);color:var(--text)}
:root{--t:1}
:root[data-text="lg"]{--t:1.14}
:root[data-text="xl"]{--t:1.28}
body{margin:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,.card,.coin,.deck,.patron{touch-action:manipulation}
#board,.rivals,.purse,.bank{-webkit-user-select:none;user-select:none}
body{font-family:var(--f-body);font-size:calc(14px * var(--t));min-height:100%;
  background:
    radial-gradient(120% 60% at 50% 0%, var(--velvet-3) 0%, transparent 60%),
    repeating-linear-gradient(135deg, rgba(255,255,255,.012) 0 2px, transparent 2px 6px),
    var(--velvet);
  background-attachment:fixed;}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 120px}
header.top{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;padding-block:4px 12px}
.brand{font-family:var(--f-title);font-weight:700;font-size:22px;letter-spacing:.02em;color:var(--brass)}
.brand small{display:block;font-family:var(--f-display);font-size:10px;letter-spacing:.32em;color:var(--text-dim);font-weight:400}
.round{margin-left:auto;order:0;font-family:var(--f-display);color:var(--text-dim);font-size:13px;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--brass-soft);color:var(--brass);font-size:calc(14px * var(--t));white-space:nowrap}
.btn.solid{background:var(--brass);color:var(--velvet);border-color:var(--brass);font-weight:700}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.small{min-height:32px;padding:0 12px;font-size:calc(13px * var(--t))}

/* 배치: data-lay = phone(한 열) | wide2(시장 | 코치·내 자리) | wide3(코치 | 시장 | 내 자리). data-short = 낮은 가로 화면 */
.layout{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);grid-template-areas:"rivals" "coach" "board" "seat"}
.layout>.rivals{grid-area:rivals;margin:0}
.layout>.coach{grid-area:coach;margin:0}
.layout>#board{grid-area:board;min-width:0}
.layout>.side{grid-area:seat;min-width:0}
.btn.small.icon-btn{width:34px;padding:0}
.icon-btn svg{width:20px;height:20px;flex:none}
:root[data-lay="phone"] .wrap{max-width:720px}
:root[data-lay="phone"] .rivals{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(112px,1fr);overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
:root[data-lay="phone"] .rivals::-webkit-scrollbar{display:none}
@media (max-width:480px){.round{order:9;width:100%;margin:-4px 0 0;text-align:left;font-size:12px}header.top .btn.small{padding:0 10px}#coachBtn{margin-left:auto}}
:root[data-lay="wide2"] .wrap{max-width:1180px}
:root[data-lay="wide2"] .layout{grid-template-columns:minmax(0,1fr) minmax(320px,400px);grid-template-areas:"board rivals" "board coach" "board seat";grid-template-rows:auto auto 1fr;align-items:start}
:root[data-lay="wide3"] .wrap{max-width:1560px}
:root[data-lay="wide3"] .layout{grid-template-columns:minmax(300px,360px) minmax(0,1fr) minmax(320px,400px);grid-template-areas:"coach board rivals" "coach board seat";grid-template-rows:auto 1fr;align-items:start}
:root[data-lay^="wide"] .rivals{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
:root[data-lay="wide3"] .layout>.coach{position:sticky;top:10px;max-height:calc(100dvh - 90px);overflow:auto}
:root[data-lay^="wide"] #board,:root[data-lay="phone"] #board{margin-inline:auto;width:100%}
:root[data-lay^="wide"] #board{position:sticky;top:10px}
:root[data-lay^="wide"] .bank{max-width:460px;margin-inline:auto}
:root[data-short] .wrap{padding-block:6px 76px}
:root[data-short] header.top{padding-block:0 6px}
:root[data-short] .brand{font-size:18px}
:root[data-short] .brand small{display:none}
:root[data-short] .round{margin:0 0 0 auto;width:auto;order:0}
:root[data-short] .layout{gap:10px}
:root[data-short] .rival{padding:5px 8px;gap:3px}
:root[data-short] .rivals .mini:last-child{display:none}
:root[data-short] #board .label{display:none}
/* 낮은 가로 화면: 후원자는 한 줄 칩, 은행은 카드 오른쪽에 세로로 */
:root[data-short] #board{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"pat pat" "mkt bank";gap:6px 10px;align-items:center}
:root[data-short] #patrons{grid-area:pat;grid-template-columns:repeat(5,auto)!important;justify-content:start;margin:0}
:root[data-short] #market{grid-area:mkt}
:root[data-short] #market .tier:last-child{margin-bottom:0}
:root[data-short] .patron{display:flex;align-items:center;gap:5px;padding:3px 7px 3px 5px}
:root[data-short] .patron .portrait{width:22px;border-radius:50%}
:root[data-short] .patron .pv{position:static;font-size:15px}
:root[data-short] .patron .req{flex-wrap:nowrap}
:root[data-short] .bank{grid-area:bank;grid-template-columns:repeat(2,40px);gap:10px 8px;margin:0!important;max-width:none}
:root[data-short] .coin{width:40px}
:root[data-short] .coin .n,:root[data-short] .coin .s{min-width:17px;height:17px;font-size:11px}
:root[data-short] .patrons{margin-bottom:8px}
:root[data-short] .bank{margin-top:8px}
:root[data-short] .coinname{display:none}
:root[data-short] .bar-in{min-height:50px;padding-block:6px}
:root[data-short] .bar .msg{font-size:12.5px}
.coach .brief-line{display:none}
.coach.compact .coach-more{display:none}
.coach.compact .brief-line{display:block}
.coach-more{display:grid;gap:10px}
.coach-head .tools{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.setting{display:grid;gap:6px}
.seg.four{grid-template-columns:repeat(4,1fr)}
.devinfo{font-size:12px;color:var(--text-dim);margin:0}

.label{font-family:var(--f-display);font-size:calc(11px * var(--t));letter-spacing:.24em;text-transform:uppercase;color:var(--text-dim);margin:0 0 8px;display:flex;justify-content:space-between;gap:8px}
.label b{font-family:var(--f-body);letter-spacing:0;text-transform:none;font-weight:400}

/* 상인 줄 */
.rivals{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:6px;margin-bottom:16px}
.rival{border:1px solid rgba(210,170,85,.18);border-radius:10px;padding:8px;background:rgba(0,0,0,.18);display:grid;gap:6px;min-width:0}
.rival.on{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset, 0 0 18px rgba(210,170,85,.18)}
.rival .nm{display:flex;align-items:baseline;gap:6px;min-width:0}
.rival .nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.rival .nm em{font-style:normal;font-size:calc(11px * var(--t));color:var(--text-dim)}
.rival .pts{margin-left:auto;font-family:var(--f-display);font-size:20px;color:var(--brass);line-height:1}
.mini{display:flex;flex-wrap:wrap;gap:3px 6px;font-size:calc(11.5px * var(--t));color:var(--text-dim);font-variant-numeric:tabular-nums}
.mini i{display:inline-flex;align-items:center;gap:2px;font-style:normal}
.mini svg{width:12px;height:12px}

/* 후원자 */
.patrons{display:grid;grid-template-columns:repeat(5,minmax(0,80px));gap:6px;margin-bottom:16px}
.opt .patron{width:96px}
.patron{min-width:0;border-radius:8px;padding:3px;background:linear-gradient(160deg,#5a3d2c,#3a2619);border:1px solid #7b5a3c;display:grid;gap:4px;position:relative;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.patron .portrait{display:block;width:100%;height:auto;border-radius:5px;border:1px solid #2a1a12}
.patron .pn{font-size:10.5px;word-break:keep-all;color:var(--parch);text-align:center;line-height:1.2}
.patron .pv{position:absolute;left:7px;top:5px;font-family:var(--f-display);font-size:20px;color:#fff;line-height:1;text-shadow:0 1px 3px rgba(0,0,0,.9)}
.patron .req{display:flex;flex-wrap:wrap;gap:2px;justify-content:center}
.patron .req span{width:16px;height:19px;font-size:11.5px}
.req span{width:18px;height:20px;border-radius:3px;display:grid;place-items:center;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}

/* 시장 */
.tier{display:grid;grid-template-columns:.82fr repeat(4,1fr);gap:6px;margin-bottom:6px}
.deck,.card{aspect-ratio:5/7;max-width:100%;border-radius:8px;position:relative}
.deck{background:repeating-linear-gradient(45deg,var(--velvet-3) 0 6px,var(--velvet-2) 6px 12px);border:1px solid var(--brass-soft);display:grid;place-items:center;align-content:center;gap:2px;color:var(--brass)}
.deck .tn{font-family:var(--f-display);font-size:18px;letter-spacing:.1em}
.deck .cnt{font-size:11px;color:var(--text-dim);font-variant-numeric:tabular-nums}
.deck.empty{opacity:.3}
.card{container-type:inline-size;background:linear-gradient(180deg,var(--parch) 0%,var(--parch) 34%,var(--parch-2) 100%);color:var(--ink);border:1px solid #c8b591;box-shadow:0 2px 0 rgba(0,0,0,.25),0 4px 10px rgba(0,0,0,.25);overflow:hidden;text-align:left;width:100%;display:block;transition:transform .15s}
.card .art{position:absolute;inset:0;width:100%;height:100%;display:block}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:24%;background:var(--band);opacity:.92;z-index:1;box-shadow:0 1px 0 rgba(0,0,0,.25)}
.card .p,.card .bonus,.card .cost,.card .tier-mark{z-index:2}
.card .p{position:absolute;left:7cqw;top:3cqw;font-family:var(--f-display);font-size:max(13px,27cqw);line-height:1;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.card .bonus{position:absolute;right:5cqw;top:5cqw;width:max(14px,25cqw);height:max(14px,25cqw);filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
.card .cost{position:absolute;left:5cqw;bottom:5cqw;display:grid;gap:2.5cqw;grid-template-rows:repeat(3,auto);grid-auto-flow:column;align-content:end}
.cost span{box-shadow:0 0 0 1.5px rgba(255,255,255,.85),0 1px 2px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;width:max(14px,24cqw);height:max(14px,24cqw);border-radius:50%;font-size:max(9.5px,15cqw);font-weight:700;font-variant-numeric:tabular-nums;border:1px solid rgba(0,0,0,.25)}
.card .tier-mark{position:absolute;right:5cqw;bottom:3cqw;font-family:var(--f-display);font-size:max(8px,12cqw);color:var(--parch);letter-spacing:.1em;text-shadow:0 1px 2px rgba(0,0,0,.8)}
.card.light .p{color:var(--ink);text-shadow:none}
.card.can{outline:2px solid var(--brass);outline-offset:2px}
.card.can::after{z-index:2;content:"구매 가능";position:absolute;right:4cqw;bottom:18cqw;font-size:max(8px,11.5cqw);background:var(--brass);color:var(--velvet);padding:1px 4px;border-radius:3px;font-weight:700}
@media (hover:hover){.card:hover{transform:translateY(-2px)}}
.slot-empty{aspect-ratio:5/7;border:1px dashed rgba(255,255,255,.1);border-radius:8px}
.card.back{background:repeating-linear-gradient(45deg,var(--velvet-3) 0 6px,var(--velvet-2) 6px 12px);border-color:var(--brass-soft)}
.card.back::before{display:none}

/* 은행 */
.bank{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:16px}
.coin{position:relative;aspect-ratio:1;max-width:64px;width:100%;justify-self:center;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.2),transparent 55%),var(--velvet-3);border:2px solid var(--brass-soft);transition:transform .12s, box-shadow .12s}
.coin svg{width:58%;height:58%}
.coin .n{position:absolute;right:-4px;bottom:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--velvet);border:1px solid var(--brass-soft);font-size:12px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.coin .s{position:absolute;left:-4px;top:-4px;min-width:20px;height:20px;border-radius:999px;background:var(--brass);color:var(--velvet);font-weight:700;font-size:12px;display:grid;place-items:center}
.coin.sel{border-color:var(--brass);box-shadow:0 0 0 3px rgba(210,170,85,.35);transform:translateY(-3px)}
.coin.zero{opacity:.35}
.coin.gold{cursor:default}
.coinname{text-align:center;font-size:11px;color:var(--text-dim);margin-top:6px}

/* 내 자리 */
.seat{border:1px solid rgba(210,170,85,.3);border-radius:14px;padding:14px;background:linear-gradient(180deg,rgba(0,0,0,.22),rgba(0,0,0,.1));display:grid;gap:14px}
.seat-head{display:flex;align-items:center;gap:10px}
.seat-head h2{margin:0;font-family:var(--f-title);font-size:calc(18px * var(--t))}
.seat-head .pts{margin-left:auto;font-family:var(--f-display);font-size:30px;color:var(--brass);line-height:1}
.seat-head .pts small{font-size:12px;color:var(--text-dim);margin-left:2px}
.purse{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.purse .cell{display:grid;justify-items:center;gap:4px;border-radius:10px;padding:6px 0;border:1px solid transparent}
.purse .cell svg{width:24px;height:24px}
.purse .cell .v{font-variant-numeric:tabular-nums;font-size:13px}
.purse .cell .v b{font-family:var(--f-display);font-size:17px;color:var(--text)}
.purse .cell .v span{color:var(--brass);font-size:12px}
.purse.discarding .cell.has{border-color:var(--danger);cursor:pointer;background:rgba(224,114,126,.08)}
.legend{font-size:calc(12px * var(--t));color:var(--text-dim)}
.legend span{color:var(--brass)}
.reserved{display:grid;grid-template-columns:repeat(3,minmax(0,84px));gap:8px}
.reserved .empty{aspect-ratio:5/7;border:1px dashed rgba(255,255,255,.12);border-radius:8px;display:grid;place-items:center;color:var(--text-dim);font-size:calc(11px * var(--t))}
.won-nobles{display:flex;gap:6px;flex-wrap:wrap}
.log{display:grid;gap:4px;font-size:calc(12.5px * var(--t));color:var(--text-dim);max-height:150px;overflow:auto;margin:0;padding:0;list-style:none}
.log li b{color:var(--text);font-weight:700}

/* 하단 행동 바 */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:linear-gradient(180deg,rgba(36,22,43,.85),var(--velvet) 40%);border-top:1px solid rgba(210,170,85,.35);padding-bottom:env(safe-area-inset-bottom,0px);backdrop-filter:blur(6px)}
.bar-in{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:10px;min-height:64px}
.bar .msg{flex:1;min-width:0;font-size:calc(13.5px * var(--t));line-height:1.35}
.bar .msg strong{color:var(--brass)}
.bar .chips{display:inline-flex;gap:3px;vertical-align:middle;margin-right:4px}
.bar .chips svg{width:20px;height:20px}
.dots{display:inline-flex;gap:3px;margin-left:6px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--brass);animation:bl 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.25}50%{opacity:1}}

/* 시트·오버레이 */
.veil{position:fixed;inset:0;z-index:40;background:rgba(10,5,14,.66);display:grid;align-items:end;justify-items:center}
@media (min-width:640px){.veil{align-items:center}}
.sheet{width:min(460px,100%);background:var(--velvet-2);border:1px solid var(--brass-soft);border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px;max-height:92vh;max-height:92dvh;overflow:auto;overscroll-behavior:contain}
@media (min-width:640px){.sheet{border-radius:18px}}
.sheet h3{margin:0;font-family:var(--f-title);font-size:calc(19px * var(--t));text-wrap:balance}
.sheet p{margin:0;color:var(--text-dim);line-height:1.5}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap}
.sheet .row .btn{flex:1}
.big-card{width:clamp(120px,34vw,170px);justify-self:center}
.big-card .card{pointer-events:none}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid rgba(210,170,85,.25);border-radius:10px;text-align:left}
.opt[aria-pressed="true"]{border-color:var(--brass);background:rgba(210,170,85,.1)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seatrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.seatrow input{min-width:0;width:100%;height:40px;border-radius:10px;border:1px solid rgba(210,170,85,.3);background:var(--velvet);color:var(--text);padding:0 12px;font:inherit}
.toggle{display:inline-grid;grid-template-columns:1fr 1fr;border:1px solid var(--brass-soft);border-radius:999px;overflow:hidden}
.toggle button{padding:8px 12px;font-size:calc(13px * var(--t));color:var(--text-dim)}
.toggle button[aria-pressed="true"]{background:var(--brass);color:var(--velvet);font-weight:700}
.rank{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.rank li{display:flex;gap:10px;align-items:baseline;padding:8px 10px;border-radius:8px;background:rgba(0,0,0,.2)}
.rank li.win{background:rgba(210,170,85,.16);border:1px solid var(--brass)}
.rank .pp{margin-left:auto;font-family:var(--f-display);font-size:20px;color:var(--brass)}
.rules{font-size:calc(13px * var(--t));color:var(--text-dim);line-height:1.6;padding-left:18px;margin:0}
.rules b{color:var(--text)}
/* 코치 */
.plan{border-top:1px solid rgba(210,170,85,.2);padding-top:10px;display:grid;gap:4px}
.plan .ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700}
.opps{margin:0;padding:0;list-style:none;display:grid;gap:2px;font-size:calc(12.5px * var(--t));color:var(--text-dim)}
.opps b{color:var(--text)}
.vbadge{position:absolute;right:4cqw;top:27%;z-index:2;background:#6cc38f;color:#0f2a1c;font-size:max(8px,11.5cqw);font-weight:700;padding:1px 4px;border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.guide h4{margin:4px 0 0;font-family:var(--f-title);font-size:calc(15px * var(--t));color:var(--brass)}
.guide p,.guide li{font-size:calc(13px * var(--t));line-height:1.6;color:var(--text-dim)}
.guide b{color:var(--text)}
.guide ul{margin:0;padding-left:18px}
.bchip{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:4px;font-size:calc(12px * var(--t));font-weight:700;vertical-align:1px;white-space:nowrap}
:root{--good:#6cc38f;--ok:#b7a5bd;--meh:#e3a35a;--bad:#e0727e}
.coach{border:1px solid var(--brass-soft);border-radius:14px;padding:12px 14px;margin-bottom:16px;background:linear-gradient(135deg,rgba(210,170,85,.10),rgba(0,0,0,.15));display:grid;gap:10px}
.coach-head{display:flex;align-items:center;gap:8px}
.coach-head h2{margin:0;font-family:var(--f-title);font-size:calc(16px * var(--t));color:var(--brass)}
.coach-head .stage{font-size:calc(12px * var(--t));color:var(--text-dim)}

.coach .tip{margin:0;font-size:calc(13px * var(--t));line-height:1.55;color:var(--text-dim)}
.coach .tip b{color:var(--text)}
.coach .rec-line{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap}
.coach .rec-line .what{font-weight:700;font-size:calc(15px * var(--t));min-width:0}
.coach .warn{margin:0;padding:8px 10px;border-radius:8px;background:rgba(224,114,126,.12);border:1px solid rgba(224,114,126,.45);font-size:calc(13px * var(--t));line-height:1.5}
.why{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:calc(13px * var(--t));line-height:1.5}
.why li{display:grid;grid-template-columns:16px 1fr;gap:4px}
.why li::before{font-weight:700;text-align:center}
.why li.pro::before{content:"+";color:var(--good)}
.why li.con::before{content:"−";color:var(--bad)}
.why li.neu::before{content:"·";color:var(--text-dim)}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:calc(12px * var(--t));font-weight:700;white-space:nowrap;border:1px solid currentColor}
.pill.g-best{color:var(--velvet);background:var(--brass);border-color:var(--brass)}
.pill.g-good{color:var(--good)}
.pill.g-ok{color:var(--ok)}
.pill.g-meh{color:var(--meh)}
.pill.g-bad{color:var(--bad)}
.notes{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:calc(13px * var(--t));line-height:1.5}
.notes li{display:grid;gap:2px;padding-top:8px;border-top:1px solid rgba(255,255,255,.06)}
.notes li:first-child{border-top:0;padding-top:0}
.notes .nh{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.notes .nd{color:var(--text-dim)}
details.more summary{cursor:pointer;color:var(--brass);font-size:calc(13px * var(--t));list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary{margin-bottom:8px}
.evals{display:grid;gap:10px}
.eval{border:1px solid rgba(210,170,85,.22);border-radius:10px;padding:10px;display:grid;gap:6px}
.eval .eh{display:flex;align-items:center;gap:8px;font-weight:700}
.eval .cmp{font-size:calc(12.5px * var(--t));color:var(--text-dim);line-height:1.5;margin:0}
.rec{position:relative}
.card.rec,.coin.rec,.deck.rec,.purse .cell.rec{box-shadow:0 0 0 3px var(--brass),0 0 16px rgba(210,170,85,.55);animation:recp 1.6s ease-in-out infinite}
.rec-tag{position:absolute;left:50%;top:-9px;transform:translateX(-50%);background:var(--brass);color:var(--velvet);font-size:10px;font-weight:700;padding:1px 6px;border-radius:999px;z-index:2;white-space:nowrap;pointer-events:none}
@keyframes recp{0%,100%{box-shadow:0 0 0 2px var(--brass),0 0 8px rgba(210,170,85,.35)}50%{box-shadow:0 0 0 3px var(--brass),0 0 18px rgba(210,170,85,.7)}}
.bar .grade-line{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px;font-size:calc(12.5px * var(--t));color:var(--text-dim)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border:1px solid rgba(210,170,85,.25);border-radius:10px}
.switch span small{display:block;color:var(--text-dim);font-size:calc(12px * var(--t))}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const $ = id => document.getElementById(id);
const gem = (c, cls='') => `<svg class="${cls}" aria-hidden="true"><use href="#g${c}"/></svg>`;
const chipCol = c => `background:var(--g${c});color:${c===0||c===5?'var(--ink)':'#fff'}`;

function load(){
  const n = W.state_build();
  st = JSON.parse(dec.decode(new Uint8Array(W.memory.buffer, W.state_ptr(), n)));
  ana = null;
}
const humans = () => st.players.map((p,i)=>p.ai?-1:i).filter(i=>i>=0);

function newGame(){
  clearTimeout(timer);
  let mask = 0;
  for (let i=0;i<cfg.n;i++) if (cfg.seats[i].ai) mask |= 1<<i;
  names = cfg.seats.slice(0,cfg.n).map((s,i)=> (s.name||'').trim() || (s.ai?AI_NAMES[i]:`플레이어 ${i+1}`));
  W.new_game(cfg.n, mask, (Math.random()*4294967295)>>>0);
  sel=[0,0,0,0,0]; flash=''; prevLog=[]; notes=[]; briefed=false;
  load(); prevLog = st.log.map(JSON.stringify);
  const h = humans(); viewP = h.length ? h[0] : 0;
  $('overlay').innerHTML='';
  render(); tick();
}

function newEntries(){
  const cur = st.log.map(JSON.stringify);
  const last = prevLog[prevLog.length-1];
  let i = last ? cur.lastIndexOf(last) : -1;
  const out = (last && i<0) ? cur.slice(-3) : cur.slice(i+1);
  prevLog = cur;
  return out.map(s=>JSON.parse(s));
}

function describe(e){
  const who = `<b>${names[e.p]}</b>`;
  switch(e.a){
    case 'take': { const g=e.g.map((n,c)=>n?`${GEM[c]}${n>1?' ×'+n:''}`:'').filter(Boolean).join(', '); return `${who} ${g} 가져감`; }
    case 'res': return e.blind ? `${who} ${TIER[e.tier]}단계 덱에서 몰래 예약${e.gold?' · 금 +1':''}` : `${who} ${GEM[e.card.c]} 카드 예약${e.gold?' · 금 +1':''}`;
    case 'buy': return `${who} ${GEM[e.card.c]} 카드 구매${e.card.p?` · ${e.card.p}점`:''}`;
    case 'noble': return `${who} 후원자 ${PATRONS[e.n].name} 방문 · 3점`;
    case 'disc': return `${who} ${GEM[e.g.findIndex(x=>x)]} 반납`;
    case 'final': return `${who} 15점 달성! 이번 라운드가 마지막이에요`;
    case 'pass': return `${who} 할 수 있는 행동이 없어 넘김`;
  }
  return '';
}

function tick(){
  if (st.phase==='over'){ render(); showOver(); return; }
  const p = st.players[st.cur];
  if (p.ai){
    render();
    timer = setTimeout(()=>{
      const who = st.cur, pre = (cfg.coach && st.phase==='main') ? getAna() : null;
      W.ai_step(); load();
      const ev = newEntries();
      flash = ev.map(describe).filter(Boolean).join(' · ');
      if (pre){ const n = addNote(who, st.last, pre); if (n) flash += `<br><span style="color:var(--text-dim)">${n.short}</span>`; }
      render(); tick();
    }, cfg.coach ? 1400 : 900);
    return;
  }
  if (viewP !== st.cur && humans().length>1 && st.phase==='main'){
    render(); showHandoff(); return;
  }
  viewP = st.cur; render();
  if (cfg.coach && !briefed && st.phase==='main'){ briefed = true; showBriefing(); }
}

function move(fn){
  const who = st.cur, pre = (cfg.coach && st.phase==='main') ? getAna() : null;
  if (fn()!==0) return;
  load();
  if (pre) addNote(who, st.last, pre);
  afterHuman(true);
}
function afterHuman(loaded){
  if (!loaded) load();
  sel=[0,0,0,0,0];
  const ev = newEntries();
  flash = ev.map(describe).filter(Boolean).join(' · ');
  closeOverlay(); tick();
}

/* ---------- 렌더 ---------- */
function cardHTML(c, opts={}){
  if (!c) return `<div class="slot-empty"></div>`;
  if (opts.back) return `<div class="card back" aria-label="숨긴 ${TIER[c.t]}단계 카드"></div>`;
  const cost = c.cost.map((n,i)=>n?`<span style="${chipCol(i)}">${n}</span>`:'').join('');
  const label = `${GEM[c.c]} 카드, ${c.p}점, 비용 ${c.cost.map((n,i)=>n?GEM[i]+' '+n:'').filter(Boolean).join(' ')}`;
  const tag = opts.tag || 'button';
  return `<${tag} ${tag==='button'?'type="button"':''} class="card ${c.c===0?'light':''} ${opts.can?'can':''}" style="--band:linear-gradient(135deg,var(--g${c.c}),var(--g${c.c}e))" ${opts.act?`data-act="${opts.act}"`:''} aria-label="${label}">
    ${art(c)}${c.p?`<span class="p">${c.p}</span>`:''}${gem(c.c,'bonus')}${cfg.coach&&isValue(c)?'<span class="vbadge">가성비</span>':''}
    <span class="cost">${cost}</span><span class="tier-mark">${TIER[c.t]}</span></${tag}>`;
}
function nobleHTML(n, named){
  return `<div class="patron" title="${PATRONS[n.id].name}" aria-label="후원자 ${PATRONS[n.id].name}, 3점, 조건 ${n.req.map((v,i)=>v?GEM[i]+' 보너스 '+v:'').filter(Boolean).join(', ')}">
    ${portrait(n)}<span class="pv">3</span>${named?`<span class="pn">${PATRONS[n.id].name}</span>`:''}
    <div class="req">${n.req.map((v,i)=>v?`<span style="${chipCol(i)}">${v}</span>`:'').join('')}</div></div>`;
}
const myTurn = () => st.phase!=='over' && !st.players[st.cur].ai && st.cur===viewP;

function render(){
  $('round').textContent = `라운드 ${st.turn}${st.final?' · 마지막':''}`;
  // 상인 줄
  $('rivals').innerHTML = st.players.map((p,i)=>{
    const tok = p.tokens.reduce((a,b)=>a+b,0);
    return `<div class="rival ${i===st.cur&&st.phase!=='over'?'on':''}">
      <div class="nm"><span>${names[i]}</span><em>${p.ai?'AI':'사람'}</em><span class="pts">${p.pts}</span></div>
      <div class="mini">${p.bonus.map((b,c)=>`<i>${gem(c)}${b}</i>`).join('')}</div>
      <div class="mini"><i>토큰 ${tok}</i><i>예약 ${p.reserved.length}</i></div></div>`;
  }).join('');
  $('patrons').style.gridTemplateColumns = `repeat(${st.players.length+1},minmax(0,80px))`;
  $('patrons').innerHTML = st.nobles.map(n=>nobleHTML(n)).join('') || `<p class="legend">남은 후원자가 없어요</p>`;

  const legal = new Set(st.legal), mine = myTurn() && st.phase==='main';
  $('market').innerHTML = [2,1,0].map(t=>`<div class="tier">
    <button type="button" class="deck ${st.deck[t]?'':'empty'}" data-act="deck${t}" ${st.deck[t]?'':'disabled'} aria-label="${TIER[t]}단계 덱, ${st.deck[t]}장">
      <span class="tn">${TIER[t]}</span><span class="cnt">${st.deck[t]}장</span></button>
    ${st.board[t].map((c,s)=>cardHTML(c,{act:`m${t}${s}`, can: mine && legal.has(`b${t}${s}`)})).join('')}</div>`).join('');

  $('bank').innerHTML = st.bank.map((n,c)=>`<div>
    <button type="button" class="coin ${c===5?'gold':''} ${n?'':'zero'} ${sel[c]?'sel':''}" ${c<5?`data-act="t${c}"`:'disabled'} aria-label="${GEM[c]} 토큰 ${n}개${sel[c]?`, ${sel[c]}개 선택`:''}">
      ${gem(c)}<span class="n">${n}</span>${sel[c]?`<span class="s">${sel[c]}</span>`:''}</button>
    <div class="coinname">${GEM[c]}</div></div>`).join('');

  renderSeat(); renderCoach(); renderBar(); markRec();
  fitBoard();
}

function renderSeat(){
  const p = st.players[viewP];
  const disc = st.phase==='discard' && myTurn();
  const tok = p.tokens.reduce((a,b)=>a+b,0);
  const showFace = !p.ai;
  const res = [0,1,2].map(i=>{
    const c = p.reserved[i];
    if (!c) return `<div class="empty">빈 칸</div>`;
    return cardHTML(c,{act:`r${i}`, back: !showFace, can: myTurn() && st.phase==='main' && st.legal.includes(`r${i}`)});
  }).join('');
  $('seat').innerHTML = `<section class="seat" aria-label="내 자리">
    <div class="seat-head"><h2>${names[viewP]}</h2><span class="pts">${p.pts}<small>/ 15점</small></span></div>
    <div>
      <p class="label">보유 <b>토큰 ${tok}/10 · 카드 ${p.cards}장</b></p>
      <div class="purse ${disc?'discarding':''}">${p.tokens.map((n,c)=>`<${disc&&n?'button type="button" data-act="x'+c+'"':'div'} class="cell ${n?'has':''}" aria-label="${GEM[c]} 토큰 ${n}개${c<5?', 보너스 '+p.bonus[c]:''}">
        ${gem(c)}<span class="v"><b>${n}</b>${c<5?` <span>+${p.bonus[c]}</span>`:''}</span></${disc&&n?'button':'div'}>`).join('')}</div>
      <p class="legend" style="margin:8px 0 0">큰 숫자는 토큰, <span>+숫자</span>는 카드 보너스(영구 할인)예요. 금은 아무 색으로나 쓸 수 있어요.</p>
    </div>
    <div><p class="label">예약 카드 <b>최대 3장</b></p><div class="reserved">${res}</div></div>
    ${p.nobles.length?`<div><p class="label">모신 후원자</p><div class="won-nobles">${p.nobles.map(id=>`<div class="patron" style="width:60px" title="${PATRONS[id].name}">${portrait({id})}<span class="pv">3</span><span class="pn">${PATRONS[id].name}</span></div>`).join('')}</div></div>`:''}
    <div><p class="label">기록</p><ul class="log">${st.log.slice(-12).reverse().map(e=>`<li>${describe(e)}</li>`).join('') || '<li>첫 수를 기다리는 중</li>'}</ul></div>
  </section>`;
}

function selValid(){
  const picked = sel.map((n,c)=>n?c:-1).filter(c=>c>=0);
  if (picked.length===1 && sel[picked[0]]===2) return true;
  const avail = st.bank.slice(0,5).filter(n=>n>0).length;
  return picked.length>0 && sel.every(n=>n<=1) && picked.length===Math.min(3,avail);
}

function renderBar(){
  const bar = $('bar');
  const cp = st.players[st.cur];
  if (st.phase==='over'){ bar.innerHTML = `<div class="msg">게임이 끝났어요.</div><button class="btn solid" type="button" data-act="result">결과 보기</button>`; return; }
  if (cp.ai){ bar.innerHTML = `<div class="msg">${flash?flash+'<br>':''}<strong>${names[st.cur]}</strong> 고민 중<span class="dots"><i></i><i></i><i></i></span></div>`; return; }
  if (!myTurn()){ bar.innerHTML = `<div class="msg"><strong>${names[st.cur]}</strong> 차례예요.</div><button class="btn solid" type="button" data-act="handoff">시작</button>`; return; }
  if (st.phase==='discard'){
    const over = cp.tokens.reduce((a,b)=>a+b,0) - 10;
    bar.innerHTML = `<div class="msg">토큰은 10개까지 가질 수 있어요. <strong>${over}개</strong>를 더 반납하세요. 내 자리에서 토큰을 누르면 돼요.</div>`; return;
  }
  if (st.phase==='noble'){ bar.innerHTML = `<div class="msg">후원자 두 명 이상이 찾아왔어요. 한 명을 고르세요.</div><button class="btn solid" type="button" data-act="nobles">고르기</button>`; showNobles(); return; }
  const total = sel.reduce((a,b)=>a+b,0);
  if (total){
    const ok = selValid();
    let gl = '';
    if (cfg.coach){
      const {e, full} = selEval(), A = getAna();
      if (e){
        const g = gradeOf(e, A), r = reasons(e, st.cur).find(x=>x.t!=='neu');
        gl = full ? `<button type="button" class="grade-line" data-act="selDetail">${pill(g)}<span>${r?r.s:''}</span><span style="color:var(--brass)">자세히</span></button>`
                  : `<div class="grade-line">이 색으로 완성하면 최선: ${actLabel(e)} ${pill(g)}</div>`;
      }
    }
    bar.innerHTML = `<div class="msg"><span class="chips">${sel.flatMap((n,c)=>Array(n).fill(gem(c))).join('')}</span>${ok?'':'<br>'+hintSel()}${gl}</div>
      <button class="btn" type="button" data-act="clear">취소</button><button class="btn solid" type="button" data-act="takeGo" ${ok?'':'disabled'}>가져오기</button>`;
    return;
  }
  const pass = st.legal.includes('pass');
  const recTxt = cfg.coach ? `<br><span style="color:var(--text-dim)">코치 추천: <b style="color:var(--brass)">${actLabel(getAna().acts[0])}</b></span>` : '';
  bar.innerHTML = `<div class="msg">${flash?flash+'<br>':''}<strong>${names[st.cur]}</strong> 차례 · 보석을 고르거나 카드를 누르세요.${recTxt}</div>${pass?'<button class="btn" type="button" data-act="pass">넘기기</button>':''}`;
}
function hintSel(){
  const avail = st.bank.slice(0,5).filter(n=>n>0).length;
  const need = Math.min(3,avail);
  return `<span style="color:var(--text-dim);font-size:12px">서로 다른 색 ${need}개, 또는 4개 이상 남은 색을 한 번 더 눌러 같은 색 2개</span>`;
}

function tapToken(c){
  if (!myTurn() || st.phase!=='main' || st.bank[c]===0 && !sel[c]) return;
  const picked = sel.filter(n=>n).length;
  if (sel[c]===0){
    if (sel.some(n=>n===2)) sel=[0,0,0,0,0];
    if (sel.filter(n=>n).length>=3) return;
    sel[c]=1;
  } else if (sel[c]===1 && picked===1 && st.bank[c]>=4){
    sel[c]=2;
  } else sel[c]=0;
  render();
}

/* ---------- 시트 ---------- */
function openSheet(html){ $('overlay').innerHTML = `<div class="veil" data-act="close"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`; const b=$('overlay').querySelector('.sheet button'); b&&b.focus(); }
function closeOverlay(){ $('overlay').innerHTML=''; }

function costText(c){
  const p = st.players[viewP];
  const parts = c.cost.map((n,i)=>{ if(!n) return ''; const net=Math.max(0,n-p.bonus[i]); return `${GEM[i]} ${n}${p.bonus[i]?` → ${net}`:''}`;}).filter(Boolean);
  return parts.join(', ');
}
function shortfall(c){
  const p = st.players[viewP]; let s=0;
  for (let i=0;i<5;i++) s += Math.max(0, c.cost[i]-p.bonus[i]-p.tokens[i]);
  return Math.max(0, s - p.tokens[5]);
}
function cardSheet(c, buyCode, resArgs, fromRes){
  const p = st.players[viewP];
  const can = myTurn() && st.phase==='main';
  const canBuy = can && st.legal.includes(buyCode);
  const canRes = can && !fromRes && p.reserved.length<3;
  const sf = shortfall(c);
  openSheet(`<div class="big-card">${cardHTML(c,{tag:'div'})}</div>
    <h3>${GEM[c.c]} 카드 · ${c.p}점</h3>
    <p>비용: ${costText(c)}${canBuy?'':`<br>${sf?`보석이 <b style="color:var(--text)">${sf}개</b> 부족해요.`:''}`}</p>
    ${!can?'<p>지금은 내 차례가 아니에요.</p>':''}
    <div class="row">
      ${fromRes?'':`<button class="btn" type="button" data-act="${canRes?'doRes':''}" ${canRes?'':'disabled'} data-a="${resArgs}">예약${st.bank[5]?' + 금 1':''}</button>`}
      <button class="btn solid" type="button" data-act="${canBuy?'doBuy':''}" ${canBuy?'':'disabled'} data-a="${buyCode}">구매</button>
    </div>
    ${coachEvals(fromRes?[buyCode.replace(/^r/,'bres:')]:[`buy:${resArgs.replace(',',':')}`,`res:${resArgs.replace(',',':')}`])}
    <button class="btn" type="button" data-act="close">닫기</button>`);
}
function coachEvals(codes){
  if (!cfg.coach || !myTurn() || st.phase!=='main') return '';
  const A = getAna();
  const rows = codes.map(c=>A.acts.find(x=>x.code===c)).filter(Boolean);
  if (!rows.length) return '<p>코치: 지금은 이 카드로 할 수 있는 행동이 없어요. 부족한 보석을 모으거나 다른 카드를 보세요.</p>';
  return `<div class="evals">${rows.map(e=>evalBlock(e,A,st.cur)).join('')}</div>`;
}
function deckSheet(t){
  const p = st.players[viewP];
  const can = myTurn() && st.phase==='main' && p.reserved.length<3 && st.deck[t]>0;
  openSheet(`<h3>${TIER[t]}단계 덱 · ${st.deck[t]}장</h3>
    <p>맨 위 카드를 다른 상인 몰래 예약해요. ${st.bank[5]?'금 토큰 1개도 받아요.':'금 토큰은 다 떨어졌어요.'}</p>
    ${p.reserved.length>=3?'<p>예약 칸이 가득 찼어요.</p>':''}
    <div class="row"><button class="btn" type="button" data-act="close">닫기</button>
    <button class="btn solid" type="button" data-act="${can?'doRes':''}" data-a="${t},4" ${can?'':'disabled'}>몰래 예약</button></div>
    ${coachEvals([`res:${t}:4`])}`);
}
function showNobles(){
  openSheet(`<h3>어느 후원자를 모실까요?</h3><p>한 턴에 한 명만 모실 수 있어요. 남은 후원자는 나중에 찾아올 수도 있어요.</p>
    <div class="row">${st.pending.map((ni,i)=>`<button type="button" class="opt" data-act="noble${i}">${nobleHTML(st.nobles[ni],true)}</button>`).join('')}</div>`);
}
function showHandoff(){
  openSheet(`<h3>${names[st.cur]} 차례</h3><p>기기를 ${names[st.cur]}에게 넘겨 주세요. 예약 카드가 보이지 않도록 다른 사람의 화면은 가려 두었어요.</p>
    ${flash?`<p>${flash}</p>`:''}
    <button class="btn solid" type="button" data-act="handoff">시작</button>`);
}
function showOver(){
  const order = st.players.map((p,i)=>({p,i})).sort((a,b)=>b.p.pts-a.p.pts || a.p.cards-b.p.cards);
  const w = st.winners.map(i=>names[i]).join(', ');
  openSheet(`<h3>${w} 승리!</h3><p>동점이면 카드를 더 적게 산 상인이 이겨요.</p>
    <ol class="rank">${order.map(({p,i})=>`<li class="${st.winners.includes(i)?'win':''}"><b>${names[i]}</b><span style="color:var(--text-dim);font-size:12px">카드 ${p.cards} · 후원 ${p.nobles.length}</span><span class="pp">${p.pts}</span></li>`).join('')}</ol>
    <div class="row"><button class="btn" type="button" data-act="setup">설정 바꾸기</button><button class="btn solid" type="button" data-act="again">한 판 더</button></div>`);
}
function showSetup(){
  const segs = [2,3,4].map(n=>`<button type="button" class="btn small ${cfg.n===n?'solid':''}" data-act="n${n}">${n}명</button>`).join('');
  const rows = cfg.seats.slice(0,cfg.n).map((s,i)=>`<div class="seatrow">
    <input id="seat${i}" value="${(s.name||'').replace(/"/g,'&quot;')}" placeholder="${s.ai?AI_NAMES[i]:'플레이어 '+(i+1)}" aria-label="${i+1}번 자리 이름">
    <div class="toggle"><button type="button" aria-pressed="${!s.ai}" data-act="h${i}">사람</button><button type="button" aria-pressed="${s.ai}" data-act="a${i}">AI</button></div></div>`).join('');
  openSheet(`<h3>새 게임</h3><p>AI와 겨루거나, 사람끼리 기기 하나를 돌려 가며 할 수 있어요.</p>
    <div class="seg">${segs}</div><div class="opts">${rows}</div>
    <button type="button" class="switch" data-act="coachToggle" aria-pressed="${cfg.coach}"><span>코치 모드(튜토리얼)<small>매 차례 추천 수, 내 선택 평가, 다른 상인의 수 해설</small></span><span class="pill ${cfg.coach?'g-best':'g-ok'}">${cfg.coach?'켜짐':'꺼짐'}</span></button>
    <div class="row"><button class="btn" type="button" data-act="close">닫기</button><button class="btn solid" type="button" data-act="start">시작</button></div>`);
}
function syncNames(){ for (let i=0;i<cfg.n;i++){ const el=$('seat'+i); if(el) cfg.seats[i].name = el.value; } }
function showRules(){
  openSheet(`<h3>규칙 한눈에</h3><ol class="rules">
    <li>내 차례에는 <b>한 가지</b>만 해요: 서로 다른 색 보석 3개 가져오기 · 4개 이상 남은 색 2개 가져오기 · 카드 예약(금 1개) · 카드 구매.</li>

/* ---------- 코치 ---------- */
const GRADES = {
  best:{label:'최선', cls:'g-best'}, good:{label:'좋음', cls:'g-good'},
  ok:{label:'무난', cls:'g-ok'}, meh:{label:'아쉬움', cls:'g-meh'}, bad:{label:'나쁨', cls:'g-bad'}
};
const pill = g => `<span class="pill ${GRADES[g].cls}">${GRADES[g].label}</span>`;
const josa = (w, a, b) => { const c = w.charCodeAt(w.length-1); return (c>=0xAC00 && c<=0xD7A3 && (c-0xAC00)%28) ? w+a : w+b; };

function getAna(){
  if (ana) return ana;
  const n = W.analyze_build();
  ana = JSON.parse(dec.decode(new Uint8Array(W.memory.buffer, W.state_ptr(), n)));
  return ana;
}
function gradeOf(e, A){
  const best = A.acts[0];
  if (e.win) return 'best';
  if (best.win) return 'bad';
  if (best.blocks && !e.blocks) return e===best ? 'best' : 'bad';
  const gap = best.score - e.score;
  if (gap <= 0.5) return 'best';
  if (gap <= 2.5) return 'good';
  if (gap <= 5) return 'ok';
  if (gap <= 10) return 'meh';
  return 'bad';
}
const cardName = c => `${GEM[c.c]} ${c.p}점 카드(${TIER[c.t]})`;
function actLabel(e){
  const [k,a,b] = e.code.split(':');
  if (k==='take'){ const m=+a; return [0,1,2,3,4].filter(c=>m&(1<<c)).map(c=>GEM[c]).join('·') + ' 가져오기'; }
  if (k==='two') return `${GEM[+a]} 2개 가져오기`;
  if (k==='res') return b==='4' ? `${TIER[+a]}단계 덱에서 몰래 예약` : `${cardName(e.card)} 예약`;
  if (k==='buy') return `${cardName(e.card)} 구매`;
  if (k==='bres') return `예약해 둔 ${cardName(e.card)} 구매`;
  return '넘기기';
}
/* 한 수의 장단점: [{t:'pro'|'con'|'neu', s:문장}] */
function reasons(e, who){
  const R = [], me = st.players[who];
  const kind = e.code.split(':')[0];
  const cardPts = e.pts - 3*e.noble;
  if (e.win) R.push({t:'pro', s:'이 수로 15점 이상이 돼요. 승리를 굳히는 수예요.'});
  if (e.blocks) R.push({t:'pro', s:'다른 상인이 다음 차례에 이 카드로 이길 수 있었어요. 예약해서 막아요.'});
  if (cardPts>0 && kind!=='res') R.push({t:'pro', s:`카드 점수 +${cardPts}점`});
  if (e.noble) R.push({t:'pro', s:'보너스가 후원자 조건을 채워 후원자가 찾아와요 (+3점)'});
  if ((kind==='buy'||kind==='bres') && e.card){
    const g = GEM[e.card.c];
    R.push({t:'pro', s:`${g} 보너스가 생겨 앞으로 ${josa(g,'이','가')} 필요한 카드가 영원히 1개씩 싸져요${e.demand>=3?` (시장 카드 ${e.demand}장이 ${josa(g,'을','를')} 요구)`:''}`});
    if (e.nobleHelp && e.nobleHelp.length && !e.noble) R.push({t:'pro', s:`후원자 조건(${g})에 한 걸음 가까워져요`});
    if (e.value) R.push({t:'pro', s:`가성비 카드: 한 색만 요구해서 그 색 보너스가 쌓일수록 점수를 싸게 얻어요`});
    if (e.saved>0) R.push({t:'neu', s:`가진 보너스로 보석 ${e.saved}개를 할인받아요`});
    if (e.goldUsed>0) R.push({t:'neu', s:`만능 금 토큰 ${e.goldUsed}개를 써요`});
  }
  if (kind==='res'){
    if (e.gold) R.push({t:'pro', s:'만능 금 토큰 +1 (어떤 색으로도 쓸 수 있어요)'});
    else R.push({t:'con', s:'금 토큰이 다 떨어져서 예약해도 금을 못 받아요'});
    if (e.deny!==undefined) R.push({t:'pro', s:`${names[e.deny]}님이 다음 차례에 사서 점수를 크게 올릴 카드예요. 가로채서 견제해요`});
    if (e.resNext) R.push({t:'pro', s:'받은 금을 보태면 다음 차례에 이 카드를 바로 살 수 있어요'});
    if (e.value) R.push({t:'pro', s:'가성비 카드를 다른 상인보다 먼저 찜해 둬요'});
    else if (e.card && e.card.p>=3) R.push({t:'pro', s:'고득점 카드를 다른 상인보다 먼저 찜해 둬요'});
    if (me.reserved.length>=2) R.push({t:'con', s:'예약 칸(최대 3장)이 꽉 차서 앞으로 예약을 못 해요'});
    else R.push({t:'neu', s:'예약은 3장까지라 칸을 아껴 쓰는 게 좋아요'});
    if (e.code.endsWith(':4')) R.push({t:'neu', s:'무엇이 나올지 모르는 대신 상대에게 정보를 안 줘요'});
  }
  if (kind==='take'||kind==='two'){
    if (e.target && e.tAfter < e.tBefore) R.push({t:'pro', s:`${e.target.t===2&&e.tAfter>=2?'장기 목표':'목표'} ${cardName(e.target)}까지 ${e.tBefore}턴 → ${e.tAfter}턴`});
    else if (e.target && e.tAfter===0) R.push({t:'pro', s:`다음 차례에 ${cardName(e.target)}을 살 수 있어요`});
    else if (e.target) R.push({t:'con', s:`목표 ${cardName(e.target)}에 바로 다가가진 못해요`});
    if (e.useful < e.taken) R.push({t:'con', s:`가져온 ${e.taken}개 중 ${e.taken-e.useful}개는 지금 노릴 카드에 쓰이지 않아요`});
    if (e.discards>0) R.push({t:'con', s:`토큰이 10개를 넘어 ${e.discards}개를 도로 반납해야 해요`});
    if (e.emptied && e.emptied.length) R.push({t:'neu', s:`${e.emptied.map(c=>GEM[c]).join('·')} 토큰이 은행에서 바닥나 다른 상인이 못 가져가요`});
  }
  if (e.fit) R.push({t:'pro', s:'지금 전략에 맞는 수예요'});
  if (e.affordNext>0 && kind!=='buy' && kind!=='bres') R.push({t:'pro', s:`다음 차례에 살 수 있는 카드가 ${e.affordNext}장 생겨요`});
  if (e.danger && e.danger.length && !e.win) R.push({t:'con', s:`이 수 뒤에도 ${e.danger.map(i=>names[i]).join(', ')}님이 다음 차례에 이길 수 있어요`});
  return R;
}
/* 추천 수가 더 나은 이유 (한두 줄) */
function whyBest(e, best){
  if (e===best || e.code===best.code) return '';
  const out = [];
  if (best.win) out.push('추천 수로 바로 승리할 수 있었어요');
  if (best.blocks && !e.blocks) out.push('추천 수는 상대의 승리를 막아요');
  if (best.pts > e.pts) out.push(`추천 수는 지금 ${best.pts}점을 얻어요`);
  const bk = best.code.split(':')[0], ek = e.code.split(':')[0];
  if ((bk==='buy'||bk==='bres') && (ek==='take'||ek==='two')) out.push('살 수 있을 때 사 두면 보너스가 영구히 남아요');
  if ((ek==='take'||ek==='two') && e.useful<e.taken && best.useful===best.taken) out.push('추천 수는 가져오는 보석이 모두 쓸모 있어요');
  if (e.discards > (best.discards||0)) out.push('추천 수는 토큰을 버리지 않아요');
  if (best.target && e.target && best.tAfter < e.tAfter) out.push(`추천 수가 목표 카드에 ${e.tAfter-best.tAfter}턴 더 빨리 다가가요`);
  if (bk==='res' && ek!=='res') out.push(best.deny!==undefined ? `추천 수는 ${names[best.deny]}님의 고득점 카드를 가로채 견제해요` : best.resNext ? '추천 수는 금을 받아 다음 차례에 그 카드를 확실히 사요' : '추천 수는 좋은 카드를 찜하고 금을 챙겨요');
  if (best.fit && !e.fit) out.push('추천 수가 지금 전략에 더 맞아요');
  if (ek==='res' && bk!=='res') out.push('예약은 한 턴을 쓰지만 점수도 보너스도 바로 늘지 않아요');
  return out.slice(0,2).join(' · ') || `추천 수(${actLabel(best)})가 장기적으로 조금 더 유리해요`;
}
function evalBlock(e, A, who, title){
  const g = gradeOf(e, A), R = reasons(e, who), best = A.acts[0];
  const cmp = whyBest(e, best);
  return `<div class="eval"><div class="eh">${pill(g)}<span>${title||actLabel(e)}</span></div>
    <ul class="why">${R.slice(0,4).map(r=>`<li class="${r.t}">${r.s}</li>`).join('')}</ul>
    ${cmp?`<p class="cmp">추천: <b style="color:var(--text)">${actLabel(best)}</b><br>${cmp}</p>`:''}</div>`;
}

    <h4>2. 고득점 카드 전략</h4><p>두 가지 색 보너스를 크게 키워서 2·3단계 고득점 카드를 할인으로 사요. 후원자 경쟁이 심하거나 시장에 내 색 고득점 카드가 많을 때 유리해요. <b>다른 상인과 주력 색이 겹치지 않는 게 좋아요.</b></p>
    <h4>3. 가성비 카드 4종</h4><p>한 가지 색만 요구하는 점수 카드예요. 그 색 보너스가 있으면 아주 싸게 점수를 얻어요. 시장에서 <b>가성비</b> 표시가 붙어 있어요.</p>
    <ul><li>I단계: 한 색 4개 → 1점</li><li>II단계: 한 색 5개 → 2점</li><li>II단계: 한 색 6개 → 3점</li><li>III단계: 한 색 7개 → 4점</li></ul>
    <h4>4. 예약 활용</h4><ul>
      <li><b>내 카드 확보:</b> 다음 차례에 살 고득점·가성비 카드를 미리 찜해요. 받은 금으로 모자란 보석을 메울 수 있어요.</li>
      <li><b>견제:</b> 상대가 다음 차례에 사서 점수를 크게 올릴 카드, 또는 15점을 넘길 카드를 가로채요.</li>
      <li><b>토큰이 많을 때:</b> 10개 제한 때문에 보석을 못 가져올 때 예약으로 금만 받아요.</li></ul>
    <p>코치는 매 차례 다른 상인들의 방향, 남은 후원자, 시장의 카드를 보고 이기기 쉬운 전략을 골라 줘요. 전략은 상황에 따라 바뀔 수 있어요.</p>
    </div><button class="btn solid" type="button" data-act="close">닫기</button>`);
}
function stageTip(p){
  if (p.pts>=10 || st.final) return {name:'후반', s:'남은 점수를 가장 빨리 채울 길을 찾으세요. 점수 큰 카드와 후원자가 핵심이고, 상대가 15점 가까이 오면 그 카드를 예약으로 가로채세요.'};
  if (p.cards>=5 || p.pts>=4) return {name:'중반', s:'보너스가 쌓였으면 <b>2단계 점수 카드</b>를 노리세요. 할인 덕분에 적은 토큰으로 살 수 있어요. 후원자 조건도 챙기고, 곧 살 고득점 카드는 예약해 두면 금까지 얻어요.'};
  return {name:'초반', s:'<b>1단계의 싼 카드</b>로 보너스(영구 할인)를 먼저 모으세요. 후원자가 요구하는 색이면 더 좋아요. 토큰만 쌓아 두면 10개 제한에 걸려요.'};
}
function threatText(A){
  if (!A || !A.threats || !A.threats.length) return '';
  const who = A.threats.map(t=>names[t.p]+'님').join(', ');
  const blocker = A.acts.find(x=>x.blocks);
  return `<p class="warn"><b>주의</b> ${who}이 다음 차례에 이길 수 있어요.${blocker?` 이 수로 막을 수 있어요: <b>${actLabel(blocker)}</b>`:' 막을 수는 없으니 최대한 점수를 올리세요.'}</p>`;
}
function renderCoach(){
  const box = $('coach');
  $('coachBtn').setAttribute('aria-pressed', cfg.coach);
  $('coachBtn').classList.toggle('solid', cfg.coach);
  if (!cfg.coach || st.phase==='over'){ box.hidden = true; return; }
  box.hidden = false;
  const p = st.players[viewP], tip = stageTip(p);
  const noteHTML = notes.length ? `<details class="more" ${myTurn()?'':'open'}><summary>최근 수 해설 ${notes.length}개</summary><ul class="notes">${notes.slice(0,6).map(noteLi).join('')}</ul></details>` : '';
  let body = '';
  if (myTurn() && st.phase==='main'){
    const A = getAna(), best = A.acts[0], R = reasons(best, st.cur);
    body = `${threatText(A)}<div class="rec-line"><span class="pill g-best">추천</span><span class="what">${actLabel(best)}</span></div>
      <ul class="why">${R.slice(0,3).map(r=>`<li class="${r.t}">${r.s}</li>`).join('')}</ul>
      <div class="row" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn small solid" type="button" data-act="showRec">추천대로 고르기</button><button class="btn small" type="button" data-act="coachMore">다른 수와 비교</button></div>`;
  } else if (myTurn() && st.phase==='discard'){
    const A = getAna();
    body = `<p class="tip">버릴 토큰 추천: <b>${GEM[A.tip]}</b>. 지금 노리는 카드들에 가장 덜 필요한 색이에요. 다음부터는 토큰이 8개를 넘으면 3개를 가져오기보다 카드를 사거나 2개만 가져오는 게 좋아요.</p>`;
  } else if (myTurn() && st.phase==='noble'){
    const A = getAna();
    body = `<p class="tip">어느 후원자든 3점은 같아요. 다른 상인이 더 가까이 다가간 후원자를 가져가면 견제가 돼요. 추천: <b>${A.tip+1}번째</b> 후원자.</p>`;
  } else {
    body = `<p class="tip"><b>${names[st.cur]}</b>님 차례예요. 어떤 수를 두는지, 그 수가 왜 좋은지 해설해 드릴게요.</p>`;
  }
  const compact = coachCompact(), mainTurn = myTurn() && st.phase==='main';
  box.classList.toggle('compact', compact);
  let brief = '';
  if (mainTurn){ const A = getAna(); if (A.plan) brief = `<p class="tip brief-line">내 전략: <b>${planShort(A.plan)}</b></p>`; }
  else if (!myTurn() && notes.length) brief = `<p class="tip brief-line">${pill(notes[0].g)} <b>${names[notes[0].who]}</b> ${notes[0].meaning}</p>`;
  const more = mainTurn ? `<p class="tip">${tip.s}</p>${planBlock(getAna())}` : (myTurn() ? '' : body);
  box.innerHTML = `<div class="coach-head"><h2>코치</h2><span class="stage">${tip.name}</span><span class="tools"><button class="btn small" type="button" data-act="coachFold" aria-expanded="${!compact}">${compact?'펼치기':'접기'}</button><button class="btn small" type="button" data-act="brief">브리핑</button><button class="btn small" type="button" data-act="guide">가이드</button></span></div>
    ${brief}${myTurn() ? body : ''}<div class="coach-more">${more}${noteHTML}</div>`;
}
function noteLi(n){
  return `<li><div class="nh">${pill(n.g)}<b>${names[n.who]}</b><span>${n.title}</span></div>
    <span class="nd">${n.meaning}${n.why.length?'. '+n.why.join(', '):''}</span>
    ${n.plan&&!n.mine?`<span class="nd">방향: ${n.plan}</span>`:''}
    ${n.cmp?`<span class="nd" style="color:var(--meh)">${n.mine?'더 좋은 수':'놓친 수'}: ${n.cmp}</span>`:''}</li>`;
}
/* 추천 수를 보드에서 반짝이게 */
function recTarget(){
  if (!cfg.coach || !myTurn()) return null;
  const A = getAna();
  if (st.phase==='discard') return {sel:`[data-act="x${A.tip}"]`};
  if (st.phase!=='main') return null;
  const [k,a,b] = A.acts[0].code.split(':');
  if (k==='buy'||(k==='res'&&b!=='4')) return {sel:`[data-act="m${a}${b}"]`};
  if (k==='res') return {sel:`[data-act="deck${a}"]`};
  if (k==='bres') return {sel:`[data-act="r${a}"]`};
  if (k==='two') return {sel:`[data-act="t${a}"]`};
  if (k==='take') return {sel:[0,1,2,3,4].filter(c=>(+a)&(1<<c)).map(c=>`[data-act="t${c}"]`).join(',')};
  return null;
}
function markRec(){
  const r = recTarget(); if (!r) return;
  document.querySelectorAll('#app '+r.sel.split(',').join(',#app ')).forEach(el=>{
    el.classList.add('rec');
    if (!el.querySelector('.rec-tag')) el.insertAdjacentHTML('beforeend','<span class="rec-tag">추천</span>');
  });
}
function showRec(){
  const A = getAna(), [k,a,b] = A.acts[0].code.split(':');
  if (k==='take'){ sel=[0,1,2,3,4].map(c=>(+a)&(1<<c)?1:0); render(); return; }
  if (k==='two'){ sel=[0,0,0,0,0]; sel[+a]=2; render(); return; }
  if (k==='buy'||(k==='res'&&b!=='4')){ const c=st.board[+a][+b]; return cardSheet(c,`b${a}${b}`,`${a},${b}`,false); }
  if (k==='res') return deckSheet(+a);
  if (k==='bres'){ return cardSheet(st.players[viewP].reserved[+a],`r${a}`,'',true); }
}
/* 고른 보석 조합 평가 (덜 골랐으면 이 색들을 포함한 최선 조합) */
function selEval(){
  const A = getAna();
  const two = sel.findIndex(n=>n===2);
  if (two>=0) return {e:A.acts.find(x=>x.code===`two:${two}`), full:true};
  const mask = sel.reduce((m,n,c)=>n?m|(1<<c):m,0);
  if (selValid()) return {e:A.acts.find(x=>x.code===`take:${mask}`), full:true};
  const cands = A.acts.filter(x=>x.code.startsWith('take:') && ((+x.code.split(':')[1])&mask)===mask);
  return {e:cands[0], full:false};
}
function coachSheet(){
  const A = getAna(), who = st.cur;
  const groups = [['보석 가져오기',x=>/^(take|two)/.test(x.code)],['카드 구매',x=>/^(buy|bres)/.test(x.code)],['예약',x=>/^res/.test(x.code)]];
  const top = A.acts.slice(0,3);
  openSheet(`<h3>이번 차례 수 비교</h3><p>모든 수를 한 수씩 미리 둬 보고, 점수·보너스·후원자·목표 카드까지 남은 턴·토큰을 따져 순위를 매겼어요.</p>
    ${threatText(A)}
    <div class="evals">${top.map((e,i)=>evalBlock(e,A,who,`${i+1}위 · ${actLabel(e)}`)).join('')}</div>
    ${groups.map(([t,f])=>{ const list=A.acts.filter(f); if(!list.length) return ''; const b=list[0]; const w=list[list.length-1];
      return `<p class="tip"><b>${t}</b> 중 최선은 ${actLabel(b)} ${pill(gradeOf(b,A))}${list.length>1?`, 가장 나쁜 건 ${actLabel(w)} ${pill(gradeOf(w,A))}`:''}</p>`; }).join('')}
    <button class="btn solid" type="button" data-act="close">닫기</button>`);
}

/* ---------- 입력 ---------- */
document.addEventListener('click', ev=>{
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  if (a==='close'){ if (ev.target===el || el.tagName==='BUTTON'){ if (st.phase==='noble'&&myTurn()) return; if (el.classList.contains('veil') && $('overlay').innerHTML.includes('data-act="handoff"')) return; closeOverlay(); } return; }
  if (a==='') return;
  if (a[0]==='t' && a.length===2) return tapToken(+a[1]);
  if (a[0]==='m'){ const t=+a[1], s=+a[2]; const c=st.board[t][s]; if(c) cardSheet(c,`b${t}${s}`,`${t},${s}`,false); return; }
  if (a.startsWith('deck')) return deckSheet(+a[4]);
  if (a[0]==='r' && a.length===2){ const i=+a[1]; const c=st.players[viewP].reserved[i]; if (c && !st.players[viewP].ai) cardSheet(c,`r${i}`,'',true); return; }
  if (a[0]==='x'){ W.discard(+a[1]); return afterHuman(); }
  if (a==='clear'){ sel=[0,0,0,0,0]; return render(); }
  if (a==='takeGo'){
    const two = sel.findIndex(n=>n===2);
    const mask = sel.reduce((m,n,c)=>n?m|(1<<c):m,0);
    return move(()=> two>=0 ? W.take2(two) : W.take(mask));
  }
  if (a==='doBuy'){ const code=el.dataset.a; return move(()=> code[0]==='b'? W.buy(+code[1],+code[2]) : W.buy_reserved(+code[1])); }
  if (a==='doRes'){ const [t,s]=el.dataset.a.split(',').map(Number); return move(()=>W.reserve(t,s)); }
  if (a==='pass') return move(()=>W.pass_turn());
  if (a==='showRec') return showRec();
  if (a==='guide') return showGuide();
  if (a==='rules') return showRules();
  if (a==='coachFold'){ view.fold = coachCompact() ? 'off' : 'on'; saveView(); renderCoach(); fitBoard(); return; }
  if (a.startsWith('view:')){ const [,k,v] = a.split(':'); view[k]=v; saveView(); applyView(); return showSettings(); }
  if (a==='brief') return showBriefing();
  if (a==='selDetail'){ const {e}=selEval(); if(e) openSheet(`<h3>고른 보석 평가</h3>${evalBlock(e,getAna(),st.cur)}<button class="btn solid" type="button" data-act="close">닫기</button>`); return; }
  if (a==='coachMore') return coachSheet();
  if (a==='coachToggle'){ cfg.coach=!cfg.coach; saveCfg(); return showSetup(); }
  if (a.startsWith('noble')){ W.choose_noble(+a.slice(5)); return afterHuman(); }
  if (a==='nobles') return showNobles();
  if (a==='handoff'){ viewP = st.cur; closeOverlay(); render(); return; }
  if (a==='result') return showOver();
  if (a==='again') return newGame();
  if (a==='setup') return showSetup();
  if (/^n[234]$/.test(a)){ syncNames(); cfg.n=+a[1]; return showSetup(); }
  if (/^[ha]\d$/.test(a)){ syncNames(); cfg.seats[+a[1]].ai = a[0]==='a'; return showSetup(); }
  if (a==='start'){ syncNames(); saveCfg(); return newGame(); }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && $('overlay').innerHTML && !(st.phase==='noble'&&myTurn())) closeOverlay(); });
$('newBtn').onclick = showSetup;
$('coachBtn').onclick = ()=>{ cfg.coach=!cfg.coach; saveCfg(); render(); };
function saveCfg(){ try{localStorage.setItem('gb-cfg',JSON.stringify(cfg));}catch(e){} }
$('setBtn').onclick = showSettings;
applyView();

(async()=>{
  try{
    const bytes = Uint8Array.from(atob(WASM_B64), ch=>ch.charCodeAt(0));
    const { instance } = await WebAssembly.instantiate(bytes, {});
    W = instance.exports; newGame();
  }catch(err){ $('bar').innerHTML = `<div class="msg">게임 엔진을 불러오지 못했어요. 페이지를 새로 고쳐 주세요. (${err.message})</div>`; }
})();
</script>

</body>
